<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Les suites — cours</title>
<link rel="apple-touch-icon" href="i/icon-180.png">
<meta name="theme-color" content="#fdf9f4">
<style>

/* ── переход между страницами, как в приложении ── */
@view-transition{ navigation:auto }

@media (prefers-reduced-motion:no-preference){
  ::view-transition-old(root){
    animation:sortie 420ms cubic-bezier(.4,0,.2,1) both;
  }
  ::view-transition-new(root){
    animation:entree 500ms cubic-bezier(.215,.61,.355,1) both;
  }
  /* retour : on inverse le sens */
  html.retour::view-transition-old(root){
    animation:sortie-r 420ms cubic-bezier(.4,0,.2,1) both;
  }
  html.retour::view-transition-new(root){
    animation:entree-r 500ms cubic-bezier(.215,.61,.355,1) both;
  }
}

@keyframes sortie{
  from{ transform:translateX(0);      opacity:1 }
  to  { transform:translateX(-22%);   opacity:0 }
}
@keyframes entree{
  from{ transform:translateX(100%);   opacity:.4 }
  to  { transform:translateX(0);      opacity:1 }
}
@keyframes sortie-r{
  from{ transform:translateX(0);      opacity:1 }
  to  { transform:translateX(100%);   opacity:0 }
}
@keyframes entree-r{
  from{ transform:translateX(-22%);   opacity:.4 }
  to  { transform:translateX(0);      opacity:1 }
}

:root{
  --canvas:#fdf9f4; --warm:#f9efe4; --dust:#f4ece1; --mist:#e8ddd0;
  --ink:#241f1b; --charcoal:#4a423a; --soft:#8a8078; --slate:#b4a99c;
  --ember:#f67748; --ember-d:#d65f34;
  --ok:#3fa66a; --ok-soft:#eef7f1; --ok-line:#cfe6d9;
  --miss:#c9553d; --miss-soft:#fdf0ec; --miss-line:#f2d5cb;
  --e:cubic-bezier(.215,.61,.355,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
#toc{scroll-margin-top:74px}
body{
  background:var(--canvas); color:var(--ink);
  font:400 17px/1.7 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
  padding-bottom:80px;
}

/* ── шапка ── */
.bar{
  position:sticky; top:0; z-index:40;
  background:rgba(253,249,244,.94);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--mist);
  padding:env(safe-area-inset-top) 0 0;
}
.bar-in{
  max-width:820px; margin:0 auto;
  display:flex; align-items:center; gap:14px;
  padding:12px 22px;
}
.bar-t{flex:1;min-width:0}
.bar-t b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.bar-t span{display:block;font-size:12px;color:var(--soft);margin-top:1px}

.lang{display:flex;gap:3px;background:var(--dust);border-radius:20px;padding:3px}
.lang button{
  border:0;background:none;cursor:pointer;
  padding:6px 13px;border-radius:17px;
  font:600 12.5px/1 "Inter",sans-serif;color:var(--soft);
  transition:background .2s var(--e),color .2s var(--e);
}
.lang button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07)}

.wrap{max-width:820px;margin:0 auto;padding:0 22px}

/* ── титул ── */
.hero{padding:46px 0 34px}
.hero h1{font-size:clamp(30px,7vw,42px);line-height:1.12;letter-spacing:-.025em;font-weight:700}
.hero p{margin-top:12px;font-size:16px;color:var(--soft);line-height:1.6}

/* ── оглавление ── */
.toc{
  background:#fff;border:1px solid var(--mist);border-radius:18px;
  padding:22px 24px;margin-bottom:40px;
}
.toc h2{font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--soft);font-weight:700;margin-bottom:14px}
.toc ol{list-style:none;counter-reset:t}
.toc li{counter-increment:t;margin-bottom:2px}
.toc a{
  display:flex;gap:12px;align-items:baseline;
  padding:8px 10px;margin:0 -10px;border-radius:10px;
  color:var(--ink);text-decoration:none;font-size:15.5px;
  transition:background .16s var(--e);
}
.toc a:hover{background:var(--dust)}
.toc a::before{
  content:counter(t);flex:0 0 22px;
  font:600 12.5px/1.5 "Inter",sans-serif;color:var(--ember);
}
.toc .neuf{
  font:600 9px/1 "Inter",sans-serif;letter-spacing:.07em;
  background:var(--warm);color:var(--ember);
  padding:3px 6px;border-radius:5px;margin-left:6px;
}

/* ── раздел ── */
.sec{padding:14px 0 50px;scroll-margin-top:78px}
.sec-n{
  display:inline-block;font:600 11px/1 "Inter",sans-serif;
  letter-spacing:.1em;color:var(--ember);margin-bottom:11px;
}
.sec h2{font-size:clamp(23px,5.4vw,30px);line-height:1.22;
  letter-spacing:-.021em;font-weight:700;margin-bottom:6px}
.sec-s{font-size:14.5px;color:var(--soft);margin-bottom:24px}

.sec p{margin-bottom:17px}
.sec p b{font-weight:600}
.sec ul,.sec ol{margin:0 0 17px 21px}
.sec li{margin-bottom:7px}

/* ── типы блоков ── */
.pourquoi{
  background:var(--warm);border-radius:15px;
  padding:18px 21px;margin-bottom:24px;
  font-size:15.5px;line-height:1.62;color:var(--charcoal);
}
.pourquoi b{color:var(--ink);font-weight:600}

.image{
  border-left:3px solid var(--ember);
  background:linear-gradient(90deg,var(--warm),rgba(249,239,228,.25));
  border-radius:0 13px 13px 0;
  padding:17px 20px;margin-bottom:22px;
}
.image .lbl{
  display:block;font:600 10px/1 "Inter",sans-serif;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--ember);margin-bottom:9px;
}
.image p:last-child{margin-bottom:0}

.f{
  background:var(--dust);border-radius:13px;
  padding:19px 20px;margin:0 0 22px;
  text-align:center;font-family:Georgia,"Times New Roman",serif;
  font-size:19px;line-height:1.85;
}
.f.small{font-size:16.5px}

.ex{
  background:#fff;border:1px solid var(--mist);border-radius:13px;
  padding:17px 20px;margin-bottom:22px;font-size:15.5px;line-height:1.66;
}
.ex .lbl{
  display:block;font:600 10px/1 "Inter",sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--slate);margin-bottom:10px;
}
.ex p:last-child{margin-bottom:0}

.piege{
  background:var(--miss-soft);border:1px solid var(--miss-line);
  border-radius:13px;padding:17px 20px;margin-bottom:22px;
  font-size:15.5px;line-height:1.66;
}
.piege .lbl{
  display:block;font:600 10px/1 "Inter",sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--miss);margin-bottom:10px;
}
.piege p:last-child{margin-bottom:0}

.ds{
  background:var(--ok-soft);border:1px solid var(--ok-line);
  border-radius:13px;padding:17px 20px;margin-bottom:22px;
  font-size:15.5px;line-height:1.68;
}
.ds .lbl{
  display:block;font:600 10px/1 "Inter",sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ok);margin-bottom:10px;
}
.ds i{font-style:normal;font-family:Georgia,serif;color:var(--ink)}
.ds p:last-child{margin-bottom:0}

/* ── таблица ── */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:22px}
table{border-collapse:collapse;width:100%;min-width:400px;font-size:15px}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--mist)}
th{font-weight:600;font-size:12.5px;letter-spacing:.03em;
   text-transform:uppercase;color:var(--soft)}
tr:last-child td{border-bottom:0}

/* ── код ── */
.code{
  background:#fff;border:1px solid var(--mist);border-radius:13px;
  padding:16px 19px;margin-bottom:22px;
  font:400 14px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--charcoal);overflow-x:auto;
}
.code .kw{color:var(--ember);font-weight:600}
.code .cm{color:var(--slate)}

/* ── назад к оглавлению ── */
.up{
  display:inline-flex;align-items:center;gap:6px;
  min-height:38px;padding:0 15px;border-radius:19px;
  background:var(--dust);color:var(--soft);
  text-decoration:none;font:600 12px/1 "Inter",sans-serif;
  transition:background .18s var(--e),color .18s var(--e),transform .12s var(--e);
}
.up:hover{background:var(--mist);color:var(--charcoal)}
.up:hover{background:var(--mist)}
.up:active{transform:scale(.97)}


.toapp{
  display:grid; place-items:center;
  flex:0 0 38px; width:38px; height:38px; border-radius:50%;
  background:var(--ember); color:#fff; text-decoration:none;
  transition:background .18s var(--e), transform .12s var(--e);
}
.toapp:active{transform:scale(.92); background:var(--ember-d)}

/* ── плавающая кнопка «наверх» ── */
.fab{
  position:fixed; right:18px; z-index:50;
  bottom:calc(18px + env(safe-area-inset-bottom));
  width:52px; height:52px; border-radius:50%;
  background:#fff; border:1px solid var(--mist);
  box-shadow:0 4px 16px rgba(36,31,27,.13);
  display:grid; place-items:center; cursor:pointer;
  color:var(--charcoal); text-decoration:none;
  opacity:0; transform:translateY(14px) scale(.9); pointer-events:none;
  transition:opacity .22s var(--e), transform .26s var(--e);
}
.fab.on{opacity:1; transform:none; pointer-events:auto}
.fab:active{transform:scale(.93)}

@media (max-width:560px){
  .fab{right:15px; width:50px; height:50px}
}

/* ── низ ── */
.foot{
  border-top:1px solid var(--mist);margin-top:20px;padding:30px 0 0;
  text-align:center;
}
.foot a{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 26px;border-radius:26px;
  background:var(--ember);color:#fff;text-decoration:none;
  font:600 14.5px/1 "Inter",sans-serif;
  transition:transform .12s var(--e),background .2s var(--e);
}
.foot a:active{transform:scale(.98);background:var(--ember-d)}

.v{font-family:Georgia,serif;font-style:italic}

@media (max-width:560px){
  body{font-size:16.5px}
  .wrap{padding:0 18px}
  .bar-in{padding:11px 18px}
  .hero{padding:34px 0 26px}
  .f{font-size:17px;padding:16px 15px}
  .toc{padding:19px 18px}
}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="bar-t">
      <b>Les suites</b>
      <span id="bar-sub">Première · Terminale</span>
    </div>
    <a class="toapp" href="./" id="toapp" aria-label="Exercices" title="Exercices">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h13M12 6l6 6-6 6"/>
      </svg>
    </a>
    <div class="lang">
      <button id="b-ru" class="on">Рус</button>
      <button id="b-fr">Fr</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <h1 id="h-titre">Последовательности<br>с самого начала</h1>
    <p id="h-sous">Всё, что нужно знать по теме, разобрано на пальцах — с примерами из жизни и готовыми формулировками для контрольной.</p>
  </div>

  <nav class="toc" id="toc">
    <h2 id="toc-t">Содержание</h2>

  <main id="corps"></main>

  <div class="foot">
    <a href="./">
      <span id="f-txt">Перейти к упражнениям</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</div>

<script>
/* ═══════════ СОДЕРЖИМОЕ ═══════════ */
/* вставляется сборкой */
const COURS = [
 {
  "n": 1,
  "t": {
   "ru": "Доказательство по индукции",
   "fr": "Raisonnement par récurrence"
  },
  "st": {
   "ru": "Как доказать бесконечно много утверждений сразу",
   "fr": "Démontrer une infinité de cas d'un coup"
  },
  "b": [
   {
    "k": "pourquoi",
    "h": {
     "ru": "<b>Зачем это нужно.</b> Иногда надо доказать, что свойство верно для <b>всех</b> <span class=\"v\">n</span> — а их бесконечно много. Проверить каждое невозможно. Индукция решает это двумя фразами. Без неё нельзя обосновать ни одну формулу для рекуррентной последовательности, а это половина заданий бака.",
     "fr": "<b>À quoi ça sert.</b> Il faut parfois prouver qu'une propriété est vraie pour <b>tout</b> <span class=\"v\">n</span> — et il y en a une infinité. Les vérifier une par une est impossible. La récurrence règle cela en deux phrases. Sans elle, impossible de justifier une formule pour une suite récurrente — et c'est la moitié des sujets du bac."
    }
   },
   {
    "k": "image",
    "h": {
     "ru": "<p><b>Бесконечный ряд домино.</b> Как доказать, что упадут все?</p><p>Нужны ровно две вещи:</p><p><b>1.</b> Толкнуть первую — она точно упадёт.<br><b>2.</b> Убедиться, что <i>любая</i> падающая костяшка валит следующую.</p><p>Всё. Если оба пункта верны — упадёт весь ряд, сколько бы костяшек ни было.</p><p>В математике: пункт 1 — <b>инициализация</b>, пункт 2 — <b>наследственность</b>.</p>",
     "fr": "<p><b>Une rangée infinie de dominos.</b> Comment prouver qu'ils tombent tous ?</p><p>Il faut exactement deux choses :</p><p><b>1.</b> Pousser le premier — il tombe.<br><b>2.</b> S'assurer que <i>n'importe quel</i> domino qui tombe fait tomber le suivant.</p><p>C'est tout. Si les deux sont vrais, toute la rangée tombe.</p><p>En maths : le point 1 est <b>l'initialisation</b>, le point 2 est <b>l'hérédité</b>.</p>"
    }
   },
   {
    "k": "p",
    "h": {
     "ru": "<b>Три обязательных шага.</b> Порядок и формулировки строго фиксированы — на контрольной за каждый дают баллы отдельно.",
     "fr": "<b>Trois étapes obligatoires.</b> L'ordre et les formulations sont stricts — chacune rapporte des points."
    }
   },
   {
    "k": "ol",
    "items": [
     {
      "ru": "<b>Initialisation</b> — проверяем свойство при первом <span class=\"v\">n</span> (обычно 0 или 1)",
      "fr": "<b>Initialisation</b> — on vérifie la propriété au premier rang (souvent 0 ou 1)"
     },
     {
      "ru": "<b>Hérédité</b> — предполагаем верным для некоторого фиксированного <span class=\"v\">n</span>, доказываем для <span class=\"v\">n</span>+1",
      "fr": "<b>Hérédité</b> — on suppose vrai à un rang <span class=\"v\">n</span> fixé, on démontre au rang <span class=\"v\">n</span>+1"
     },
     {
      "ru": "<b>Conclusion</b> — ссылаемся на принцип индукции",
      "fr": "<b>Conclusion</b> — on invoque le principe de récurrence"
     }
    ]
   },
   {
    "k": "piege",
    "n": {
     "ru": "Главная логическая ошибка",
     "fr": "L'erreur de logique principale"
    },
    "h": {
     "ru": "<p>На шаге наследственности пишут: <i>«Supposons que <b>pour tout</b> n, P(n) soit vraie»</i>.</p><p>Это <b>неверно</b>. Если предположить, что свойство верно для всех — доказывать нечего, ты предположил то, что требуется доказать.</p><p>Правильно: <i>«Supposons que pour un entier n <b>fixé</b>, P(n) soit vraie»</i>.</p><p>Предполагаем для <b>одной</b> костяшки, а не для всего ряда.</p><p><b>Проверяющий смотрит именно на эту фразу.</b> По ней видно, понял человек механизм или заучил.</p>",
     "fr": "<p>À l'hérédité, certains écrivent : <i>« Supposons que <b>pour tout</b> n, P(n) soit vraie »</i>.</p><p>C'est <b>faux</b>. Si on suppose la propriété vraie partout, il n'y a plus rien à démontrer.</p><p>La bonne formulation : <i>« Supposons que pour un entier n <b>fixé</b>, P(n) soit vraie »</i>.</p><p>On suppose pour <b>un seul</b> domino, pas pour toute la rangée.</p><p><b>Le correcteur regarde cette phrase.</b> Elle montre si tu as compris ou récité.</p>"
    }
   },
   {
    "k": "ex",
    "n": {
     "ru": "Разбор целиком",
     "fr": "Démonstration rédigée"
    },
    "h": {
     "ru": "<p>Дано <span class=\"v\">u<sub>0</sub></span> = 1 и <span class=\"v\">u<sub>n+1</sub></span> = 2<span class=\"v\">u<sub>n</sub></span> + 1.<br>Доказать: <span class=\"v\">u<sub>n</sub></span> = 2<sup><span class=\"v\">n</span>+1</sup> − 1.</p><p><b>Инициализация.</b> При <span class=\"v\">n</span> = 0 формула даёт 2¹ − 1 = 1, и <span class=\"v\">u<sub>0</sub></span> = 1 ✓</p><p><b>Наследственность.</b> Пусть для фиксированного <span class=\"v\">n</span> верно <span class=\"v\">u<sub>n</sub></span> = 2<sup><span class=\"v\">n</span>+1</sup> − 1. Тогда:</p><p><span class=\"v\">u<sub>n+1</sub></span> = 2<span class=\"v\">u<sub>n</sub></span> + 1 = 2(2<sup><span class=\"v\">n</span>+1</sup> − 1) + 1 = 2<sup><span class=\"v\">n</span>+2</sup> − 2 + 1 = 2<sup><span class=\"v\">n</span>+2</sup> − 1</p><p>А это ровно формула для ранга <span class=\"v\">n</span>+1 ✓</p><p><b>Вывод.</b> По принципу индукции формула верна для всех натуральных <span class=\"v\">n</span>.</p>",
     "fr": "<p>On donne <span class=\"v\">u<sub>0</sub></span> = 1 et <span class=\"v\">u<sub>n+1</sub></span> = 2<span class=\"v\">u<sub>n</sub></span> + 1.<br>Montrer : <span class=\"v\">u<sub>n</sub></span> = 2<sup><span class=\"v\">n</span>+1</sup> − 1.</p><p><b>Initialisation.</b> Pour <span class=\"v\">n</span> = 0 : 2¹ − 1 = 1 = <span class=\"v\">u<sub>0</sub></span> ✓</p><p><b>Hérédité.</b> Supposons que pour un entier <span class=\"v\">n</span> fixé, <span class=\"v\">u<sub>n</sub></span> = 2<sup><span class=\"v\">n</span>+1</sup> − 1. Alors :</p><p><span class=\"v\">u<sub>n+1</sub></span> = 2(2<sup><span class=\"v\">n</span>+1</sup> − 1) + 1 = 2<sup><span class=\"v\">n</span>+2</sup> − 1</p><p>C'est exactement la formule au rang <span class=\"v\">n</span>+1 ✓</p><p><b>Conclusion.</b> Par récurrence, la formule est vraie pour tout entier naturel <span class=\"v\">n</span>.</p>"
    }
   },
   {
    "k": "ex",
    "n": {
     "ru": "Совсем простой пример — для начала",
     "fr": "Un exemple très simple pour commencer"
    },
    "h": {
     "ru": "<p>Дано <span class=\"v\">u<sub>0</sub></span> = 2 и <span class=\"v\">u<sub>n+1</sub></span> = <span class=\"v\">u<sub>n</sub></span> + 3.<br>Доказать, что <span class=\"v\">u<sub>n</sub></span> = 3<span class=\"v\">n</span> + 2.</p><p><b>Шаг 1. Инициализация.</b><br>Берём <span class=\"v\">n</span> = 0 и подставляем в формулу:<br>3 × 0 + 2 = 0 + 2 = <b>2</b></p><p>А по условию <span class=\"v\">u<sub>0</sub></span> = 2. Совпало ✓</p><p><b>Шаг 2. Наследственность.</b><br>Пусть для какого-то одного <span class=\"v\">n</span> верно: <span class=\"v\">u<sub>n</sub></span> = 3<span class=\"v\">n</span> + 2.</p><p>Смотрим на следующий член. По условию:<br><span class=\"v\">u<sub>n+1</sub></span> = <span class=\"v\">u<sub>n</sub></span> + 3</p><p>Вместо <span class=\"v\">u<sub>n</sub></span> подставляем то, что предположили:<br><span class=\"v\">u<sub>n+1</sub></span> = (3<span class=\"v\">n</span> + 2) + 3 = 3<span class=\"v\">n</span> + 5</p><p><b>Шаг 3. Сравниваем.</b><br>А что должна давать формула на ранге <span class=\"v\">n</span>+1? Подставим <span class=\"v\">n</span>+1 вместо <span class=\"v\">n</span>:<br>3(<span class=\"v\">n</span>+1) + 2 = 3<span class=\"v\">n</span> + 3 + 2 = 3<span class=\"v\">n</span> + 5</p><p>Одно и то же ✓ Наследственность доказана.</p>",
     "fr": "<p>On donne <span class=\"v\">u<sub>0</sub></span> = 2 et <span class=\"v\">u<sub>n+1</sub></span> = <span class=\"v\">u<sub>n</sub></span> + 3.<br>Montrer que <span class=\"v\">u<sub>n</sub></span> = 3<span class=\"v\">n</span> + 2.</p><p><b>Étape 1. Initialisation.</b><br>On prend <span class=\"v\">n</span> = 0 dans la formule :<br>3 × 0 + 2 = <b>2</b></p><p>Or <span class=\"v\">u<sub>0</sub></span> = 2. C'est identique ✓</p><p><b>Étape 2. Hérédité.</b><br>Supposons que pour un <span class=\"v\">n</span> fixé : <span class=\"v\">u<sub>n</sub></span> = 3<span class=\"v\">n</span> + 2.</p><p>On regarde le terme suivant. Par définition :<br><span class=\"v\">u<sub>n+1</sub></span> = <span class=\"v\">u<sub>n</sub></span> + 3</p><p>On remplace <span class=\"v\">u<sub>n</sub></span> par ce qu'on a supposé :<br><span class=\"v\">u<sub>n+1</sub></span> = (3<span class=\"v\">n</span> + 2) + 3 = 3<span class=\"v\">n</span> + 5</p><p><b>Étape 3. On compare.</b><br>Que devrait donner la formule au rang <span class=\"v\">n</span>+1 ?<br>3(<span class=\"v\">n</span>+1) + 2 = 3<span class=\"v\">n</span> + 5</p><p>Identique ✓ L'hérédité est prouvée.</p>"

     "ru": "<p>Если в шаге наследственности ты нигде не подставил то, что предположил — значит ты не сделал индукцию.</p><p>Смысл шага именно в этом: взять предположение про ранг <span class=\"v\">n</span> и с его помощью получить ранг <span class=\"v\">n</span>+1.</p><p><b>Как проверить себя:</b> найди в своём решении место, где написано «подставляем гипотезу». Если такого места нет — что-то не так.</p>",
     "fr": "<p>Si dans l'hérédité tu n'as utilisé nulle part ce que tu as supposé, alors tu n'as pas fait de récurrence.</p><p>Tout le sens de l'étape est là : prendre l'hypothèse au rang <span class=\"v\">n</span> pour en déduire le rang <span class=\"v\">n</span>+1.</p><p><b>Auto-contrôle :</b> cherche dans ta copie l'endroit où tu remplaces en utilisant l'hypothèse. S'il n'existe pas, quelque chose manque.</p>"

    "h": {
     "ru": "<p>Иногда в условии написано «для всех <span class=\"v\">n</span> ⩾ 1» или «для всех <span class=\"v\">n</span> ⩾ 2».</p><p>Тогда инициализацию делают <b>именно с этого ранга</b>, а не с нуля.</p><p>Причина: свойство может быть неверным для маленьких рангов. Например, 2<sup><span class=\"v\">n</span></sup> > <span class=\"v\">n</span>² верно начиная с <span class=\"v\">n</span> = 5, но неверно при <span class=\"v\">n</span> = 3 (8 против 9).</p><p><b>Практика:</b> первое, что делаешь — находишь в условии, с какого ранга надо доказывать. Это и есть твой первый домино.</p>",
     "fr": "<p>Parfois l'énoncé dit « pour tout <span class=\"v\">n</span> ⩾ 1 » ou « pour tout <span class=\"v\">n</span> ⩾ 2 ».</p><p>On initialise alors <b>à ce rang</b>, pas à zéro.</p><p>Raison : la propriété peut être fausse aux petits rangs. Par exemple 2<sup><span class=\"v\">n</span></sup> > <span class=\"v\">n</span>² est vrai à partir de <span class=\"v\">n</span> = 5, mais faux pour <span class=\"v\">n</span> = 3 (8 contre 9).</p><p><b>En pratique :</b> la première chose à faire est de repérer dans l'énoncé le rang de départ. C'est ton premier domino.</p>"

    "h": {
     "ru": "<p>Найти предел <span class=\"v\">u<sub>n</sub></span> = (2<span class=\"v\">n</span>² + 5<span class=\"v\">n</span>) ÷ (3<span class=\"v\">n</span>² − 1).</p><p><b>Шаг 1. Смотрим на степени.</b><br>Сверху старшая степень — <span class=\"v\">n</span>². Снизу тоже <span class=\"v\">n</span>².<br>Степени равны → предел равен отношению коэффициентов.</p><p><b>Шаг 2. Берём коэффициенты при старших степенях.</b><br>Сверху перед <span class=\"v\">n</span>² стоит 2.<br>Снизу перед <span class=\"v\">n</span>² стоит 3.</p><p><b>Шаг 3. Делим.</b><br>Предел = 2/3 ≈ 0,67</p><p><b>Проверим на числах.</b> При <span class=\"v\">n</span> = 100:<br>сверху 2×10000 + 500 = 20 500<br>снизу 3×10000 − 1 = 29 999<br>отношение ≈ 0,683</p><p>При <span class=\"v\">n</span> = 10 000 получится ещё ближе к 0,667. Формула работает.</p>",

     "ru": "<p><span class=\"v\">u<sub>n</sub></span> = 7 ÷ (<span class=\"v\">n</span> + 3)</p><p>Сверху просто число 7 — оно не растёт. Снизу растёт без предела.</p><p>Представь: 7 евро делим на растущее число людей. При тысяче человек каждому достанется 0,007 евро.</p><p><b>Предел = 0.</b></p><p><b>Общее правило:</b> постоянное число, делённое на растущее, всегда даёт ноль. Совершенно неважно, насколько большое это постоянное число — хоть миллион.</p>",
     "fr": "<p><span class=\"v\">u<sub>n</sub></span> = 7 ÷ (<span class=\"v\">n</span> + 3)</p><p>En haut, juste le nombre 7 — il ne grandit pas. En bas, ça croît sans fin.</p><p>Imagine : 7 euros partagés entre un nombre croissant de personnes. À mille personnes, chacun reçoit 0,007 €.</p><p><b>Limite = 0.</b></p><p><b>Règle générale :</b> une constante divisée par une quantité qui explose donne toujours zéro. Peu importe la taille de la constante — même un million.</p>"

 {
  "n": 3,
  "t": {
   "ru": "Операции и неопределённости",
   "fr": "Opérations et formes indéterminées"
  },
  "st": {
   "ru": "Четыре случая, когда правило не работает",
   "fr": "Les quatre cas où la règle ne suffit pas"
  },
  "b": [
   {
    "k": "pourquoi",
    "h": {
     "ru": "<b>Зачем это нужно.</b> Обычно пределы складываются и умножаются как обычные числа. Но в четырёх случаях так делать нельзя — и именно эти случаи ставят на контрольных, потому что они отличают понимание от механики.",
     "fr": "<b>À quoi ça sert.</b> D'ordinaire les limites s'additionnent et se multiplient comme des nombres. Sauf dans quatre cas — et ce sont précisément ceux qu'on met en devoir, parce qu'ils séparent la compréhension du mécanisme."
    }
   },
   {
    "k": "p",
    "h": {
     "ru": "Если у двух последовательностей есть конечные пределы, их можно складывать, умножать и делить (если знаменатель не стремится к нулю).",
     "fr": "Si deux suites ont des limites finies, on peut les additionner, les multiplier et les diviser (si le dénominateur ne tend pas vers 0)."
    }
   },
   {
    "k": "f",
    "h": {
     "ru": "Четыре неопределённости:<br>∞ − ∞ &nbsp;·&nbsp; 0 × ∞ &nbsp;·&nbsp; ∞ / ∞ &nbsp;·&nbsp; 0 / 0",
     "fr": "Les quatre formes indéterminées :<br>∞ − ∞ &nbsp;·&nbsp; 0 × ∞ &nbsp;·&nbsp; ∞ / ∞ &nbsp;·&nbsp; 0 / 0"
    }
   },
   {
    "k": "image",
    "h": {
     "ru": "<p><b>Почему «неопределённость», а не «невозможно».</b></p><p>Неопределённость не значит «предела нет». Значит: <b>общего правила не хватает, чтобы решить</b>.</p><p>Смотри на ∞ − ∞ в трёх примерах:</p><p>(<span class=\"v\">n</span>+1) − <span class=\"v\">n</span> = 1 → предел <b>1</b></p><p><span class=\"v\">n</span>² − <span class=\"v\">n</span> → предел <b>+∞</b></p><p><span class=\"v\">n</span> − <span class=\"v\">n</span>² → предел <b>−∞</b></p><p>Одна и та же форма, три разных ответа.</p><p><b>Отсюда и слово:</b> форма сама по себе ничего не определяет. Надо смотреть на детали.</p>",
     "fr": "<p><b>Pourquoi « indéterminé » et non « impossible ».</b></p><p>Indéterminé ne veut pas dire « pas de limite ». Cela veut dire : <b>la règle générale ne suffit pas à trancher</b>.</p><p>Regarde ∞ − ∞ sur trois exemples :</p><p>(<span class=\"v\">n</span>+1) − <span class=\"v\">n</span> = 1 → limite <b>1</b></p><p><span class=\"v\">n</span>² − <span class=\"v\">n</span> → limite <b>+∞</b></p><p><span class=\"v\">n</span> − <span class=\"v\">n</span>² → limite <b>−∞</b></p><p>Trois fois la même forme, trois résultats.</p><p><b>D'où le mot :</b> la forme seule ne détermine rien.</p>"
    }
   },
   {
    "k": "p",
    "h": {
     "ru": "<b>Главный приём — вынести старшую степень за скобку.</b>",
     "fr": "<b>La technique principale : factoriser le terme dominant.</b>"
    }
   },
   {
    "k": "ex",
    "h": {
     "ru": "<p><span class=\"v\">n</span>² − 3<span class=\"v\">n</span> — это форма ∞ − ∞.</p><p>Выносим <span class=\"v\">n</span>²:</p><p><span class=\"v\">n</span>² − 3<span class=\"v\">n</span> = <span class=\"v\">n</span>²(1 − 3/<span class=\"v\">n</span>)</p><p>Теперь <span class=\"v\">n</span>² → +∞, а скобка → 1.</p><p>Значит произведение → <b>+∞</b>.</p>",
     "fr": "<p><span class=\"v\">n</span>² − 3<span class=\"v\">n</span> donne la forme ∞ − ∞.</p><p>On factorise par <span class=\"v\">n</span>² :</p><p><span class=\"v\">n</span>² − 3<span class=\"v\">n</span> = <span class=\"v\">n</span>²(1 − 3/<span class=\"v\">n</span>)</p><p>Or <span class=\"v\">n</span>² → +∞ et la parenthèse → 1.</p><p>Donc le produit tend vers <b>+∞</b>.</p>"
    }
   },
   {
    "k": "image",
    "h": {
     "ru": "<p><b>Идея, стоящая за вынесением.</b></p><p>В <span class=\"v\">n</span>² − 3<span class=\"v\">n</span> оба слагаемых растут. Но <b>с разной скоростью</b>.</p><p>При <span class=\"v\">n</span> = 1000: <span class=\"v\">n</span>² = 1 000 000, а 3<span class=\"v\">n</span> = 3 000.</p><p>Первое полностью подавляет второе. Отнять три тысячи от миллиона — почти ничего не изменить.</p><p><b>Вынесение делает это видимым:</b> в скобке остаётся 1 − 3/<span class=\"v\">n</span>, а 3/<span class=\"v\">n</span> стремится к нулю.</p><p><b>Одной фразой:</b> определяем, кто командует, и показываем, что остальное больше не считается.</p>",
     "fr": "<p><b>L'idée derrière la factorisation.</b></p><p>Dans <span class=\"v\">n</span>² − 3<span class=\"v\">n</span>, les deux termes grandissent. Mais <b>pas à la même vitesse</b>.</p><p>Pour <span class=\"v\">n</span> = 1000 : <span class=\"v\">n</span>² = 1 000 000 et 3<span class=\"v\">n</span> = 3 000.</p><p>Le premier écrase le second. Retirer 3 000 à un million ne change presque rien.</p><p><b>La factorisation rend cela visible :</b> il reste 1 − 3/<span class=\"v\">n</span>, et 3/<span class=\"v\">n</span> tend vers 0.</p><p><b>En une phrase :</b> on identifie qui commande, et on montre que le reste ne compte plus.</p>"
    }
   },
   {

    "n": {
     "ru": "Сначала упрости",
     "fr": "Simplifier d'abord"
    },
    "h": {
     "ru": "<p>Иногда неопределённость исчезает сама после упрощения.</p><p><span class=\"v\">n</span> × (1/<span class=\"v\">n</span>) на вид — форма ∞ × 0.</p><p>Но это просто <b>1</b> при любом <span class=\"v\">n</span>. Последовательность постоянна.</p><p><b>Правило:</b> увидел неопределённость — сначала попробуй упростить выражение, и только потом ищи приёмы.</p>",
     "fr": "<p>Parfois l'indétermination disparaît d'elle-même après simplification.</p><p><span class=\"v\">n</span> × (1/<span class=\"v\">n</span>) ressemble à la forme ∞ × 0.</p><p>Mais cela vaut <b>1</b> pour tout <span class=\"v\">n</span>. La suite est constante.</p><p><b>Règle :</b> face à une FI, commence par simplifier l'expression, puis seulement cherche une technique.</p>"

   {
    "k": "ex",
    "n": {
     "ru": "Форма 0 × ∞ — два разных исхода",
     "fr": "La forme 0 × ∞, deux résultats opposés"
    },
    "h": {
     "ru": "<p><b>Случай первый.</b> <span class=\"v\">u<sub>n</sub></span> = (1/<span class=\"v\">n</span>) × <span class=\"v\">n</span>²</p><p>Сначала форма: 1/<span class=\"v\">n</span> → 0, а <span class=\"v\">n</span>² → ∞. Значит 0 × ∞ — неопределённость.</p><p>Упрощаем: <span class=\"v\">n</span>² ÷ <span class=\"v\">n</span> = <span class=\"v\">n</span>. Предел = <b>+∞</b>.</p><p><b>Случай второй.</b> <span class=\"v\">u<sub>n</sub></span> = (1/<span class=\"v\">n</span>²) × <span class=\"v\">n</span></p><p>Форма та же: 0 × ∞.</p><p>Упрощаем: <span class=\"v\">n</span> ÷ <span class=\"v\">n</span>² = 1/<span class=\"v\">n</span>. Предел = <b>0</b>.</p><p><b>Вот почему это называется неопределённостью.</b> Форма одна, ответы прямо противоположные. Решает не форма, а кто растёт быстрее.</p>",
     "fr": "<p><b>Premier cas.</b> <span class=\"v\">u<sub>n</sub></span> = (1/<span class=\"v\">n</span>) × <span class=\"v\">n</span>²</p><p>La forme : 1/<span class=\"v\">n</span> → 0 et <span class=\"v\">n</span>² → ∞. Donc 0 × ∞, indéterminé.</p><p>On simplifie : <span class=\"v\">n</span>² ÷ <span class=\"v\">n</span> = <span class=\"v\">n</span>. Limite = <b>+∞</b>.</p><p><b>Deuxième cas.</b> <span class=\"v\">u<sub>n</sub></span> = (1/<span class=\"v\">n</span>²) × <span class=\"v\">n</span></p><p>Même forme : 0 × ∞.</p><p>On simplifie : <span class=\"v\">n</span> ÷ <span class=\"v\">n</span>² = 1/<span class=\"v\">n</span>. Limite = <b>0</b>.</p><p><b>Voilà pourquoi on dit indéterminé.</b> Même forme, résultats opposés. Ce n'est pas la forme qui décide, mais qui croît le plus vite.</p>"
    }
   },
   {
    "k": "piege",
    "n": {
     "ru": "Не всё с бесконечностью — неопределённость",
     "fr": "Tout ce qui contient l'infini n'est pas indéterminé"
    },
    "h": {
     "ru": "<p>Бывает путаница: увидел ∞ — решил, что неопределённость. Нет.</p><p><b>Спокойные случаи:</b><br>∞ + ∞ = +∞<br>∞ + 5 = +∞<br>∞ × 3 = +∞<br>5 ÷ ∞ = 0</p><p><b>Проблемные — только четыре:</b><br>∞ − ∞ · 0 × ∞ · ∞/∞ · 0/0</p><p><b>Как запомнить:</b> проблема там, где две тенденции <b>тянут в разные стороны</b>. Сложение двух бесконечностей — обе тянут в одну сторону, спорить не о чем.</p>",
     "fr": "<p>Confusion fréquente : on voit ∞ et on croit à une indétermination. Non.</p><p><b>Cas tranquilles :</b><br>∞ + ∞ = +∞<br>∞ + 5 = +∞<br>∞ × 3 = +∞<br>5 ÷ ∞ = 0</p><p><b>Les problèmes sont au nombre de quatre :</b><br>∞ − ∞ · 0 × ∞ · ∞/∞ · 0/0</p><p><b>Moyen mnémotechnique :</b> le problème apparaît quand deux tendances <b>tirent en sens contraire</b>. Additionner deux infinis, c'est tirer du même côté : rien à débattre.</p>"

   {
    "k": "ex",
    "n": {
     "ru": "Сокращение дроби спасает",
     "fr": "Simplifier avant tout"
    },
    "h": {
     "ru": "<p><span class=\"v\">u<sub>n</sub></span> = (<span class=\"v\">n</span>² − 25) ÷ (<span class=\"v\">n</span> − 5), при <span class=\"v\">n</span> > 5.</p><p><b>Шаг 1.</b> Узнаём разность квадратов:<br><span class=\"v\">n</span>² − 25 = <span class=\"v\">n</span>² − 5² = (<span class=\"v\">n</span> − 5)(<span class=\"v\">n</span> + 5)</p><p><b>Шаг 2.</b> Подставляем:<br>(<span class=\"v\">n</span> − 5)(<span class=\"v\">n</span> + 5) ÷ (<span class=\"v\">n</span> − 5)</p><p><b>Шаг 3.</b> Сокращаем (<span class=\"v\">n</span> − 5) — можно, потому что <span class=\"v\">n</span> > 5, значит не ноль:<br>остаётся <span class=\"v\">n</span> + 5</p><p><b>Предел = +∞.</b></p><p>Без сокращения была бы форма ∞/∞ и пришлось бы возиться. Всегда сначала смотри, не сокращается ли.</p>",
     "fr": "<p><span class=\"v\">u<sub>n</sub></span> = (<span class=\"v\">n</span>² − 25) ÷ (<span class=\"v\">n</span> − 5), pour <span class=\"v\">n</span> > 5.</p><p><b>Étape 1.</b> On reconnaît une différence de carrés :<br><span class=\"v\">n</span>² − 25 = (<span class=\"v\">n</span> − 5)(<span class=\"v\">n</span> + 5)</p><p><b>Étape 2.</b> On remplace :<br>(<span class=\"v\">n</span> − 5)(<span class=\"v\">n</span> + 5) ÷ (<span class=\"v\">n</span> − 5)</p><p><b>Étape 3.</b> On simplifie par (<span class=\"v\">n</span> − 5) — c'est permis car <span class=\"v\">n</span> > 5, donc non nul :<br>il reste <span class=\"v\">n</span> + 5</p><p><b>Limite = +∞.</b></p><p>Sans simplification, on aurait la forme ∞/∞. Regarde toujours d'abord si ça se simplifie.</p>"

   {
    "k": "piege",
    "n": {
     "ru": "Знак у бесконечности",
     "fr": "Le signe de l'infini"
    },
    "h": {
     "ru": "<p><span class=\"v\">u<sub>n</sub></span> = 3<span class=\"v\">n</span> − <span class=\"v\">n</span>² уходит в <b>минус</b> бесконечность, а не в плюс.</p><p>Почему: командует старшая степень, а перед <span class=\"v\">n</span>² стоит минус.</p><p><b>Проверка на числах:</b> при <span class=\"v\">n</span> = 100 получаем 300 − 10 000 = −9 700. Отрицательно и растёт по модулю.</p><p><b>Правило:</b> найди старшую степень, посмотри на её знак. Он и определяет, куда уходит последовательность.</p>",
     "fr": "<p><span class=\"v\">u<sub>n</sub></span> = 3<span class=\"v\">n</span> − <span class=\"v\">n</span>² part vers <b>moins</b> l'infini, pas vers plus.</p><p>Pourquoi : c'est le degré dominant qui commande, et <span class=\"v\">n</span>² porte un signe moins.</p><p><b>Vérification :</b> pour <span class=\"v\">n</span> = 100, on a 300 − 10 000 = −9 700. Négatif et de plus en plus grand en valeur absolue.</p><p><b>Règle :</b> repère le degré dominant, regarde son signe. C'est lui qui décide de la direction.</p>"
    }

    "h": {
     "ru": "<p><i>Pour tout n ⩾ 1, n² − 3n = n²(1 − 3/n).<br>Or lim n² = +∞ et lim (1 − 3/n) = 1.<br>Donc par produit, lim (n² − 3n) = +∞.</i></p><p>Слово <b>par produit</b> важно — оно показывает, каким правилом ты воспользовался.</p>",
     "fr": "<p><i>Pour tout n ⩾ 1, n² − 3n = n²(1 − 3/n).<br>Or lim n² = +∞ et lim (1 − 3/n) = 1.<br>Donc par produit, lim (n² − 3n) = +∞.</i></p><p>Le mot <b>par produit</b> compte : il indique la règle utilisée.</p>"
    }
   }
  ]
 },
 {
  "n": 4,
  "t": {
   "ru": "Сравнение и теорема о жандармах",
   "fr": "Comparaison et théorème des gendarmes"
  },
  "st": {
   "ru": "Найти предел, не вычисляя выражение",
   "fr": "Trouver une limite sans calculer l'expression"
  },
  "b": [
   {
    "k": "pourquoi",
    "h": {
     "ru": "<b>Зачем это нужно.</b> Иногда выражение слишком сложное — например, содержит синус, у которого вообще нет предела. Жандармы позволяют найти ответ, не трогая само выражение. На баке это стандартный приём.",
     "fr": "<b>À quoi ça sert.</b> Parfois l'expression est trop compliquée — par exemple avec un sinus, qui n'a aucune limite. Les gendarmes permettent de conclure sans y toucher. C'est un réflexe attendu au bac."
    }
   },
   {
    "k": "image",
    "h": {
     "ru": "<p><b>Откуда такое странное название.</b></p><p>Двое жандармов ведут арестанта — один слева, другой справа.</p><p>Оба идут в участок. Арестант, зажатый между ними, <b>никуда деться не может</b>.</p><p>Он приходит в участок, обязательно.</p><p><b>В математике:</b> если <span class=\"v\">u<sub>n</sub></span> зажата между двумя последовательностями, идущими к <span class=\"v\">ℓ</span>, у неё нет выбора. Она идёт к <span class=\"v\">ℓ</span>.</p>",
     "fr": "<p><b>D'où vient ce nom.</b></p><p>Deux gendarmes encadrent un prisonnier — un à gauche, un à droite.</p><p>Les deux vont au commissariat. Le prisonnier, coincé entre eux, <b>ne peut aller nulle part ailleurs</b>.</p><p>Il arrive au commissariat, forcément.</p><p><b>En maths :</b> si <span class=\"v\">u<sub>n</sub></span> est coincée entre deux suites qui vont vers <span class=\"v\">ℓ</span>, elle n'a pas le choix.</p>"
    }
   },
   {
    "k": "f",
    "h": {
     "ru": "Если <span class=\"v\">a<sub>n</sub></span> ⩽ <span class=\"v\">u<sub>n</sub></span> ⩽ <span class=\"v\">b<sub>n</sub></span><br>и <span class=\"v\">a<sub>n</sub></span> → <span class=\"v\">ℓ</span>, <span class=\"v\">b<sub>n</sub></span> → <span class=\"v\">ℓ</span><br>то <span class=\"v\">u<sub>n</sub></span> → <span class=\"v\">ℓ</span>",
     "fr": "Si <span class=\"v\">a<sub>n</sub></span> ⩽ <span class=\"v\">u<sub>n</sub></span> ⩽ <span class=\"v\">b<sub>n</sub></span><br>et <span class=\"v\">a<sub>n</sub></span> → <span class=\"v\">ℓ</span>, <span class=\"v\">b<sub>n</sub></span> → <span class=\"v\">ℓ</span><br>alors <span class=\"v\">u<sub>n</sub></span> → <span class=\"v\">ℓ</span>"
    }
   },
   {
    "k": "ex",
    "n": {
     "ru": "Классический пример",
     "fr": "L'exemple classique"
    },
    "h": {
     "ru": "<p>Найти предел sin(<span class=\"v\">n</span>) ÷ <span class=\"v\">n</span>.</p><p><b>Шаг 1.</b> Всегда начинаем с одного и того же:<br>−1 ⩽ sin(<span class=\"v\">n</span>) ⩽ 1</p><p><b>Шаг 2.</b> Делим всё на <span class=\"v\">n</span> (оно положительно):<br>−1/<span class=\"v\">n</span> ⩽ sin(<span class=\"v\">n</span>)/<span class=\"v\">n</span> ⩽ 1/<span class=\"v\">n</span></p><p><b>Шаг 3.</b> Оба края стремятся к 0.</p><p><b>Вывод.</b> По теореме о жандармах предел равен <b>0</b>.</p>",
     "fr": "<p>Trouver la limite de sin(<span class=\"v\">n</span>) ÷ <span class=\"v\">n</span>.</p><p><b>Étape 1.</b> On part toujours du même encadrement :<br>−1 ⩽ sin(<span class=\"v\">n</span>) ⩽ 1</p><p><b>Étape 2.</b> On divise par <span class=\"v\">n</span> (positif) :<br>−1/<span class=\"v\">n</span> ⩽ sin(<span class=\"v\">n</span>)/<span class=\"v\">n</span> ⩽ 1/<span class=\"v\">n</span></p><p><b>Étape 3.</b> Les deux bords tendent vers 0.</p><p><b>Conclusion.</b> Par le théorème des gendarmes, la limite vaut <b>0</b>.</p>"
    }
   },
   {
    "k": "image",
    "h": {
     "ru": "<p><b>Почему иначе никак.</b></p><p>У sin(<span class=\"v\">n</span>) <b>нет предела</b> — он вечно болтается между −1 и 1, не оседая.</p><p>Значит написать «lim sin(<span class=\"v\">n</span>) = что-то» нельзя.</p><p><b>Но</b> одно мы знаем точно: он всегда между −1 и 1. Никогда больше, никогда меньше.</p><p>Делим всё на <span class=\"v\">n</span>. Числитель остаётся ограниченным, знаменатель взрывается.</p><p>Число, зажатое между −1 и 1, поделить на миллион — получится что-то крошечное, каким бы это число ни было.</p><p><b>В этом весь фокус:</b> не нужно знать, чему равен синус. Достаточно знать, что он ограничен.</p>",
     "fr": "<p><b>Pourquoi on ne peut pas faire autrement.</b></p><p>sin(<span class=\"v\">n</span>) n'a <b>aucune limite</b> : il oscille sans fin entre −1 et 1.</p><p>Impossible donc d'écrire « lim sin(<span class=\"v\">n</span>) = quelque chose ».</p><p><b>Mais</b> on sait une chose : il reste toujours entre −1 et 1.</p><p>On divise par <span class=\"v\">n</span>. Le numérateur reste borné, le dénominateur explose.</p><p>Un nombre coincé entre −1 et 1, divisé par un million, donne quelque chose de minuscule — quel que soit ce nombre.</p><p><b>Toute l'astuce est là :</b> pas besoin de connaître sin(<span class=\"v\">n</span>). Il suffit qu'il soit borné.</p>"
    }

   {
    "k": "p",
    "h": {
     "ru": "<b>Упрощённая версия для бесконечности.</b> Когда предел бесконечный, хватает одного жандарма.",

   {
    "k": "f",

    "h": {
     "ru": "Если <span class=\"v\">u<sub>n</sub></span> ⩾ <span class=\"v\">v<sub>n</sub></span> и <span class=\"v\">v<sub>n</sub></span> → +∞<br>то <span class=\"v\">u<sub>n</sub></span> → +∞",
     "fr": "Si <span class=\"v\">u<sub>n</sub></span> ⩾ <span class=\"v\">v<sub>n</sub></span> et <span class=\"v\">v<sub>n</sub></span> → +∞<br>alors <span class=\"v\">u<sub>n</sub></span> → +∞"

   {
    "k": "image",
    "h": {
     "ru": "<p><b>Почему здесь хватает одного.</b></p><p>Чтобы сойтись к конкретному числу, надо быть зажатым <b>с двух сторон</b>. Иначе последовательность может уйти куда угодно.</p><p>Но чтобы уйти в +∞, потолка не существует. Выше бесконечности ничего нет.</p><p>Значит быть <b>выше</b> последовательности, уходящей в бесконечность, достаточно — тебя неизбежно вытолкнет вверх.</p>",
     "fr": "<p><b>Pourquoi un seul suffit ici.</b></p><p>Pour converger vers un nombre précis, il faut être coincé <b>des deux côtés</b>.</p><p>Mais pour partir à +∞, il n'y a pas de plafond. Rien au-dessus de l'infini.</p><p>Être <b>au-dessus</b> d'une suite qui part à l'infini suffit donc : on est forcément poussé vers le haut.</p>"

     "ru": "С косинусом — полностью",
     "fr": "Avec un cosinus, entièrement"

    "h": {
     "ru": "<p>Найти предел <span class=\"v\">u<sub>n</sub></span> = (4 + cos(<span class=\"v\">n</span>)) ÷ <span class=\"v\">n</span>.</p><p><b>Шаг 1. Границы косинуса.</b><br>Всегда: −1 ⩽ cos(<span class=\"v\">n</span>) ⩽ 1</p><p><b>Шаг 2. Прибавляем 4 ко всем трём частям.</b><br>4 − 1 ⩽ 4 + cos(<span class=\"v\">n</span>) ⩽ 4 + 1<br>то есть 3 ⩽ числитель ⩽ 5</p><p><b>Шаг 3. Делим всё на <span class=\"v\">n</span></b> — знак неравенства не меняется, потому что <span class=\"v\">n</span> > 0:<br>3/<span class=\"v\">n</span> ⩽ <span class=\"v\">u<sub>n</sub></span> ⩽ 5/<span class=\"v\">n</span></p><p><b>Шаг 4. Смотрим на края.</b><br>3/<span class=\"v\">n</span> → 0 и 5/<span class=\"v\">n</span> → 0</p><p><b>Вывод.</b> Оба жандарма идут в ноль. Значит и <span class=\"v\">u<sub>n</sub></span> → <b>0</b>.</p>",
     "fr": "<p>Trouver la limite de <span class=\"v\">u<sub>n</sub></span> = (4 + cos(<span class=\"v\">n</span>)) ÷ <span class=\"v\">n</span>.</p><p><b>Étape 1. Bornes du cosinus.</b><br>Toujours : −1 ⩽ cos(<span class=\"v\">n</span>) ⩽ 1</p><p><b>Étape 2. On ajoute 4 aux trois membres.</b><br>3 ⩽ 4 + cos(<span class=\"v\">n</span>) ⩽ 5</p><p><b>Étape 3. On divise par <span class=\"v\">n</span></b> — le sens ne change pas car <span class=\"v\">n</span> > 0 :<br>3/<span class=\"v\">n</span> ⩽ <span class=\"v\">u<sub>n</sub></span> ⩽ 5/<span class=\"v\">n</span></p><p><b>Étape 4. On regarde les bords.</b><br>3/<span class=\"v\">n</span> → 0 et 5/<span class=\"v\">n</span> → 0</p><p><b>Conclusion.</b> Les deux gendarmes vont vers 0. Donc <span class=\"v\">u<sub>n</sub></span> → <b>0</b>.</p>"

    "h": {
     "ru": "<p>Соблазн написать:<br>lim sin(<span class=\"v\">n</span>)/<span class=\"v\">n</span> = (lim sin(<span class=\"v\">n</span>)) ÷ (lim <span class=\"v\">n</span>)</p><p>Так <b>нельзя</b>. Правило деления пределов работает только если <b>оба</b> предела существуют.</p><p>А у sin(<span class=\"v\">n</span>) предела нет — он вечно болтается.</p><p><b>Поэтому и нужны жандармы.</b> Это единственный законный путь для выражений с синусом или косинусом.</p>",
     "fr": "<p>Tentation d'écrire :<br>lim sin(<span class=\"v\">n</span>)/<span class=\"v\">n</span> = (lim sin(<span class=\"v\">n</span>)) ÷ (lim <span class=\"v\">n</span>)</p><p>C'est <b>interdit</b>. La règle du quotient n'est valable que si les <b>deux</b> limites existent.</p><p>Or sin(<span class=\"v\">n</span>) n'a pas de limite — il oscille sans fin.</p><p><b>D'où les gendarmes.</b> C'est la seule voie licite pour les expressions avec sinus ou cosinus.</p>"

    "h": {
     "ru": "<p>Когда делишь неравенство на <b>положительное</b> число — знаки остаются:<br>из 2 ⩽ 6 следует 1 ⩽ 3</p><p>Когда делишь на <b>отрицательное</b> — знаки <b>переворачиваются</b>:<br>из 2 ⩽ 6 следует −2 ⩾ −6</p><p><b>В задачах с жандармами</b> обычно делят на <span class=\"v\">n</span>, а оно положительно — поэтому проблем нет. Но если вдруг встретится деление на отрицательную величину, не забудь перевернуть.</p>",
     "fr": "<p>Quand on divise une inégalité par un nombre <b>positif</b>, le sens reste :<br>de 2 ⩽ 6 on tire 1 ⩽ 3</p><p>Par un nombre <b>négatif</b>, le sens <b>s'inverse</b> :<br>de 2 ⩽ 6 on tire −2 ⩾ −6</p><p><b>Dans les exercices de gendarmes</b>, on divise en général par <span class=\"v\">n</span>, qui est positif — donc pas de souci. Mais si tu divises par une quantité négative, pense à inverser.</p>"
    }

   {
    "k": "image",
    "h": {
     "ru": "<p><b>Почему годится «любой» ограниченный числитель.</b></p><p>Возьми что угодно, что не выходит за пределы, скажем, от −10 до 10. Хоть синус, хоть косинус, хоть (−1)<sup><span class=\"v\">n</span></sup>.</p><p>Раздели на миллион. Получишь число между −0,00001 и 0,00001. Мелочь.</p><p>Раздели на миллиард — станет ещё мельче.</p><p><b>Точное значение числителя не важно.</b> Важно только то, что он не убегает. Вот и вся идея этого раздела.</p>",
     "fr": "<p><b>Pourquoi « n'importe quel » numérateur borné convient.</b></p><p>Prends n'importe quoi qui reste entre, disons, −10 et 10. Sinus, cosinus, (−1)<sup><span class=\"v\">n</span></sup>.</p><p>Divise par un million. Tu obtiens un nombre entre −0,00001 et 0,00001. Une broutille.</p><p>Divise par un milliard : encore plus petit.</p><p><b>La valeur exacte du numérateur n'importe pas.</b> Seul compte le fait qu'il ne s'échappe pas. Voilà toute l'idée de cette partie.</p>"

   {
    "k": "ds",
    "h": {
     "ru": "<p><i>Pour tout n ⩾ 1, −1 ⩽ sin(n) ⩽ 1.<br>Donc −1/n ⩽ sin(n)/n ⩽ 1/n.<br>Or lim (−1/n) = lim (1/n) = 0.<br>Donc, d'après le théorème des gendarmes, lim sin(n)/n = 0.</i></p><p>Обрати внимание на слова <b>d'après le théorème des gendarmes</b> — без ссылки на теорему рассуждение считается неполным.</p>",
     "fr": "<p><i>Pour tout n ⩾ 1, −1 ⩽ sin(n) ⩽ 1.<br>Donc −1/n ⩽ sin(n)/n ⩽ 1/n.<br>Or lim (−1/n) = lim (1/n) = 0.<br>Donc, d'après le théorème des gendarmes, lim sin(n)/n = 0.</i></p><p>La mention <b>d'après le théorème des gendarmes</b> est obligatoire : sans elle, le raisonnement est jugé incomplet.</p>"

   {

     "ru": "<p><b>Два очень конкретных действия.</b></p><p><b>Умножать на 2:</b> 1 → 2 → 4 → 8 → 16 → 32…</p><p>Через 30 шагов перевалишь за миллиард. Это <span class=\"v\">q</span> > 1 — взрыв.</p><p><b>Умножать на 0,5:</b> 1 → 0,5 → 0,25 → 0,125…</p><p>Через 30 шагов окажешься меньше миллиардной доли. Это |<span class=\"v\">q</span>| < 1 — затухание.</p><p><b>А отрицательный случай?</b> При <span class=\"v\">q</span> = −2: 1 → −2 → 4 → −8 → 16…</p><p>Величина растёт, но знак скачет. Последовательность никуда не идёт: <b>предела нет</b>.</p>",
     "fr": "<p><b>Deux gestes très concrets.</b></p><p><b>Multiplier par 2 :</b> 1 → 2 → 4 → 8 → 16 → 32…</p><p>Après 30 étapes, tu dépasses le milliard. C'est <span class=\"v\">q</span> > 1 : ça explose.</p><p><b>Multiplier par 0,5 :</b> 1 → 0,5 → 0,25 → 0,125…</p><p>Après 30 étapes, moins d'un milliardième. C'est |<span class=\"v\">q</span>| < 1 : ça s'éteint.</p><p><b>Et le cas négatif ?</b> Avec <span class=\"v\">q</span> = −2 : 1 → −2 → 4 → −8 → 16…</p><p>La valeur grandit, mais le signe saute. La suite ne va nulle part : <b>pas de limite</b>.</p>"

    "h": {
     "ru": "<p>Сравни <span class=\"v\">q</span> = 2 и <span class=\"v\">q</span> = −2.</p><p>2<sup><span class=\"v\">n</span></sup>: 1, 2, 4, 8, 16 → +∞<br>(−2)<sup><span class=\"v\">n</span></sup>: 1, −2, 4, −8, 16 → предела нет</p><p>Одинаковая величина, совершенно разное поведение.</p><p><b>Но:</b> при <span class=\"v\">q</span> = −0,5 получается 1; −0,5; 0,25; −0,125… Знак тоже скачет, но всё сжимается к нулю. Предел есть и равен <b>0</b>.</p><p><b>Правило:</b> знак чередуется + величина растёт → предела нет. Знак чередуется + величина убывает → предел 0.</p>",
     "fr": "<p>Compare <span class=\"v\">q</span> = 2 et <span class=\"v\">q</span> = −2.</p><p>2<sup><span class=\"v\">n</span></sup> : 1, 2, 4, 8, 16 → +∞<br>(−2)<sup><span class=\"v\">n</span></sup> : 1, −2, 4, −8, 16 → pas de limite</p><p>Même taille, comportement opposé.</p><p><b>Mais</b> avec <span class=\"v\">q</span> = −0,5 : 1 ; −0,5 ; 0,25 ; −0,125… Le signe alterne aussi, mais tout se rapproche de zéro. La limite existe et vaut <b>0</b>.</p><p><b>Règle :</b> alternance + croissance → pas de limite. Alternance + décroissance → limite 0.</p>"

     "ru": "<p><span class=\"v\">u<sub>n</sub></span> = 3<sup><span class=\"v\">n</span></sup>. С какого ранга превысит 500?</p><p>3¹ = 3 · 3² = 9 · 3³ = 27 · 3⁴ = 81 · 3⁵ = 243 · 3⁶ = 729</p><p>На ранге 5 — 243, ещё не хватает. На ранге 6 — 729, превысили.</p><p><b>Ответ: ранг 6.</b></p><p>Частая ошибка — ответить 5, потому что это «последнее посчитанное». Нет: ищем первый ранг, который <b>превышает</b>.</p>",
     "fr": "<p><span class=\"v\">u<sub>n</sub></span> = 3<sup><span class=\"v\">n</span></sup>. À partir de quel rang dépasse-t-on 500 ?</p><p>3¹ = 3 · 3² = 9 · 3³ = 27 · 3⁴ = 81 · 3⁵ = 243 · 3⁶ = 729</p><p>Au rang 5 : 243, pas encore. Au rang 6 : 729, dépassé.</p><p><b>Réponse : rang 6.</b></p><p>Piège habituel : répondre 5 parce que c'est « le dernier calculé ». Non — on cherche le premier rang qui <b>dépasse</b>.</p>"

    "h": {
     "ru": "<p>Вклад 5000 €, ставка 4 % в год. Сколько через 10 лет?</p><p><b>Шаг 1. Переводим процент в множитель.</b><br>Было 100 %, добавилось 4 % → стало 104 %<br>104 % = 1,04</p><p><b>Шаг 2. Записываем последовательность.</b><br><span class=\"v\">u<sub>0</sub></span> = 5000, <span class=\"v\">q</span> = 1,04<br><span class=\"v\">u<sub>n</sub></span> = 5000 × 1,04<sup><span class=\"v\">n</span></sup></p><p><b>Шаг 3. Считаем на 10 лет.</b><br>1,04<sup>10</sup> ≈ 1,4802<br>5000 × 1,4802 ≈ <b>7401 €</b></p><p><b>Шаг 4. Предел?</b><br>1,04 > 1, значит 1,04<sup><span class=\"v\">n</span></sup> → +∞.<br>Вклад растёт без предела — математически. Реально банк, конечно, не вечный.</p>",
     "fr": "<p>Un placement de 5000 €, taux 4 % par an. Combien après 10 ans ?</p><p><b>Étape 1. Du pourcentage au coefficient.</b><br>On part de 100 %, on ajoute 4 % → 104 %<br>104 % = 1,04</p><p><b>Étape 2. On écrit la suite.</b><br><span class=\"v\">u<sub>0</sub></span> = 5000, <span class=\"v\">q</span> = 1,04<br><span class=\"v\">u<sub>n</sub></span> = 5000 × 1,04<sup><span class=\"v\">n</span></sup></p><p><b>Étape 3. Calcul sur 10 ans.</b><br>1,04<sup>10</sup> ≈ 1,4802<br>5000 × 1,4802 ≈ <b>7 401 €</b></p><p><b>Étape 4. La limite ?</b><br>1,04 > 1, donc 1,04<sup><span class=\"v\">n</span></sup> → +∞.<br>Le capital croît sans limite — mathématiquement. Dans la réalité, la banque n'est pas éternelle.</p>"

    "h": {
     "ru": "<p>Кажется, что 0,999 почти единица, значит почти ничего не меняется. Это верно <b>на первых шагах</b>.</p><p>0,999<sup>10</sup> ≈ 0,990 — почти не изменилось<br>0,999<sup>1000</sup> ≈ 0,368 — уже треть<br>0,999<sup>10000</sup> ≈ 0,00005 — почти ноль</p><p><b>Правило беспощадное:</b> если |<span class=\"v\">q</span>| < 1, предел ноль. Насколько близко <span class=\"v\">q</span> к единице — влияет только на скорость, не на результат.</p>",
     "fr": "<p>On croit que 0,999 est presque 1, donc que rien ne change. C'est vrai <b>aux premiers pas</b>.</p><p>0,999<sup>10</sup> ≈ 0,990 — presque inchangé<br>0,999<sup>1000</sup> ≈ 0,368 — un tiers déjà<br>0,999<sup>10000</sup> ≈ 0,00005 — presque zéro</p><p><b>La règle est implacable :</b> si |<span class=\"v\">q</span>| < 1, la limite est 0. La proximité de 1 n'influence que la vitesse, pas le résultat.</p>"

    },

     "ru": "<p><span class=\"v\">u<sub>0</sub></span> = 1 и <span class=\"v\">u<sub>n+1</sub></span> = (<span class=\"v\">u<sub>n</sub></span> + 6) ÷ 2.<br>Показать, что последовательность сходится.</p><p><b>Часть 1. Ограничена сверху шестёркой.</b></p><p><i>Инициализация:</i> <span class=\"v\">u<sub>0</sub></span> = 1 ⩽ 6 ✓</p><p><i>Наследственность:</i> пусть <span class=\"v\">u<sub>n</sub></span> ⩽ 6. Тогда<br><span class=\"v\">u<sub>n+1</sub></span> = (<span class=\"v\">u<sub>n</sub></span> + 6)/2 ⩽ (6 + 6)/2 = 6 ✓</p><p><b>Часть 2. Возрастает.</b></p><p>Считаем разность:<br><span class=\"v\">u<sub>n+1</sub></span> − <span class=\"v\">u<sub>n</sub></span> = (<span class=\"v\">u<sub>n</sub></span> + 6)/2 − <span class=\"v\">u<sub>n</sub></span></p><p>Приводим к общему знаменателю:<br>= (<span class=\"v\">u<sub>n</sub></span> + 6 − 2<span class=\"v\">u<sub>n</sub></span>)/2 = (6 − <span class=\"v\">u<sub>n</sub></span>)/2</p><p>Из части 1 знаем <span class=\"v\">u<sub>n</sub></span> ⩽ 6, значит 6 − <span class=\"v\">u<sub>n</sub></span> ⩾ 0.<br>Разность неотрицательна → возрастает ✓</p><p><b>Часть 3. Вывод.</b><br>Возрастающая и мажорированная → сходится.</p><p><b>Часть 4. Предел.</b><br><span class=\"v\">ℓ</span> = (<span class=\"v\">ℓ</span> + 6)/2 → 2<span class=\"v\">ℓ</span> = <span class=\"v\">ℓ</span> + 6 → <span class=\"v\">ℓ</span> = <b>6</b></p>",

     "ru": "<p><b>Почему у <span class=\"v\">u<sub>n+1</sub></span> тот же предел.</b></p><p>Представь очередь людей, идущих к двери.</p><p>Последовательность <span class=\"v\">u<sub>n</sub></span> — положение <span class=\"v\">n</span>-го. Последовательность <span class=\"v\">u<sub>n+1</sub></span> — положение следующего.</p><p>Все идут к одной двери. Смотреть на «следующего» не меняет пункт назначения — только точку начала наблюдения.</p><p><b>Условие:</b> функция <span class=\"v\">f</span> должна быть непрерывной. На баке она всегда такая.</p>",
     "fr": "<p><b>Pourquoi <span class=\"v\">u<sub>n+1</sub></span> a la même limite.</b></p><p>Imagine une file de gens qui avancent vers une porte.</p><p>La suite <span class=\"v\">u<sub>n</sub></span>, c'est la position du <span class=\"v\">n</span>-ième. <span class=\"v\">u<sub>n+1</sub></span>, celle du suivant.</p><p>Tout le monde va vers la même porte. Regarder « le suivant » ne change pas la destination.</p><p><b>Condition :</b> <span class=\"v\">f</span> doit être continue. Au bac, elle l'est toujours.</p>"
    }

    "h": {
     "ru": "<p><span class=\"v\">u<sub>0</sub></span> = 0 и <span class=\"v\">u<sub>n+1</sub></span> = √(2 + <span class=\"v\">u<sub>n</sub></span>).</p><p><b>Ограничена:</b> по индукции 0 ⩽ <span class=\"v\">u<sub>n</sub></span> ⩽ 2.</p><p><b>Монотонна:</b> показываем, что возрастает.</p><p><b>Вывод:</b> возрастающая и мажорированная → сходится к <span class=\"v\">ℓ</span>.</p><p><b>Значение:</b> <span class=\"v\">ℓ</span> = √(2 + <span class=\"v\">ℓ</span>), значит <span class=\"v\">ℓ</span>² = 2 + <span class=\"v\">ℓ</span>.</p><p><span class=\"v\">ℓ</span>² − <span class=\"v\">ℓ</span> − 2 = 0 → <span class=\"v\">ℓ</span> = 2 или <span class=\"v\">ℓ</span> = −1</p><p>Отбрасываем −1, потому что все члены положительны. <b><span class=\"v\">ℓ</span> = 2</b>.</p>",
     "fr": "<p><span class=\"v\">u<sub>0</sub></span> = 0 et <span class=\"v\">u<sub>n+1</sub></span> = √(2 + <span class=\"v\">u<sub>n</sub></span>).</p><p><b>Bornée :</b> par récurrence, 0 ⩽ <span class=\"v\">u<sub>n</sub></span> ⩽ 2.</p><p><b>Monotone :</b> on montre qu'elle est croissante.</p><p><b>Conclusion :</b> croissante et majorée → converge vers <span class=\"v\">ℓ</span>.</p><p><b>Valeur :</b> <span class=\"v\">ℓ</span> = √(2 + <span class=\"v\">ℓ</span>), donc <span class=\"v\">ℓ</span>² = 2 + <span class=\"v\">ℓ</span>.</p><p><span class=\"v\">ℓ</span>² − <span class=\"v\">ℓ</span> − 2 = 0 → <span class=\"v\">ℓ</span> = 2 ou <span class=\"v\">ℓ</span> = −1</p><p>On rejette −1 car la suite est positive. <b><span class=\"v\">ℓ</span> = 2</b>.</p>"
    }

   {
    "k": "piege",
    "n": {
     "ru": "Последний шаг, который забывают",
     "fr": "Le dernier réflexe, souvent oublié"
    },
    "h": {
     "ru": "<p>Уравнение даёт <b>два</b> решения: 2 и −1. Какое верное? Само уравнение не отвечает.</p><p><b>Надо вернуться к последовательности.</b> Все её члены положительны — это же квадратный корень. Предел положительных чисел не может быть отрицательным.</p><p>Значит −1 отпадает.</p><p><b>На контрольной эта фраза приносит балл.</b> Написать «ℓ = 2 или ℓ = −1» и остановиться — значит не доделать.</p><p>Нужная формулировка: <i>« Comme u<sub>n</sub> ⩾ 0 pour tout n, la limite est positive. On rejette donc −1 et ℓ = 2. »</i></p>",
     "fr": "<p>L'équation donne <b>deux</b> solutions : 2 et −1. Laquelle ? L'équation seule ne le dit pas.</p><p><b>Il faut revenir à la suite.</b> Tous ses termes sont positifs — c'est une racine carrée. Une limite de nombres positifs ne peut être négative.</p><p>Donc −1 est impossible.</p><p><b>En devoir, cette phrase vaut des points.</b> Écrire « ℓ = 2 ou ℓ = −1 » sans trancher laisse le travail inachevé.</p><p>Formulation attendue : <i>« Comme u<sub>n</sub> ⩾ 0 pour tout n, la limite est positive. On rejette donc −1 et ℓ = 2. »</i></p>"
    }

     "fr": "Un autre exercice complet"

    "h": {
     "ru": "<p><span class=\"v\">u<sub>0</sub></span> = 10 и <span class=\"v\">u<sub>n+1</sub></span> = 0,5<span class=\"v\">u<sub>n</sub></span> + 3.</p><p><b>Шаг 1. Найдём неподвижную точку заранее</b> — она подскажет, к чему всё идёт.<br><span class=\"v\">ℓ</span> = 0,5<span class=\"v\">ℓ</span> + 3<br><span class=\"v\">ℓ</span> − 0,5<span class=\"v\">ℓ</span> = 3<br>0,5<span class=\"v\">ℓ</span> = 3 → <span class=\"v\">ℓ</span> = 6</p><p><b>Шаг 2. Посчитаем первые члены.</b><br><span class=\"v\">u<sub>0</sub></span> = 10<br><span class=\"v\">u<sub>1</sub></span> = 5 + 3 = 8<br><span class=\"v\">u<sub>2</sub></span> = 4 + 3 = 7<br><span class=\"v\">u<sub>3</sub></span> = 3,5 + 3 = 6,5</p><p>Видно: убывает и приближается к шести.</p><p><b>Шаг 3. Доказываем минорирование шестёркой.</b><br><i>Инициализация:</i> 10 ⩾ 6 ✓<br><i>Наследственность:</i> если <span class=\"v\">u<sub>n</sub></span> ⩾ 6, то <span class=\"v\">u<sub>n+1</sub></span> = 0,5<span class=\"v\">u<sub>n</sub></span> + 3 ⩾ 0,5×6 + 3 = 6 ✓</p><p><b>Шаг 4. Доказываем убывание.</b><br><span class=\"v\">u<sub>n+1</sub></span> − <span class=\"v\">u<sub>n</sub></span> = 0,5<span class=\"v\">u<sub>n</sub></span> + 3 − <span class=\"v\">u<sub>n</sub></span> = 3 − 0,5<span class=\"v\">u<sub>n</sub></span></p><p>Так как <span class=\"v\">u<sub>n</sub></span> ⩾ 6, имеем 0,5<span class=\"v\">u<sub>n</sub></span> ⩾ 3, значит разность ⩽ 0 → убывает ✓</p><p><b>Вывод.</b> Убывающая и минорированная → сходится, предел = <b>6</b>.</p>",
     "fr": "<p><span class=\"v\">u<sub>0</sub></span> = 10 et <span class=\"v\">u<sub>n+1</sub></span> = 0,5<span class=\"v\">u<sub>n</sub></span> + 3.</p><p><b>Étape 1. Trouvons le point fixe d'abord</b> — il indique la destination.<br><span class=\"v\">ℓ</span> = 0,5<span class=\"v\">ℓ</span> + 3 → 0,5<span class=\"v\">ℓ</span> = 3 → <span class=\"v\">ℓ</span> = 6</p><p><b>Étape 2. Calculons les premiers termes.</b><br><span class=\"v\">u<sub>0</sub></span> = 10 · <span class=\"v\">u<sub>1</sub></span> = 8 · <span class=\"v\">u<sub>2</sub></span> = 7 · <span class=\"v\">u<sub>3</sub></span> = 6,5</p><p>On voit : elle décroît vers 6.</p><p><b>Étape 3. Minorée par 6.</b><br><i>Initialisation :</i> 10 ⩾ 6 ✓<br><i>Hérédité :</i> si <span class=\"v\">u<sub>n</sub></span> ⩾ 6, alors <span class=\"v\">u<sub>n+1</sub></span> ⩾ 0,5×6 + 3 = 6 ✓</p><p><b>Étape 4. Décroissante.</b><br><span class=\"v\">u<sub>n+1</sub></span> − <span class=\"v\">u<sub>n</sub></span> = 3 − 0,5<span class=\"v\">u<sub>n</sub></span></p><p>Comme <span class=\"v\">u<sub>n</sub></span> ⩾ 6, on a 0,5<span class=\"v\">u<sub>n</sub></span> ⩾ 3, donc la différence est ⩽ 0 → décroissante ✓</p><p><b>Conclusion.</b> Décroissante et minorée → converge vers <b>6</b>.</p>"

     "ru": "Неподвижная точка может отталкивать",
     "fr": "Un point fixe peut repousser"
    },
    "h": {
     "ru": "<p>Неподвижная точка — это <b>кандидат</b> на предел, а не гарантия.</p><p>Возьми <span class=\"v\">u<sub>n+1</sub></span> = 2<span class=\"v\">u<sub>n</sub></span> − 3. Неподвижная точка: <span class=\"v\">ℓ</span> = 2<span class=\"v\">ℓ</span> − 3 → <span class=\"v\">ℓ</span> = 3.</p><p>Стартуем с <span class=\"v\">u<sub>0</sub></span> = 4 (чуть выше трёх):<br>4 → 5 → 7 → 11 → 19 → 35…</p><p>Уходит в бесконечность! От точки 3 она <b>убегает</b>, а не приближается.</p><p><b>Правило:</b> если множитель перед <span class=\"v\">u<sub>n</sub></span> по модулю больше единицы — точка отталкивающая. Поэтому и нельзя просто решить уравнение и сказать «вот предел». Сначала надо доказать сходимость.</p>",
     "fr": "<p>Le point fixe est un <b>candidat</b>, pas une garantie.</p><p>Prends <span class=\"v\">u<sub>n+1</sub></span> = 2<span class=\"v\">u<sub>n</sub></span> − 3. Point fixe : <span class=\"v\">ℓ</span> = 3.</p><p>Démarrons à <span class=\"v\">u<sub>0</sub></span> = 4 (juste au-dessus) :<br>4 → 5 → 7 → 11 → 19 → 35…</p><p>Ça part à l'infini ! La suite <b>fuit</b> le point 3 au lieu de s'en approcher.</p><p><b>Règle :</b> si le coefficient devant <span class=\"v\">u<sub>n</sub></span> est de valeur absolue supérieure à 1, le point fixe est répulsif. C'est pourquoi on ne peut pas juste résoudre l'équation et annoncer la limite. Il faut d'abord prouver la convergence.</p>"
    }

    "h": {
     "ru": "<p>В задании сначала просят границы, потом монотонность, потом сходимость, и только в конце предел.</p><p>Это не формальность. Каждый шаг <b>нужен следующему</b>:</p><p>· границы используются, чтобы доказать монотонность (как в примере выше)<br>· монотонность плюс границы дают сходимость<br>· и только зная, что предел есть, можно его искать</p><p><b>Если поменять порядок</b>, решение развалится: нельзя искать предел того, что, возможно, не сходится.</p>",
     "fr": "<p>L'énoncé demande d'abord les bornes, puis la monotonie, puis la convergence, et enfin la limite.</p><p>Ce n'est pas une formalité. Chaque étape <b>sert à la suivante</b> :</p><p>· les bornes servent à prouver la monotonie (comme dans l'exemple ci-dessus)<br>· monotonie plus bornes donnent la convergence<br>· et ce n'est qu'en sachant que la limite existe qu'on peut la chercher</p><p><b>En changeant l'ordre</b>, le raisonnement s'écroule : on ne cherche pas la limite de ce qui pourrait diverger.</p>"

     "ru": "<p><b>Работа А:</b> «ℓ = 2»</p><p><b>Работа Б:</b> «La suite est croissante et majorée par 2, donc elle converge vers une limite ℓ. En passant à la limite dans la relation, on obtient ℓ = √(2+ℓ), soit ℓ² − ℓ − 2 = 0. Les solutions sont 2 et −1. Comme tous les termes sont positifs, on rejette −1. <b>Donc la suite converge vers 2.</b>»</p><p>Один и тот же результат. Но работа А получает один балл из пяти, работа Б — все пять.</p><p><b>Это не украшательство.</b> Проверяющий ставит балл за то, что может проследить. Ответ без обоснования мог быть угадан или списан.</p>",

     "ru": "<p>Сравни два оформления одного и того же доказательства.</p><p><b>Слабо:</b><br>«n=0: 1=1 ok. Предположим верно. Тогда u<sub>n+1</sub> = 2(2<sup>n</sup>−1)+1 = 2<sup>n+1</sup>−1. Значит верно.»</p><p><b>Как надо:</b><br>«<i>Montrons par récurrence que pour tout entier naturel n, u<sub>n</sub> = 2<sup>n</sup> − 1.</i></p><p><i><b>Initialisation.</b> Pour n = 0, la formule donne 2<sup>0</sup> − 1 = 0, et u<sub>0</sub> = 0 par définition. Donc P(0) est vraie.</i></p><p><i><b>Hérédité.</b> Supposons que pour un entier naturel n fixé, u<sub>n</sub> = 2<sup>n</sup> − 1. Montrons que u<sub>n+1</sub> = 2<sup>n+1</sup> − 1.<br>Par définition, u<sub>n+1</sub> = 2u<sub>n</sub> + 1.<br>En utilisant l'hypothèse de récurrence : u<sub>n+1</sub> = 2(2<sup>n</sup> − 1) + 1 = 2<sup>n+1</sup> − 1.<br>Donc P(n+1) est vraie.</i></p><p><i><b>Conclusion.</b> D'après le principe de récurrence, P(n) est vraie pour tout entier naturel n.</i>»</p><p>Разница: названы три этапа, есть фраза «en utilisant l'hypothèse», есть вывод. Первый вариант получит один балл, второй — все.</p>",

/* ── направление перехода: вперёд по ссылке, назад по кнопке браузера ── */
(function(){
  const H = document.documentElement;

  /* ссылка внутрь → вперёд */
  document.addEventListener("click", e=>{
    const a = e.target.closest("a[href]");
    if(!a) return;
    const href = a.getAttribute("href");
    if(!href || href.startsWith("#")) return;
    H.classList.remove("retour");
    try{ sessionStorage.setItem("nav.dir", "avant"); }catch(err){}
  }, true);

  /* кнопка «назад» браузера */
  addEventListener("popstate", ()=>{
    H.classList.add("retour");
    try{ sessionStorage.setItem("nav.dir", "retour"); }catch(err){}
  });

  /* au chargement : on applique le sens mémorisé */
  let dir = "avant";
  try{ dir = sessionStorage.getItem("nav.dir") || "avant"; }catch(err){}

  const nav = performance.getEntriesByType &&
              performance.getEntriesByType("navigation")[0];
  if((nav && nav.type === "back_forward") || dir === "retour"){
    H.classList.add("retour");
  }
  /* on nettoie après l'animation pour ne pas figer l'état */
  setTimeout(()=>{
    H.classList.remove("retour");
    try{ sessionStorage.setItem("nav.dir", "avant"); }catch(err){}
  }, 950);
})();

const $ = id => document.getElementById(id);
const LKEY = "suites.cours.lang";

let L = "ru";
try{ L = localStorage.getItem(LKEY) || "ru"; }catch(e){}

const T = {
  ru:{ sub:"Première · Terminale", toc:"Содержание",
       titre:"Последовательности<br>с самого начала",
       sous:"Всё, что нужно знать по теме, разобрано на пальцах — с примерами из жизни и готовыми формулировками для контрольной.",
       up:"Содержание", foot:"Перейти к упражнениям", neuf:"НОВОЕ",
       prev:"Назад", next:"Далее", exo:"Задания" },
  fr:{ sub:"Première · Terminale", toc:"Sommaire",
       titre:"Les suites,<br>depuis le début",
       sous:"Tout le programme expliqué simplement — avec des images concrètes et les formulations à écrire en devoir.",
       up:"Sommaire", foot:"Aux exercices", neuf:"NOUVEAU",
       prev:"Retour", next:"Suite", exo:"Exercices" }
};

function txt(o){ return (o && typeof o === "object") ? (o[L] || o.ru || "") : (o || ""); }

function bloc(b){
  const t = txt(b.h !== undefined ? b.h : b);
  switch(b.k){
    case "pourquoi": return `<div class="pourquoi">${t}</div>`;
    case "image":    return `<div class="image"><span class="lbl">${L==="ru"?"Представь себе":"Image mentale"}</span>${t}</div>`;
    case "f":        return `<div class="f${b.s?" small":""}">${t}</div>`;
    case "ex":       return `<div class="ex"><span class="lbl">${txt(b.n) || (L==="ru"?"Пример":"Exemple")}</span>${t}</div>`;
    case "piege":    return `<div class="piege"><span class="lbl">${txt(b.n) || (L==="ru"?"Ловушка":"Piège")}</span>${t}</div>`;
    case "ds":       return `<div class="ds"><span class="lbl">${L==="ru"?"Как писать на контрольной":"À écrire en devoir"}</span>${t}</div>`;
    case "tab":      return `<div class="scroll">${t}</div>`;
    case "code":     return `<div class="code">${t}</div>`;
    case "ul":       return `<ul>${(b.items||[]).map(i=>`<li>${txt(i)}</li>`).join("")}</ul>`;
    case "ol":       return `<ol>${(b.items||[]).map(i=>`<li>${txt(i)}</li>`).join("")}</ol>`;
    default:         return `<p>${t}</p>`;
  }
}

function dessine(){
  document.documentElement.lang = L;
  $("b-ru").classList.toggle("on", L==="ru");
  $("b-fr").classList.toggle("on", L==="fr");
  $("bar-sub").textContent = T[L].sub;
  $("toc-t").textContent   = T[L].toc;
  $("h-titre").innerHTML   = T[L].titre;
  $("h-sous").textContent  = T[L].sous;
  $("f-txt").textContent   = T[L].foot;

  $("toc-l").innerHTML = COURS.map(s=>
    `<li><a href="#s${s.n}">${txt(s.t)}${s.neuf?`<span class="neuf">${T[L].neuf}</span>`:""}</a></li>`
  ).join("");

  $("corps").innerHTML = COURS.map(s=>`
    <section class="sec" id="s${s.n}">
      <span class="sec-n">${L==="ru"?"РАЗДЕЛ":"PARTIE"} ${s.n}</span>
      <h2>${txt(s.t)}</h2>
      ${s.st ? `<p class="sec-s">${txt(s.st)}</p>` : ""}
      ${(s.b||[]).map(bloc).join("")}
      <a class="up" href="#toc">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
        ${T[L].up}
      </a>
    </section>`).join("");
}

function setLang(l){
  L = l;
  try{ localStorage.setItem(LKEY, l); }catch(e){}
  const y = window.scrollY;
  dessine();
  window.scrollTo(0, y);
}

$("b-ru").onclick = ()=> setLang("ru");
$("b-fr").onclick = ()=> setLang("fr");


/* ── плавающая кнопка: появляется после первого экрана ── */
(function(){
  const fab = $("fab");
  if(!fab) return;

  const seuil = ()=> Math.max(320, innerHeight * 0.75);

  const check = ()=>{
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    fab.classList.toggle("on", y > seuil());
  };

  let tick = false;
  const onScroll = ()=>{
    if(tick) return;
    tick = true;
    requestAnimationFrame(()=>{ check(); tick = false; });
  };

  addEventListener("scroll", onScroll, {passive:true});
  addEventListener("resize", check, {passive:true});
  check();

  fab.addEventListener("click", e=>{
    e.preventDefault();
    const toc = $("toc");
    if(toc) toc.scrollIntoView({behavior:"smooth", block:"start"});
    history.replaceState(null, "", "#toc");
  });
})();

/* ── клавиши на ноутбуке ── */
addEventListener("keydown", e=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const actif = document.activeElement;
  if(actif && /INPUT|TEXTAREA|SELECT/.test(actif.tagName)) return;

  /* Échap ou Début → sommaire */
  if(e.key === "Escape" || e.key === "Home"){
    e.preventDefault();
    $("toc").scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }

  /* flèches gauche / droite → partie précédente / suivante */
  if(e.key === "ArrowLeft" || e.key === "ArrowRight"){
    const secs = [...document.querySelectorAll(".sec")];
    if(!secs.length) return;
    /* quelle partie occupe le haut de l'écran ? */
    let idx = 0;
    secs.forEach((s,i)=>{ if(s.getBoundingClientRect().top <= 90) idx = i; });
    const cible = e.key === "ArrowRight"
      ? Math.min(idx+1, secs.length-1)
      : Math.max(idx-1, 0);
    if(cible !== idx){
      e.preventDefault();
      secs[cible].scrollIntoView({behavior:"smooth", block:"start"});
    }
  }
});

/* ── défilement doux pour tous les liens internes ── */
document.addEventListener("click", e=>{
  const a = e.target.closest('a[href^="#"]');
  if(!a) return;
  const cible = document.querySelector(a.getAttribute("href"));
  if(!cible) return;
  e.preventDefault();
  cible.scrollIntoView({behavior:"smooth", block:"start"});
  history.replaceState(null, "", a.getAttribute("href"));
});


dessine();
