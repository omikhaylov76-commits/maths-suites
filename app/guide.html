<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mode d'emploi — Les suites</title>
<link rel="apple-touch-icon" href="i/icon-180.png">
<meta name="theme-color" content="#fdf9f4">
<style>
@view-transition{ navigation:auto }
@media (prefers-reduced-motion:no-preference){
  ::view-transition-old(root){animation:gOut 420ms cubic-bezier(.4,0,.2,1) both}
  ::view-transition-new(root){animation:gIn 500ms cubic-bezier(.215,.61,.355,1) both}
  html.retour::view-transition-old(root){animation:gOutR 420ms cubic-bezier(.4,0,.2,1) both}
  html.retour::view-transition-new(root){animation:gInR 500ms cubic-bezier(.215,.61,.355,1) both}
}
@keyframes gOut {from{transform:translateX(0);opacity:1}     to{transform:translateX(-22%);opacity:0}}
@keyframes gIn  {from{transform:translateX(100%);opacity:.4} to{transform:translateX(0);opacity:1}}
@keyframes gOutR{from{transform:translateX(0);opacity:1}     to{transform:translateX(100%);opacity:0}}
@keyframes gInR {from{transform:translateX(-22%);opacity:.4} to{transform:translateX(0);opacity:1}}

:root{
  --canvas:#fdf9f4; --warm:#f9efe4; --dust:#f4ece1; --mist:#e8ddd0;
  --ink:#241f1b; --charcoal:#4a423a; --soft:#8a8078; --slate:#b4a99c;
  --ember:#f67748; --ember-d:#d65f34;
  --ok:#3fa66a; --ok-soft:#eef7f1; --ok-line:#cfe6d9;
  --miss:#c9553d; --miss-soft:#fdf0ec; --miss-line:#f2d5cb;
  --e:cubic-bezier(.215,.61,.355,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--canvas);color:var(--ink);
  font:400 16.5px/1.68 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
  padding-bottom:90px}

.bar{position:sticky;top:0;z-index:40;background:rgba(253,249,244,.94);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--mist);padding:env(safe-area-inset-top) 0 0}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:11px;padding:11px 20px}
.back{flex:0 0 38px;width:38px;height:38px;border-radius:50%;border:1px solid var(--mist);
  background:#fff;color:var(--charcoal);display:grid;place-items:center;
  text-decoration:none;transition:transform .12s var(--e)}
.back:active{transform:scale(.92)}
.bar-t{flex:1;min-width:0}
.bar-t b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.bar-t span{display:block;font-size:11.5px;color:var(--soft);margin-top:1px}
.lang{display:flex;gap:3px;background:var(--dust);border-radius:20px;padding:3px}
.lang button{border:0;background:none;cursor:pointer;padding:6px 12px;border-radius:17px;
  font:600 12px/1 "Inter",sans-serif;color:var(--soft);
  transition:background .2s var(--e),color .2s var(--e)}
.lang button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07)}

.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.hero{padding:40px 0 28px}
.hero h1{font-size:clamp(27px,6.5vw,38px);line-height:1.14;letter-spacing:-.025em;font-weight:700}
.hero p{margin-top:11px;font-size:15.5px;color:var(--soft);line-height:1.6}

.toc{background:#fff;border:1px solid var(--mist);border-radius:17px;
  padding:20px 22px;margin-bottom:36px}
.toc h2{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--soft);font-weight:700;margin-bottom:12px}
.toc ol{list-style:none;counter-reset:t}
.toc li{counter-increment:t}
.toc a{display:flex;gap:11px;align-items:baseline;padding:7px 9px;margin:0 -9px;
  border-radius:9px;color:var(--ink);text-decoration:none;font-size:15px;
  transition:background .16s var(--e)}
.toc a:hover{background:var(--dust)}
.toc a::before{content:counter(t);flex:0 0 20px;
  font:600 12px/1.5 "Inter",sans-serif;color:var(--ember)}

.sec{padding:10px 0 44px;scroll-margin-top:72px}
.sec-n{display:inline-block;font:600 10.5px/1 "Inter",sans-serif;
  letter-spacing:.1em;color:var(--ember);margin-bottom:10px}
.sec h2{font-size:clamp(21px,5vw,27px);line-height:1.24;
  letter-spacing:-.02em;font-weight:700;margin-bottom:18px}
.sec p{margin-bottom:15px}
.sec p b{font-weight:600}

/* шаги */
.pas{display:flex;gap:14px;margin-bottom:16px;align-items:flex-start}
.pas-n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ember);color:#fff;
  display:grid;place-items:center;font:600 12.5px/1 "Inter",sans-serif;margin-top:2px}
.pas-c{flex:1;min-width:0}
.pas-c b{font-weight:600}
.pas-c p{margin:0 0 5px}
.pas-c p:last-child{margin-bottom:0}

/* кнопка в тексте */
.btn{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:14px;
  background:var(--ember);color:#fff;font:600 12.5px/1.4 "Inter",sans-serif;
  vertical-align:baseline;white-space:nowrap}
.btn.gris{background:var(--dust);color:var(--charcoal)}
.btn.rond{padding:0;width:26px;height:26px;border-radius:50%;justify-content:center;
  vertical-align:middle}

/* врезки */
.note{background:var(--warm);border-radius:14px;padding:16px 19px;margin-bottom:20px;
  font-size:15px;line-height:1.6;color:var(--charcoal)}
.note b{color:var(--ink);font-weight:600}
.note p:last-child{margin-bottom:0}

.warn{background:var(--miss-soft);border:1px solid var(--miss-line);border-radius:14px;
  padding:16px 19px;margin-bottom:20px;font-size:15px;line-height:1.6}
.warn .lbl{display:block;font:600 10px/1 "Inter",sans-serif;letter-spacing:.09em;
  text-transform:uppercase;color:var(--miss);margin-bottom:9px}
.warn p:last-child{margin-bottom:0}

.good{background:var(--ok-soft);border:1px solid var(--ok-line);border-radius:14px;
  padding:16px 19px;margin-bottom:20px;font-size:15px;line-height:1.6}
.good .lbl{display:block;font:600 10px/1 "Inter",sans-serif;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ok);margin-bottom:9px}
.good p:last-child{margin-bottom:0}

.ecran{background:#fff;border:1px solid var(--mist);border-radius:14px;
  padding:17px 19px;margin-bottom:20px}
.ecran .lbl{display:block;font:600 10px/1 "Inter",sans-serif;letter-spacing:.09em;
  text-transform:uppercase;color:var(--slate);margin-bottom:11px}
.ecran .ln{display:flex;gap:10px;align-items:center;padding:7px 0;
  border-bottom:1px solid var(--dust);font-size:14.5px}
.ecran .ln:last-child{border-bottom:0}
.ecran .ln i{flex:0 0 auto;font-style:normal}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:20px}
table{border-collapse:collapse;width:100%;min-width:340px;font-size:14.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--mist)}
th{font-weight:600;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--soft)}
tr:last-child td{border-bottom:0}

.up{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;
  border-radius:18px;background:var(--dust);color:var(--soft);text-decoration:none;
  font:600 11.5px/1 "Inter",sans-serif;transition:background .18s var(--e)}
.up:hover{background:var(--mist);color:var(--charcoal)}

.foot{border-top:1px solid var(--mist);margin-top:16px;padding:28px 0 0;text-align:center}
.foot a{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:26px;
  background:var(--ember);color:#fff;text-decoration:none;
  font:600 14px/1 "Inter",sans-serif;transition:transform .12s var(--e)}
.foot a:active{transform:scale(.98);background:var(--ember-d)}

.fab{position:fixed;right:16px;z-index:50;bottom:calc(16px + env(safe-area-inset-bottom));
  width:50px;height:50px;border-radius:50%;background:#fff;border:1px solid var(--mist);
  box-shadow:0 4px 16px rgba(36,31,27,.13);display:grid;place-items:center;
  color:var(--charcoal);text-decoration:none;opacity:0;transform:translateY(14px) scale(.9);
  pointer-events:none;transition:opacity .22s var(--e),transform .26s var(--e)}
.fab.on{opacity:1;transform:none;pointer-events:auto}

.v{font-family:Georgia,serif;font-style:italic}
@media (max-width:560px){
  body{font-size:16px}
  .wrap{padding:0 17px}
  .hero{padding:30px 0 22px}
}
</style>
</head>

const $ = id => document.getElementById(id);
const K = "suites.guide.lang";
let L = "fr";
try{ L = localStorage.getItem(K) || "fr"; }catch(e){}

const T = {
  fr:{ t:"Mode d'emploi", s:"Les suites", toc:"Sommaire",
       h1:"Comment ça marche",
       hp:"Tout ce qu'il faut savoir : installer, travailler, retrouver ton travail sur un autre appareil.",
       up:"Sommaire", foot:"Revenir à l'application", part:"ÉTAPE" },
  ru:{ t:"Инструкция", s:"Les suites", toc:"Содержание",
       h1:"Как этим пользоваться",
       hp:"Всё по порядку: установка, занятия, перенос прогресса на другое устройство.",
       up:"Содержание", foot:"Вернуться в приложение", part:"ШАГ" }
};

const tx = o => (o && typeof o === "object") ? (o[L] || o.fr || "") : (o || "");

function bl(b){
  const c = tx(b.h !== undefined ? b.h : b);
  switch(b.k){
    case "pas":   return `<div class="pas"><span class="pas-n">${b.n}</span><div class="pas-c">${c}</div></div>`;
    case "note":  return `<div class="note">${c}</div>`;
    case "warn":  return `<div class="warn"><span class="lbl">${tx(b.l) || (L==="fr"?"Attention":"Важно")}</span>${c}</div>`;
    case "good":  return `<div class="good"><span class="lbl">${tx(b.l) || (L==="fr"?"À savoir":"Полезно знать")}</span>${c}</div>`;
    case "ecran": return `<div class="ecran"><span class="lbl">${tx(b.l) || (L==="fr"?"Ce que tu vois":"Что видно на экране")}</span>${c}</div>`;
    case "tab":   return `<div class="scroll">${c}</div>`;
    default:      return `<p>${c}</p>`;
  }
}

function draw(){
  document.documentElement.lang = L;
  $("b-fr").classList.toggle("on", L==="fr");
  $("b-ru").classList.toggle("on", L==="ru");
  $("bt").textContent = T[L].t;
  $("bs").textContent = T[L].s;
  $("tt").textContent = T[L].toc;
  $("h1").textContent = T[L].h1;
  $("hp").textContent = T[L].hp;
  $("ft").textContent = T[L].foot;

  $("tl").innerHTML = GUIDE.map(s=>`<li><a href="#g${s.n}">${tx(s.t)}</a></li>`).join("");
  $("corps").innerHTML = GUIDE.map(s=>`
    <section class="sec" id="g${s.n}">
      <span class="sec-n">${T[L].part} ${s.n}</span>
      <h2>${tx(s.t)}</h2>
      ${(s.b||[]).map(bl).join("")}
      <a class="up" href="#toc">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
        ${T[L].up}
      </a>
    </section>`).join("");
}

function setL(l){
  L = l;
  try{ localStorage.setItem(K, l); }catch(e){}
  const y = scrollY; draw(); scrollTo(0, y);
}
$("b-fr").onclick = ()=> setL("fr");
$("b-ru").onclick = ()=> setL("ru");

/* плавающая кнопка */
(function(){
  const f = $("fab");
  const ck = ()=>{ f.classList.toggle("on", (scrollY||document.documentElement.scrollTop||0) > Math.max(320, innerHeight*.7)); };
  let tk = false;
  addEventListener("scroll", ()=>{ if(tk) return; tk=true; requestAnimationFrame(()=>{ck();tk=false;}); }, {passive:true});
  addEventListener("resize", ck, {passive:true});
  ck();
})();

/* плавная прокрутка по якорям */
document.addEventListener("click", e=>{
  const a = e.target.closest('a[href^="#"]');
  if(!a) return;
  const c = document.querySelector(a.getAttribute("href"));
  if(!c) return;
  e.preventDefault();
  c.scrollIntoView({behavior:"smooth", block:"start"});
  history.replaceState(null, "", a.getAttribute("href"));
});

/* направление перехода */
(function(){
  const H = document.documentElement;
  document.addEventListener("click", e=>{
    const a = e.target.closest("a[href]");
    if(!a) return;
    const h = a.getAttribute("href");
    if(!h || h.startsWith("#")) return;
    const back = h === "./" || h.indexOf("..") === 0;
    H.classList.toggle("retour", back);
    try{ sessionStorage.setItem("nav.dir", back?"retour":"avant"); }catch(x){}
  }, true);
  let d = "avant";
  try{ d = sessionStorage.getItem("nav.dir") || "avant"; }catch(x){}
  const nv = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
  if((nv && nv.type === "back_forward") || d === "retour") H.classList.add("retour");
  setTimeout(()=>{ H.classList.remove("retour"); try{ sessionStorage.setItem("nav.dir","avant"); }catch(x){} }, 950);
})();

draw();
</script>
