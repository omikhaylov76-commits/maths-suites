<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Les suites · 1ʳᵉ spé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2024; --graphite:#60646c; --steel:#80838d;
  --mist:#d9d9e0; --fog:#f0f0f3; --canvas:#ffffff;
  --signal:#0090ff; --deep:#0072de;
  --ok:#2d7a4f; --ok-soft:#eef6f0; --ok-line:#b8ddc6;
  --miss:#b4552b; --miss-soft:#fdf2ec; --miss-line:#eecdb8;
  --r-card:20px; --r-pill:36px; --r-sm:12px;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden}
body{
  background:var(--canvas);color:var(--ink);
  font:400 16px/1.5 "Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  letter-spacing:-0.012em;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;letter-spacing:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
input{font:inherit;letter-spacing:inherit;color:inherit}
.v{font-family:"Cambria Math","Georgia",serif;font-style:italic}
.v sub,.v sup{font-style:normal}
sub,sup{font-size:.7em;line-height:0}

/* экраны */
.screens{position:relative;width:100%;min-height:100dvh;overflow:hidden}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;opacity:0;pointer-events:none;
  transform:translateX(24px);
  transition:opacity .28s var(--ease),transform .3s var(--ease);
}
.screen.on{opacity:1;pointer-events:auto;transform:translateX(0)}
.screen.left{transform:translateX(-24px)}
.pad{max-width:720px;margin:0 auto;padding:calc(20px + var(--safe-t)) 20px calc(120px + var(--safe-b))}

/* главная */
.hero{padding:8px 0 4px}
.hero h1{font:700 30px/1.15 "Inter",sans-serif;letter-spacing:-0.025em;margin:0 0 6px}
.hero .sub{color:var(--graphite);font-size:15px;margin:0}
.meter{margin:26px 0 8px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.meter-lbl{font:500 12px/1 "Inter",sans-serif;color:var(--steel);letter-spacing:0.02em}
.meter-val{font:600 13px/1 "Inter",sans-serif;color:var(--graphite);font-variant-numeric:tabular-nums}
.meter-bar{height:5px;background:var(--fog);border-radius:99px;overflow:hidden}
.meter-fill{height:100%;background:var(--ink);border-radius:99px;width:0;transition:width .6s var(--ease)}
.streak{
  display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:8px 15px;
  background:var(--fog);border-radius:var(--r-pill);
  font:500 13px/1 "Inter",sans-serif;color:var(--graphite);
}
.streak b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.resume{
  display:block;width:100%;margin:26px 0 30px;padding:19px 22px;
  background:var(--ink);color:var(--canvas);border-radius:var(--r-card);
  text-align:left;transition:transform .12s var(--ease);
}
.resume:active{transform:scale(.975)}
.resume .r-lbl{
  display:block;font:500 11px/1 "Inter",sans-serif;letter-spacing:0.09em;
  text-transform:uppercase;opacity:.62;margin-bottom:8px;
}
.resume .r-name{display:block;font:600 19px/1.25 "Inter",sans-serif;letter-spacing:-0.02em}
.resume .r-meta{display:block;font:400 13px/1 "Inter",sans-serif;opacity:.6;margin-top:7px}
.list-lbl{font:500 12px/1 "Inter",sans-serif;color:var(--steel);letter-spacing:0.08em;text-transform:uppercase;margin:0 0 12px}
.chs{display:flex;flex-direction:column;gap:8px}
.ch{
  display:flex;align-items:center;gap:14px;padding:15px 17px;
  background:var(--canvas);border:1px solid var(--mist);border-radius:var(--r-card);
  text-align:left;width:100%;transition:transform .12s var(--ease),border-color .18s,background .18s;
}
.ch:active{transform:scale(.985)}
.ch.next{border-color:var(--ink);border-width:1.5px}
.ch.done{background:var(--fog);border-color:transparent}
.ch.done .ch-name{color:var(--graphite)}
.ch.lock{opacity:.62}
.ds-tag{
  display:inline-block;margin-left:7px;padding:3px 8px;
  background:var(--signal);color:#fff;border-radius:99px;
  font:600 10px/1 "Inter",sans-serif;letter-spacing:0.04em;vertical-align:1px;
}
.ch-num{
  flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:50%;
  background:var(--fog);font:600 14px/1 "Inter",sans-serif;color:var(--graphite);
  font-variant-numeric:tabular-nums;transition:background .2s,color .2s;
}
.ch.next .ch-num{background:var(--ink);color:var(--canvas)}
.ch.done .ch-num{background:var(--ok-soft);color:var(--ok)}
.ch-body{flex:1;min-width:0}
.ch-name{font:600 15px/1.3 "Inter",sans-serif;letter-spacing:-0.015em;display:block}
.ch-meta{font:400 12.5px/1 "Inter",sans-serif;color:var(--steel);margin-top:4px;display:block}
.stars{display:flex;gap:2.5px;flex:0 0 auto}
.star{width:13px;height:13px;opacity:.2}
.star.lit{opacity:1}
.foot-link{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:26px;padding:16px;border:1px solid var(--mist);border-radius:var(--r-pill);
  font:600 14.5px/1 "Inter",sans-serif;color:var(--ink);text-decoration:none;
  transition:transform .12s var(--ease),background .18s;min-height:52px;
}
.foot-link:active{transform:scale(.98);background:var(--fog)}

/* шапка */
.top{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--mist);padding-top:var(--safe-t);
}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:11px 20px}
.back{
  flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;
  border-radius:50%;margin-left:-8px;transition:background .16s,transform .12s var(--ease);
}
.back:active{background:var(--fog);transform:scale(.92)}
.top-t{flex:1;min-width:0}
.top-name{font:600 14.5px/1.2 "Inter",sans-serif;letter-spacing:-0.015em;display:block}
.top-step{font:400 12px/1 "Inter",sans-serif;color:var(--steel);margin-top:3px;display:block;font-variant-numeric:tabular-nums}
.top-bar{height:2px;background:var(--fog)}
.top-fill{height:100%;background:var(--ink);width:0;transition:width .4s var(--ease)}

/* карточки */
.card{
  display:block;padding:26px 24px 24px;background:var(--canvas);
  border:1px solid var(--mist);border-radius:24px;animation:cardIn .26s var(--ease);
}
@keyframes cardIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
.card-k{font:500 11px/1 "Inter",sans-serif;letter-spacing:0.09em;text-transform:uppercase;color:var(--steel);margin-bottom:13px}
.card h3{font:600 20px/1.3 "Inter",sans-serif;letter-spacing:-0.022em;margin:0 0 13px}
.card p{margin:0 0 13px;color:var(--graphite);font-size:15.5px;line-height:1.6}
.card p:last-child{margin-bottom:0}
.card b{color:var(--ink);font-weight:600}
.show{
  display:block;text-align:center;padding:17px;margin:17px 0;
  background:var(--fog);border-radius:var(--r-sm);
  font-family:"Cambria Math","Georgia",serif;font-size:18px;line-height:1.8;
}
.note{
  margin-top:17px;padding:14px 16px;background:var(--fog);border-radius:var(--r-sm);
  font-size:14px;line-height:1.55;color:var(--graphite);
}
.note b{color:var(--ink);font-weight:600}

/* «помедленнее» */
.slow-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;margin-top:16px;padding:13px;
  background:var(--fog);border-radius:var(--r-pill);
  font:600 13.5px/1 "Inter",sans-serif;color:var(--graphite);
  transition:transform .12s var(--ease),background .18s;min-height:46px;
}
.slow-btn:active{transform:scale(.98)}
.slow-btn svg{transition:transform .26s var(--ease)}
.slow-btn.open svg{transform:rotate(180deg)}
.slow{max-height:0;overflow:hidden;transition:max-height .34s var(--ease),margin .34s var(--ease)}
.slow.open{max-height:900px;margin-top:14px}
.slow-in{
  padding:18px 20px;background:#fbfbfd;border:1px solid var(--mist);
  border-radius:var(--r-card);font-size:15px;line-height:1.62;color:var(--graphite);
}
.slow-in b{color:var(--ink);font-weight:600}
.slow-in p{margin:0 0 12px}
.slow-in p:last-child{margin-bottom:0}

.dots{display:flex;justify-content:center;gap:6px;margin:18px 0 6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--mist);transition:background .22s,width .22s}
.dot.on{background:var(--ink);width:18px;border-radius:99px}
.nav2{display:flex;gap:10px;margin-top:14px}
.nav2 button{
  flex:1;padding:15px;border-radius:var(--r-pill);
  font:600 15px/1 "Inter",sans-serif;
  transition:transform .12s var(--ease),background .18s;min-height:48px;
}
.nav2 .gh{background:var(--fog);color:var(--ink)}
.nav2 .pri{background:var(--ink);color:var(--canvas)}
.nav2 button:active{transform:scale(.97)}

/* вопрос */
.q{animation:qIn .22s var(--ease)}
@keyframes qIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.q-kind{font:500 11px/1 "Inter",sans-serif;letter-spacing:0.09em;text-transform:uppercase;color:var(--steel);margin-bottom:13px}
.q-kind .hard{color:var(--signal)}
.q-text{font:600 19px/1.4 "Inter",sans-serif;letter-spacing:-0.02em;margin:0 0 6px}
.q-sub{color:var(--graphite);font-size:15px;margin:10px 0 0;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.opt{
  display:flex;align-items:center;gap:13px;padding:16px 17px;
  background:var(--canvas);border:1px solid var(--mist);border-radius:var(--r-card);
  text-align:left;width:100%;font-size:15.5px;line-height:1.4;
  transition:transform .12s var(--ease),border-color .2s,background .2s;min-height:56px;
}
.opt:active:not(.dead){transform:scale(.98)}
.opt .mark{
  flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:50%;
  background:var(--fog);font:600 12.5px/1 "Inter",sans-serif;color:var(--graphite);
  transition:background .2s,color .2s;
}
.opt .txt{flex:1}
.opt.good{background:var(--ok-soft);border-color:var(--ok-line)}
.opt.good .mark{background:var(--ok);color:#fff}
.opt.bad{background:var(--miss-soft);border-color:var(--miss-line);animation:nope .18s var(--ease)}
.opt.bad .mark{background:var(--miss);color:#fff}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.opt.dead{opacity:.45;pointer-events:none}
.opt.dead.good{opacity:1}
.num-wrap{margin-top:20px}
.num-in{
  width:100%;padding:17px 19px;background:var(--canvas);
  border:1.5px solid var(--mist);border-radius:var(--r-card);
  font:600 20px/1 "Inter",sans-serif;font-variant-numeric:tabular-nums;
  text-align:center;transition:border-color .2s,background .2s;min-height:58px;
}
.num-in:focus{outline:none;border-color:var(--ink)}
.num-in.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.num-in.bad{background:var(--miss-soft);border-color:var(--miss);color:var(--miss);animation:nope .18s var(--ease)}
.num-hint{text-align:center;font-size:12.5px;color:var(--steel);margin-top:9px}

/* подсказки */
.aid{margin-top:16px}
.aid-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;
  border:1px solid var(--mist);border-radius:var(--r-pill);
  font:600 13.5px/1 "Inter",sans-serif;color:var(--graphite);
  transition:transform .12s var(--ease),background .18s,border-color .18s;min-height:46px;
}
.aid-btn:active{transform:scale(.98);background:var(--fog)}
.aid-btn.sol{border-color:var(--steel);color:var(--ink)}
.aid-box{
  margin-top:10px;padding:16px 18px;background:#fbfbfd;
  border:1px solid var(--mist);border-radius:var(--r-card);
  font-size:14.8px;line-height:1.62;color:var(--graphite);
  animation:qIn .2s var(--ease);
}
.aid-box b{color:var(--ink);font-weight:600}
.aid-box .lbl{
  font:600 11px/1 "Inter",sans-serif;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--steel);display:block;margin-bottom:9px;
}
.aid-box p{margin:0 0 10px}
.aid-box p:last-child{margin-bottom:0}
.aid-box.sol{background:var(--fog);border-color:var(--mist)}
.aid-box .step{
  display:flex;gap:11px;margin-bottom:11px;
}
.aid-box .step:last-child{margin-bottom:0}
.aid-box .step .no{
  flex:0 0 21px;height:21px;display:grid;place-items:center;border-radius:50%;
  background:var(--ink);color:var(--canvas);
  font:600 11px/1 "Inter",sans-serif;margin-top:1px;
}

/* объяснение */
.exp{max-height:0;overflow:hidden;transition:max-height .28s var(--ease),margin .28s var(--ease);margin-top:0}
.exp.open{max-height:700px;margin-top:18px}
.exp-in{padding:18px 19px;border-radius:var(--r-card);font-size:14.8px;line-height:1.62}
.exp-in.win{background:var(--ok-soft);border:1px solid var(--ok-line)}
.exp-in.lose{background:var(--miss-soft);border:1px solid var(--miss-line)}
.exp-h{font:600 13px/1 "Inter",sans-serif;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.exp-in.win .exp-h{color:var(--ok)}
.exp-in.lose .exp-h{color:var(--miss)}
.exp p{margin:0 0 10px;color:var(--ink)}
.exp p:last-child{margin-bottom:0}
.exp .rule{margin-top:13px;padding-top:13px;border-top:1px solid rgba(0,0,0,.09);font-size:14px;color:var(--graphite)}
.exp .rule b{color:var(--ink);font-weight:600}

/* нижняя кнопка */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:14px 20px calc(14px + var(--safe-b));
  background:linear-gradient(to top,var(--canvas) 62%,rgba(255,255,255,0));
  pointer-events:none;opacity:0;transform:translateY(10px);
  transition:opacity .24s var(--ease),transform .24s var(--ease);
}
.dock.up{opacity:1;transform:translateY(0);pointer-events:auto}
.dock-in{max-width:720px;margin:0 auto}
.go{
  width:100%;padding:18px;background:var(--ink);color:var(--canvas);
  border-radius:var(--r-pill);font:600 16px/1 "Inter",sans-serif;
  transition:transform .12s var(--ease);min-height:56px;
}
.go:active{transform:scale(.975)}

/* итог */
.done-wrap{text-align:center;padding:44px 0 0}
.big-stars{display:flex;justify-content:center;gap:11px;margin-bottom:26px}
.bstar{width:38px;height:38px;opacity:0;transform:scale(.88)}
.bstar.pop{animation:pop .32s var(--ease) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.done-h{font:700 25px/1.2 "Inter",sans-serif;letter-spacing:-0.025em;margin:0 0 9px}
.done-s{color:var(--graphite);font-size:15.5px;margin:0 0 30px}
.tip{
  text-align:left;padding:17px 19px;background:var(--fog);border-radius:var(--r-card);
  margin-bottom:26px;font-size:14.5px;line-height:1.6;color:var(--graphite);
}
.tip b{color:var(--ink);font-weight:600;display:block;margin-bottom:6px;font-size:13px}
.done-btns{display:flex;flex-direction:column;gap:10px}
.done-btns button{
  padding:17px;border-radius:var(--r-pill);font:600 15.5px/1 "Inter",sans-serif;
  transition:transform .12s var(--ease);min-height:54px;
}
.done-btns .pri{background:var(--ink);color:var(--canvas)}
.done-btns .gh{background:var(--fog);color:var(--ink)}
.done-btns button:active{transform:scale(.975)}

/* десктоп */
@media (min-width:900px){
  .screens{min-height:100vh}
  .pad{max-width:1080px;padding:38px 40px 60px}
  .home-grid{display:grid;grid-template-columns:1fr 380px;gap:52px;align-items:start}
  .home-right{position:sticky;top:38px}
  .hero h1{font-size:38px}
  .resume{margin-top:0}
  .ch:hover{border-color:var(--steel);background:var(--fog)}
  .ch.next:hover{border-color:var(--ink)}
  .work{max-width:720px;margin:0 auto}
  .card{padding:34px 32px}
  .card h3{font-size:22px}
  .opt:hover:not(.dead){border-color:var(--steel);background:var(--fog)}
  .back:hover{background:var(--fog)}
  .aid-btn:hover{background:var(--fog);border-color:var(--steel)}
  .slow-btn:hover{background:var(--mist)}
  .dock{position:static;opacity:1;transform:none;pointer-events:auto;
        background:none;padding:22px 0 0;max-width:720px;margin:0 auto}
  .keys{display:flex;justify-content:center;gap:16px;margin-top:18px;font-size:12px;color:var(--steel)}
  .keys kbd{
    display:inline-block;padding:2px 7px;margin-right:5px;background:var(--fog);
    border:1px solid var(--mist);border-radius:5px;font:500 11px/1.5 "Inter",sans-serif;
  }
}
@media (max-width:899px){.keys{display:none}.home-grid{display:block}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="screens">

  <section class="screen on" id="s-home">
    <div class="pad">
      <div class="home-grid">
        <div class="home-left">
          <div class="hero">
            <h1>Les suites</h1>
            <p class="sub">Première spécialité · programme 2026</p>
          </div>
          <div class="meter">
            <div class="meter-top">
              <span class="meter-lbl">PROGRESSION</span>
              <span class="meter-val" id="m-val">0 / 6</span>
            </div>
            <div class="meter-bar"><div class="meter-fill" id="m-fill"></div></div>
          </div>
          <div class="streak" id="streak" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s4 4 4 8a4 4 0 0 1-8 0c0-1.5.5-2.5.5-2.5S6 10 6 14a6 6 0 0 0 12 0c0-6-6-12-6-12z"/></svg>
            <span><b id="streak-n">0</b> <span id="streak-w">jours d'affilée</span></span>
          </div>
        </div>
        <div class="home-right">
          <button class="resume" id="resume">
            <span class="r-lbl" id="r-lbl">COMMENCER</span>
            <span class="r-name" id="r-name">Généralités</span>
            <span class="r-meta" id="r-meta">4 fiches · 5 exercices · ~12 min</span>
          </button>
        </div>
      </div>
      <p class="list-lbl" style="margin-top:34px">CHAPITRES</p>
      <div class="chs" id="chs"></div>
      <a class="foot-link" href="../">
        Ouvrir le cours
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H8M17 7v9"/></svg>
      </a>
    </div>
  </section>

  <section class="screen" id="s-work">
    <div class="top">
      <div class="top-in">
        <button class="back" id="back" aria-label="Retour">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="top-t">
          <span class="top-name" id="w-name">Généralités</span>
          <span class="top-step" id="w-step">Fiche 1 / 4</span>
        </div>
      </div>
      <div class="top-bar"><div class="top-fill" id="w-fill"></div></div>
    </div>
    <div class="pad"><div class="work"><div id="stage"></div></div></div>
    <div class="dock" id="dock">
      <div class="dock-in">
        <button class="go" id="go">Suivant</button>
        <div class="keys" id="keys"></div>
      </div>
    </div>
  </section>

  <section class="screen" id="s-done">

{

    {
      k:"DÉFINITION", t:"On ajoute toujours le même nombre",

        <div class="show"><span class="v">u<sub>n+1</sub></span> = <span class="v">u<sub>n</sub></span> + <span class="v">r</span></div>
        <p>Ce nombre <span class="v">r</span> s'appelle la <b>raison</b> de la suite.</p>
        <div class="show">7,&nbsp; 11,&nbsp; 15,&nbsp; 19,&nbsp; 23,&nbsp; … &nbsp;&nbsp;(<span class="v">r</span> = 4)</div>
        <div class="note"><b>Attention au mot.</b> « Raison » ne veut pas dire « cause ». C'est le nombre qu'on ajoute à chaque étape.</div>`,
      lent:`<p><b>La tirelire.</b></p>
        <p>Tu mets 5 € dans ta tirelire chaque semaine. Toujours 5, jamais plus, jamais moins.</p>
        <p>Semaine 0 : 20 € · semaine 1 : 25 € · semaine 2 : 30 € · semaine 3 : 35 €…</p>
        <p>C'est une suite arithmétique de <b>raison 5</b>. Le mot « raison » désigne juste ce qu'on ajoute.</p>
        <p><b>Autre image : l'escalier régulier.</b> Toutes les marches ont la même hauteur. Cette hauteur, c'est la raison.</p>
        <p>Et si tu <b>retires</b> 5 € par semaine ? Alors la raison vaut −5. Une raison peut être négative — la suite descend.</p>`
    },
    {
      k:"RECONNAÎTRE", t:"La différence doit être constante",
      c:`<p>Pour vérifier qu'une suite est arithmétique, on calcule <span class="v">u<sub>n+1</sub> − u<sub>n</sub></span>.</p>
        <p>Si le résultat <b>ne dépend pas de <span class="v">n</span></b>, la suite est arithmétique, et ce résultat est la raison.</p>
        <div class="show"><span class="v">u<sub>n</sub></span> = 3<span class="v">n</span> + 2 &nbsp;→&nbsp; <span class="v">u<sub>n+1</sub> − u<sub>n</sub></span> = 3</div>
        <div class="note"><b>Erreur de devoir.</b> Vérifier sur deux ou trois termes ne suffit pas. Il faut le calcul général, avec la lettre <span class="v">n</span>.</div>`,
      lent:`<p><b>Comment savoir si l'escalier est régulier ?</b></p>
        <p>Tu mesures une marche : 18 cm. Une autre : 18 cm. Une troisième : 18 cm. Bon signe — mais tu n'as mesuré que trois marches sur cent.</p>
        <p>En maths, on ne peut pas toutes les mesurer : il y en a une infinité. D'où le calcul <b>avec la lettre</b> <span class="v">n</span> : il mesure toutes les marches d'un coup.</p>
        <p><b>Comment lire le résultat ?</b></p>
        <p>Si tu trouves 3 → aucun <span class="v">n</span> dedans → toutes les marches font 3 → arithmétique de raison 3.</p>
        <p>Si tu trouves 2<span class="v">n</span> + 1 → le résultat change selon la marche → les marches ne sont pas égales → <b>pas</b> arithmétique.</p>`

    {
      k:"FORMULE", t:"Le terme général",
      c:`<p>Pour aller de <span class="v">u<sub>0</sub></span> à <span class="v">u<sub>n</sub></span>, on ajoute <span class="v">r</span> exactement <span class="v">n</span> fois :</p>

        <p><b>Et la forme avec <span class="v">p</span> ?</b> Si tu pars de la semaine 3 pour aller à la semaine 8, il s'écoule 8 − 3 = 5 semaines. D'où le <span class="v">(n − p)</span> : c'est le <b>nombre de pas</b> entre les deux rangs.</p>`

/* ─────────────────────────────────────────────

{

  cartes:[
    {
      k:"DÉFINITION", t:"On multiplie toujours par le même nombre",
      c:`<p>Une suite est <b>géométrique</b> s'il existe un réel <span class="v">q</span> non nul tel que :</p>
        <div class="show"><span class="v">u<sub>n+1</sub></span> = <span class="v">q</span> × <span class="v">u<sub>n</sub></span></div>
        <p>Ce nombre <span class="v">q</span> s'appelle aussi la <b>raison</b>.</p>
        <div class="show">3,&nbsp; 6,&nbsp; 12,&nbsp; 24,&nbsp; 48,&nbsp; … &nbsp;&nbsp;(<span class="v">q</span> = 2)</div>
        <div class="note"><b>Même mot, autre rôle.</b> Chez les arithmétiques on <b>ajoute</b> la raison. Ici on <b>multiplie</b> par elle.</div>`,
      lent:`<p><b>Les bactéries.</b></p>
        <p>Une bactérie se divise en deux chaque heure. Au départ il y en a 3.</p>
        <p>Heure 0 : 3 · heure 1 : 6 · heure 2 : 12 · heure 3 : 24…</p>
        <p>À chaque étape on <b>multiplie par 2</b>. C'est une suite géométrique de raison 2.</p>
        <p><b>La différence avec l'arithmétique.</b></p>
        <p>Arithmétique : +5, +5, +5 → ça monte <b>régulièrement</b>, comme un escalier.<br>
           Géométrique : ×2, ×2, ×2 → ça monte de plus en plus vite, ça <b>explose</b>.</p>
        <p>20, 25, 30, 35 (arithmétique) contre 20, 40, 80, 160 (géométrique). Même départ, rien à voir après quelques pas.</p>`
    },
    {
      k:"RECONNAÎTRE", t:"Le quotient doit être constant",
      c:`<p>On divise chaque terme par le précédent. Si le résultat est toujours le même, la suite est géométrique.</p>
        <div class="show">6/3 = 2&nbsp;;&nbsp; 12/6 = 2&nbsp;;&nbsp; 24/12 = 2</div>
        <p>Le quotient vaut 2 partout → suite géométrique de raison 2.</p>
        <div class="note"><b>Comparaison.</b> Arithmétique → on regarde la <b>différence</b>. Géométrique → on regarde le <b>quotient</b>.</div>`,
      lent:`<p><b>Comment choisir quoi tester ?</b></p>
        <p>Devant une liste de nombres, pose-toi la question dans cet ordre :</p>
        <p><b>1. J'ajoute toujours la même chose ?</b> Teste les différences.<br>
        7, 11, 15, 19 → écarts 4, 4, 4 → arithmétique.</p>
        <p><b>2. Sinon, je multiplie toujours par la même chose ?</b> Teste les quotients.<br>
        3, 6, 12, 24 → quotients 2, 2, 2 → géométrique.</p>
        <p><b>Indice visuel.</b> Si les nombres grandissent lentement et régulièrement → probablement arithmétique. S'ils s'emballent (3, 6, 12, 24, 48…) → probablement géométrique.</p>`
    },
    {
      k:"FORMULE", t:"Le terme général",
      c:`<p>Pour aller de <span class="v">u<sub>0</sub></span> à <span class="v">u<sub>n</sub></span>, on multiplie par <span class="v">q</span> exactement <span class="v">n</span> fois :</p>
        <div class="show"><span class="v">u<sub>n</sub></span> = <span class="v">u<sub>0</sub></span> × <span class="v">q</span><sup><span class="v">n</span></sup></div>
        <p>Forme générale :</p>
        <div class="show"><span class="v">u<sub>n</sub></span> = <span class="v">u<sub>p</sub></span> × <span class="v">q</span><sup><span class="v">n − p</span></sup></div>
        <div class="note"><b>L'exposant est le nombre de pas.</b> Chez les arithmétiques ce nombre multipliait <span class="v">r</span> ; ici il devient l'exposant de <span class="v">q</span>.</div>`,
      lent:`<p><b>Pourquoi une puissance ?</b></p>
        <p>Reprends les bactéries : 3 au départ, ×2 chaque heure.</p>
        <p>Après 4 heures, tu as multiplié par 2 quatre fois de suite :</p>
        <div class="show">3 × 2 × 2 × 2 × 2 = 3 × 2<sup>4</sup> = 48</div>
        <p>« Multiplier quatre fois par 2 » s'écrit 2<sup>4</sup>. La puissance, c'est juste une écriture courte.</p>
        <p><b>Le parallèle avec l'arithmétique.</b></p>
        <p>Arithmétique : ajouter <span class="v">r</span> quatre fois = + 4<span class="v">r</span><br>
           Géométrique : multiplier par <span class="v">q</span> quatre fois = × <span class="v">q</span><sup>4</sup></p>
        <p>Même logique, l'une avec des additions, l'autre avec des multiplications.</p>`
    },

      c:`<p>Un pourcentage d'évolution donne toujours une suite <b>géométrique</b>.</p>

        <p><b>Pourquoi ça compte ?</b> Parce que l'année suivante, les 10 % se calculent sur <b>220</b>, pas sur 200. L'augmentation n'est plus 20 € mais 22 €.</p>
        <p>C'est toute la différence avec une hausse fixe de 20 € par an. Le pourcentage s'applique à un montant qui change — d'où la multiplication, d'où la suite géométrique.</p>
        <p><b>Pour une baisse de 20 %</b> : il reste 80 % du prix, donc on multiplie par 0,8.</p>`

   5 · MAJORATION, MINORATION     ← DS

{
  n:5, nom:"Majoration, minoration", sous:"Suites bornées", pret:true, ds:true,
  cartes:[
    {
      k:"DÉFINITIONS", t:"Un plafond, un plancher",
      c:`<p>Trois mots à distinguer :</p>
        <div class="show" style="text-align:left;padding:19px 21px;font-size:16px">
          <div style="margin-bottom:11px"><b>Majorée</b> : il existe <span class="v">M</span> tel que <span class="v">u<sub>n</sub></span> ⩽ <span class="v">M</span> pour tout <span class="v">n</span></div>
          <div style="margin-bottom:11px"><b>Minorée</b> : il existe <span class="v">m</span> tel que <span class="v">u<sub>n</sub></span> ⩾ <span class="v">m</span> pour tout <span class="v">n</span></div>
          <div><b>Bornée</b> : majorée <b>et</b> minorée</div>
        </div>
        <p><span class="v">M</span> s'appelle un <b>majorant</b>, <span class="v">m</span> un <b>minorant</b>.</p>
        <div class="note"><b>Article indéfini.</b> On dit « <b>un</b> majorant », pas « le » : s'il en existe un, il en existe une infinité d'autres au-dessus.</div>`,
      lent:`<p><b>Le plafond de la pièce.</b></p>
        <p>Tu sautes dans une pièce. Tu ne peux pas dépasser le plafond, à 2,50 m. Le plafond <b>majore</b> ta hauteur.</p>
        <p>Le sol, lui, te <b>minore</b> : tu ne descends jamais en dessous de 0.</p>
        <p>Tu es donc <b>borné</b> entre le sol et le plafond.</p>
        <p><b>Un détail important.</b> Le toit de l'immeuble est aussi un majorant — tu ne le dépasses pas non plus. Et le ciel aussi. Il y a une infinité de majorants.</p>
        <p>C'est pour ça qu'on dit « <b>un</b> majorant » : il suffit d'en trouver un seul pour prouver que la suite est majorée. Pas besoin du plus petit.</p>
        <p><b>Et on ne le touche pas forcément.</b> Si tu sautes à 1,80 m maximum, le plafond à 2,50 m reste un majorant valable, même si tu ne l'atteins jamais.</p>`
    },
    {
      k:"MÉTHODE", t:"Comment montrer qu'une suite est majorée",
      c:`<p>Pour prouver <span class="v">u<sub>n</sub></span> ⩽ <span class="v">M</span>, on étudie le signe de <span class="v">u<sub>n</sub> − M</span>.</p>
        <p>Si on montre que <span class="v">u<sub>n</sub> − M</span> ⩽ 0 pour tout <span class="v">n</span>, c'est gagné.</p>
        <p>Exemple : montrer que <span class="v">u<sub>n</sub></span> = <span class="v">n</span>/(<span class="v">n</span>+1) est majorée par 1.</p>
        <div class="show"><span class="v">u<sub>n</sub></span> − 1 = <span style="display:inline-block;text-align:center;vertical-align:middle"><span style="display:block;border-bottom:1.4px solid;padding:0 5px">−1</span><span style="display:block;padding:0 5px"><span class="v">n</span>+1</span></span> &lt; 0</div>
        <p>Le numérateur est négatif, le dénominateur positif : le quotient est négatif. Donc <span class="v">u<sub>n</sub></span> &lt; 1.</p>`,
      lent:`<p><b>La technique de la soustraction.</b></p>
        <p>Comment prouver que tu es plus petit que ton frère ? Tu mesures la différence : si « toi moins lui » donne un nombre négatif, tu es plus petit.</p>
        <p>En maths, pareil. Pour montrer <span class="v">u<sub>n</sub></span> ⩽ 3, on calcule <span class="v">u<sub>n</sub></span> − 3 et on montre que c'est négatif.</p>
        <p><b>Pourquoi ne pas comparer directement ?</b></p>
        <p>Parce qu'une soustraction se simplifie, alors qu'une inégalité se manipule mal. Après calcul, on tombe souvent sur une fraction dont le signe se lit d'un coup d'œil.</p>
        <p><b>La règle des signes pour une fraction :</b></p>
        <p>négatif ÷ positif = <b>négatif</b><br>positif ÷ positif = <b>positif</b></p>
        <p>Il suffit donc de regarder le signe du haut et celui du bas séparément.</p>`
    },
    {
      k:"THÉORÈME", t:"Croissante et majorée",
      c:`<p>Le résultat le plus utilisé du chapitre :</p>
        <div class="show" style="text-align:left;padding:19px 21px;font-size:15.5px">
          <div style="margin-bottom:9px">Toute suite <b>croissante et majorée</b> converge.</div>
          <div>Toute suite <b>décroissante et minorée</b> converge.</div>
        </div>
        <div class="note"><b>Attention.</b> Le théorème garantit que la limite <b>existe</b>, mais il ne donne <b>pas sa valeur</b>. C'est une question classique de DS.</div>`,
      lent:`<p><b>L'ascenseur qui monte vers un plafond.</b></p>
        <p>Un ascenseur monte, monte, monte — mais il y a un plafond qu'il ne peut pas traverser.</p>
        <p>Que va-t-il se passer ? Il ne peut pas monter indéfiniment (le plafond l'en empêche) et il ne peut pas redescendre (il ne fait que monter). Il est donc obligé de <b>se stabiliser</b> quelque part.</p>
        <p>C'est exactement le théorème : croissante + majorée → elle converge vers une valeur.</p>
        <p><b>Mais attention au piège du DS.</b></p>
        <p>Le théorème dit « elle s'arrête quelque part ». Il ne dit <b>pas où</b>.</p>
        <p>L'ascenseur peut s'arrêter juste sous le plafond, ou bien trois étages plus bas. Le plafond ne donne pas la réponse — il garantit seulement qu'il y en a une.</p>`
    }

        regle:`Un carré est toujours positif ou nul.`,
        aides:[`Le plus petit <span class="v">n</span>² possible est atteint pour <span class="v">n</span> = 0.`,`0 + 4 = 4.`],
        sol:[`<span class="v">n</span>² ⩾ 0 pour tout <span class="v">n</span>`,`Donc <span class="v">u<sub>n</sub></span> ⩾ 0 + 4`,`Minorant : <b>4</b> (atteint en <span class="v">n</span> = 0)`] }
    ],
    [
      { k:"QCM ⭑", hard:true, type:"qcm", q:`Pour montrer que <span class="v">u<sub>n</sub></span> ⩽ 5, quelle est la bonne méthode ?`,
        opts:[{t:`Étudier le signe de <span class="v">u<sub>n</sub></span> − 5`,ok:true,why:`Si la différence est négative, alors <span class="v">u<sub>n</sub></span> ⩽ 5.`},{t:`Calculer les 10 premiers termes`,ok:false,why:`Cela ne prouve rien pour les suivants.`},{t:`Montrer que la suite est croissante`,ok:false,why:`Sans rapport avec la majoration.`}],
        regle:`Majoration → signe de <span class="v">u<sub>n</sub> − M</span>.`,
        aides:[`Comment prouver qu'un nombre est plus petit qu'un autre ?`,`On soustrait et on regarde le signe.`],
        sol:[`<span class="v">u<sub>n</sub></span> ⩽ 5 équivaut à <span class="v">u<sub>n</sub></span> − 5 ⩽ 0`,`On calcule cette différence et on étudie son signe`,`Méthode : <b>signe de <span class="v">u<sub>n</sub></span> − 5</b>`] },
      { k:"QCM", type:"qcm", q:`Suite géométrique de raison 0,5 avec <span class="v">u<sub>0</sub></span> = 8 : 8, 4, 2, 1, …<br>Est-elle bornée ?`,
        opts:[{t:`Oui, entre 0 et 8`,ok:true,why:`Elle décroît vers 0 sans jamais devenir négative.`},{t:`Non, elle décroît`,ok:false,why:`Décroître n'empêche pas d'être bornée.`},{t:`Seulement minorée`,ok:false,why:`8 la majore aussi : c'est son plus grand terme.`}],
        regle:`Une suite décroissante positive est bornée.`,
        aides:[`Quel est le plus grand terme ? Descend-elle sous 0 ?`,`Le premier terme majore, et 0 minore.`],
        sol:[`Le plus grand terme est <span class="v">u<sub>0</sub></span> = 8 : majorant`,`Tous les termes restent positifs : 0 minore`,`<b>Bornée entre 0 et 8</b>`] },
      { k:"VRAI OU FAUX ⭑", hard:true, type:"qcm", q:`« Une suite croissante est toujours minorée. »`,
        opts:[{t:"Vrai",ok:true,why:`Son premier terme minore toute la suite, puisqu'elle ne descend jamais.`},{t:"Faux",ok:false,why:`Si elle croît, aucun terme ne passe sous le premier — celui-ci la minore.`}],
        regle:`Une suite croissante est minorée par son premier terme.`,
        aides:[`Si la suite ne descend jamais, peut-elle passer sous son point de départ ?`,`Non : <span class="v">u<sub>0</sub></span> la minore.`],
        sol:[`Croissante : <span class="v">u<sub>0</sub></span> ⩽ <span class="v">u<sub>1</sub></span> ⩽ <span class="v">u<sub>2</sub></span> ⩽ …`,`Tous les termes sont ⩾ <span class="v">u<sub>0</sub></span>`,`<span class="v">u<sub>0</sub></span> est un minorant. <b>Vrai</b>`] },
      { k:"AUTOMATISME", type:"num", q:`<span class="v">u<sub>n</sub></span> = 2 + 3/(<span class="v">n</span>+1).<br>Quel est le plus grand terme de la suite ?`,
        sub:`Il est atteint pour <span class="v">n</span> = 0.`,
        rep:5, ind:"un entier", ok:`<span class="v">u<sub>0</sub></span> = 2 + 3 = <b>5</b>`, no:`Calcule <span class="v">u<sub>0</sub></span>.`,
        regle:`Une suite décroissante atteint son maximum au premier terme.`,
        aides:[`Remplace <span class="v">n</span> par 0.`,`2 + 3/1.`],
        sol:[`<span class="v">u<sub>0</sub></span> = 2 + 3/(0+1)`,`= 2 + 3`,`<b>5</b> — c'est le maximum car la fraction diminue ensuite`] },
      { k:"QCM", type:"qcm", q:`Quelle suite n'est <b>pas</b> bornée ?`,
        opts:[{t:`<span class="v">u<sub>n</sub></span> = 3<sup><span class="v">n</span></sup>`,ok:true,why:`Elle croît sans limite : aucun majorant possible.`},{t:`<span class="v">u<sub>n</sub></span> = (−1)<sup><span class="v">n</span></sup>`,ok:false,why:`Elle reste entre −1 et 1.`},{t:`<span class="v">u<sub>n</sub></span> = 1/(<span class="v">n</span>+1)`,ok:false,why:`Elle reste entre 0 et 1.`}],
        regle:`Une suite géométrique de raison &gt; 1 n'est pas majorée.`,
        aides:[`Laquelle dépasse n'importe quel nombre ?`,`3<sup><span class="v">n</span></sup> : 1, 3, 9, 27, 81, 243…`],
        sol:[`3<sup><span class="v">n</span></sup> dépasse tout nombre donné → non majorée`,`(−1)<sup><span class="v">n</span></sup> reste dans [−1 ; 1]`,`1/(<span class="v">n</span>+1) reste dans ]0 ; 1]`] }
    ]
  ]
},

/* ─────────────────────────────────────────────
   6 · PROBLÈMES
   ───────────────────────────────────────────── */
{ n:6, nom:"Problèmes", sous:"Exercices type épreuve", pret:false, ds:false }

];


/* ═══════════ СОСТОЯНИЕ ═══════════ */

const KEY = "suites.fr.v1";
let DB = load();

function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  return { ch:{}, streak:0, last:null, aides:0 };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function today(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function bumpStreak(){
  const t=today(); if(DB.last===t) return;
  const y=new Date(Date.now()-864e5);
  const yk=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  DB.streak=(DB.last===yk)?(DB.streak||0)+1:1; DB.last=t; save();
}

let R = { ch:1, card:0, qi:0, queue:[], first:0, total:0, tried:false, mode:"card", weak:[], serie:0, aides:0 };

const $ = id => document.getElementById(id);
const starSVG = lit => `<svg class="star ${lit?'lit':''}" viewBox="0 0 24 24" fill="${lit?'#1c2024':'#80838d'}"><path d="M12 2l2.9 6.3 6.6.7-4.9 4.5 1.4 6.5L12 16.8 6 20l1.4-6.5L2.5 9l6.6-.7z"/></svg>`;

function show(id){
  document.querySelectorAll(".screen").forEach(s=>{
    s.classList.remove("on"); s.classList.toggle("left", s.id!==id);
  });
  const el=$(id); el.classList.remove("left"); el.classList.add("on"); el.scrollTop=0;
}

/* ═══════════ ГЛАВНАЯ ═══════════ */

function drawHome(){
  const done = Object.values(DB.ch).filter(c=>c.done).length;
  $("m-val").textContent = done + " / 6" + (done>0 ? "  ·  " + Math.round(done/6*100) + "%" : "");
  setTimeout(()=>{ $("m-fill").style.width = (done/6*100)+"%"; }, 60);

  if(DB.streak>0){
    $("streak").style.display="inline-flex";
    $("streak-n").textContent = DB.streak;
    $("streak-w").textContent = DB.streak===1 ? "jour d'affilée" : "jours d'affilée";
  }

  const todo = CHAPITRES.find(x=>x.pret && !(DB.ch[x.n]&&DB.ch[x.n].done));
  if(todo){
    $("r-lbl").textContent = todo.ds ? "AU PROGRAMME DU DS" : "CONTINUER";
    $("r-name").textContent = todo.nom;
    $("r-meta").textContent = todo.cartes.length + " fiches · 5 exercices · ~12 min";
  } else {
    const prets = CHAPITRES.filter(x=>x.pret);
    const pick = prets[0];
    const s = ((DB.ch[pick.n]||{}).serie||0) % pick.series.length;
    $("r-lbl").textContent = "SÉRIE " + (s+1);
    $("r-name").textContent = pick.nom;
    $("r-meta").textContent = "5 nouveaux exercices";
  }

  const box=$("chs"); box.innerHTML="";
  CHAPITRES.forEach(c=>{
    const d = DB.ch[c.n];
    const b=document.createElement("button");
    const firstTodo = CHAPITRES.find(x=>x.pret && !(DB.ch[x.n]&&DB.ch[x.n].done));
    b.className="ch"+(d&&d.done?" done":"")+(firstTodo&&firstTodo.n===c.n?" next":"")+(!c.pret?" lock":"");
    const meta = c.pret
      ? (d&&d.done ? "série "+(((d.serie||0)%3)+1)+" disponible" : c.sous)
      : "bientôt";
    b.innerHTML=`
      <span class="ch-num">${c.n}</span>
      <span class="ch-body">
        <span class="ch-name">${c.nom}${c.ds?`<span class="ds-tag">DS</span>`:``}</span>
        <span class="ch-meta">${meta}</span>
      </span>
      <span class="stars">${[1,2,3].map(i=>starSVG(d&&d.stars>=i)).join("")}</span>`;
    if(c.pret) b.onclick=()=>startCh(c.n);
    box.appendChild(b);
  });
}

/* ═══════════ РАЗДЕЛ ═══════════ */

function startCh(n){
  const ch = CHAPITRES[n-1];
  const st = DB.ch[n] || {};
  const serie = (st.serie||0) % ch.series.length;
  R = { ch:n, card:0, qi:0, queue:[...ch.series[serie]], first:0, total:0,
        tried:false, mode:"card", weak:[], serie, aides:0 };
  $("w-name").textContent = ch.nom;
  show("s-work");
  if(st.done) { R.mode="q"; drawQ(); } else drawCard();
}

function drawCard(){
  R.mode="card";
  const ch = CHAPITRES[R.ch-1];
  const c = ch.cartes[R.card];
  $("w-step").textContent = `Fiche ${R.card+1} / ${ch.cartes.length}`;
  $("w-fill").style.width = ((R.card+1)/(ch.cartes.length+R.queue.length)*100)+"%";

  $("stage").innerHTML = `
    <div class="card">
      <div class="card-k">${c.k}</div>
      <h3>${c.t}</h3>
      ${c.c}
      ${c.lent ? `
        <button class="slow-btn" id="slow-btn">
          <span id="slow-txt">Je n'ai pas compris</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="slow" id="slow"><div class="slow-in">${c.lent}</div></div>` : ``}
    </div>
    <div class="dots">${ch.cartes.map((_,i)=>`<span class="dot ${i===R.card?'on':''}"></span>`).join("")}</div>
    <div class="nav2">
      ${R.card>0?`<button class="gh" id="cprev">Précédent</button>`:``}
      <button class="pri" id="cnext">${R.card===ch.cartes.length-1?"Aux exercices":"Suivant"}</button>
    </div>`;

  $("dock").classList.remove("up");
  const sb=$("slow-btn");
  if(sb) sb.onclick=()=>{
    const s=$("slow"), open=s.classList.toggle("open");
    sb.classList.toggle("open",open);
    $("slow-txt").textContent = open ? "Masquer" : "Je n'ai pas compris";
    if(open){ DB.aides=(DB.aides||0)+1; save(); }
  };
  const p=$("cprev"); if(p) p.onclick=()=>{ R.card--; drawCard(); };
  $("cnext").onclick=()=>{
    if(R.card===ch.cartes.length-1){ R.qi=0; drawQ(); }
    else { R.card++; drawCard(); }
  };
}

/* ═══════════ ВОПРОС ═══════════ */

function drawQ(){
  R.mode="q"; R.tried=false;
  const ch = CHAPITRES[R.ch-1];
  const q = R.queue[R.qi];
  const base = DB.ch[R.ch] && DB.ch[R.ch].done ? 0 : ch.cartes.length;
  const step = base + R.qi + 1;
  const all  = base + R.queue.length;

  $("w-step").textContent = `Exercice ${R.qi+1} / ${R.queue.length}`;
  $("w-fill").style.width = (step/all*100)+"%";

  let inner="";
  if(q.type==="qcm"){
    inner = `<div class="opts">`+q.opts.map((o,i)=>
      `<button class="opt" data-i="${i}"><span class="mark">${String.fromCharCode(65+i)}</span><span class="txt">${o.t}</span></button>`
    ).join("")+`</div>`;
  } else {
    inner = `<div class="num-wrap">
      <input class="num-in" id="nin" type="text" inputmode="decimal" autocomplete="off" placeholder="—">
      <div class="num-hint">${q.ind||""}</div>
    </div>`;
  }

  const kindHtml = q.hard ? q.k.replace("⭑",`<span class="hard">⭑</span>`) : q.k;

  $("stage").innerHTML = `
    <div class="q">
      <div class="q-kind">${kindHtml}</div>
      <p class="q-text">${q.q}</p>
      ${q.sub?`<p class="q-sub">${q.sub}</p>`:``}
      ${inner}
      <div class="aid" id="aid"></div>
      <div class="exp" id="exp"><div class="exp-in" id="expin"></div></div>
    </div>`;

  drawAid(0);
  $("dock").classList.remove("up");
  $("go").textContent="Suivant";

  if(q.type==="qcm"){
    document.querySelectorAll(".opt").forEach(b=>{ b.onclick=()=>answerQcm(parseInt(b.dataset.i)); });
    $("keys").innerHTML = q.opts.map((_,i)=>`<span><kbd>${i+1}</kbd></span>`).join("")+`<span><kbd>↵</kbd>suivant</span>`;
  } else {
    const inp=$("nin");
    setTimeout(()=>{ if(window.innerWidth>=900) inp.focus(); },300);
    inp.onkeydown=e=>{ if(e.key==="Enter") answerNum(); };
    $("go").textContent="Vérifier"; $("go").onclick=answerNum;
    $("dock").classList.add("up");
    $("keys").innerHTML=`<span><kbd>↵</kbd>vérifier</span>`;
  }
}

/* ступенчатые подсказки */
function drawAid(level){
  const q = R.queue[R.qi];
  const box = $("aid");
  if(!q.aides || !q.sol){ box.innerHTML=""; return; }

  let html = "";
  for(let i=0;i<level && i<q.aides.length;i++){
    html += `<div class="aid-box"><span class="lbl">Indice ${i+1}</span><p>${q.aides[i]}</p></div>`;
  }
  if(level > q.aides.length){
    html += `<div class="aid-box sol"><span class="lbl">Solution</span>` +
      q.sol.map((s,i)=>`<div class="step"><span class="no">${i+1}</span><div>${s}</div></div>`).join("") +
      `</div>`;
  }
  if(level <= q.aides.length){
    const isLast = level === q.aides.length;
    html += `<button class="aid-btn ${isLast?'sol':''}" id="aid-btn">
      ${level===0 ? "Un indice" : isLast ? "Voir la solution" : "Encore un indice"}
    </button>`;
  }
  box.innerHTML = html;
  const b=$("aid-btn");
  if(b) b.onclick=()=>{
    DB.aides=(DB.aides||0)+1; R.aides++; save();
    drawAid(level+1);
  };
}

function answerQcm(i){
  const q=R.queue[R.qi];
  const btns=document.querySelectorAll(".opt");
  if(q.opts[i].ok){
    btns.forEach((b,j)=>{ b.classList.add("dead"); if(j===i) b.classList.add("good"); });
    if(!R.tried) R.first++;
    R.total++;
    openExp(true,q.opts[i].why,q.regle);
    finishQ();
  } else {
    btns[i].classList.add("bad","dead");
    R.tried=true;
    if(!R.weak.includes(R.qi)) R.weak.push(R.qi);
    openExp(false,q.opts[i].why,null);
    $("dock").classList.remove("up");
  }
}

function answerNum(){
  const q=R.queue[R.qi], inp=$("nin");
  const raw=(inp.value||"").trim().replace(",",".").replace("−","-").replace(/\s/g,"");
  if(raw==="") return;
  const val=parseFloat(raw);
  if(Math.abs(val-q.rep)<1e-9){
    inp.classList.remove("bad"); inp.classList.add("good"); inp.disabled=true;
    if(!R.tried) R.first++;
    R.total++;
    openExp(true,q.ok,q.regle);
    finishQ();
  } else {
    inp.classList.add("bad");
    setTimeout(()=>inp.classList.remove("bad"),400);
    R.tried=true;
    if(!R.weak.includes(R.qi)) R.weak.push(R.qi);
    openExp(false,q.no,null);
    inp.select();
  }
}

function openExp(win,text,regle){
  const box=$("exp"), inner=$("expin");
  inner.className="exp-in "+(win?"win":"lose");
  inner.innerHTML=`
    <div class="exp-h">
      ${win
        ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Correct`
        : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="9"/></svg> Pas tout à fait`}
    </div>
    <p>${text}</p>
    ${regle?`<div class="rule"><b>À retenir.</b> ${regle}</div>`:``}
    ${!win?`<div class="rule" style="color:var(--miss)">Réessaie.</div>`:``}`;
  box.classList.add("open");
}

function finishQ(){
  $("dock").classList.add("up");
  const last = R.qi===R.queue.length-1;
  $("go").textContent = last ? "Terminer" : "Suivant";
  $("go").onclick = ()=>{ if(last) finishCh(); else { R.qi++; drawQ(); } };
}

function finishCh(){
  const rate = R.total ? R.first/R.total : 0;
  const stars = rate===1 ? 3 : rate>=0.5 ? 2 : 1;
  const prev = DB.ch[R.ch] || {stars:0, serie:0};
  DB.ch[R.ch] = { done:true, stars:Math.max(stars,prev.stars||0), serie:(prev.serie||0)+1 };
  bumpStreak(); save();

  $("d-s").textContent = `${R.first} / ${R.total} du premier coup`;
  $("d-h").textContent = stars===3 ? "Parfait" : stars===2 ? "Bien" : "Chapitre terminé";

  const box=$("bstars");
  box.innerHTML=[1,2,3].map(i=>
    `<svg class="bstar" viewBox="0 0 24 24" fill="${i<=stars?'#1c2024':'#d9d9e0'}"><path d="M12 2l2.9 6.3 6.6.7-4.9 4.5 1.4 6.5L12 16.8 6 20l1.4-6.5L2.5 9l6.6-.7z"/></svg>`
  ).join("");
  box.querySelectorAll(".bstar").forEach((s,i)=> setTimeout(()=>s.classList.add("pop"),140+i*80));

  const tip=$("d-tip");
  const ch=CHAPITRES[R.ch-1];
  const nextSerie = ((DB.ch[R.ch].serie)%ch.series.length)+1;
  if(R.weak.length){
    tip.style.display="block";
    tip.innerHTML=`<b>À REVOIR</b>Tu as hésité sur ${R.weak.length} exercice${R.weak.length>1?"s":""}. Relis les fiches, puis refais la série.`;
  } else if(R.aides>2){
    tip.style.display="block";
    tip.innerHTML=`<b>BON RÉFLEXE</b>Tu as utilisé les indices — c'est fait pour ça. Refais la série demain sans les ouvrir.`;
  } else { tip.style.display="none"; }

  $("d-more").textContent = "Série " + nextSerie;
  show("s-done");
}

function nextSerie(){
  startCh(R.ch);
  show("s-work");
}

$("resume").onclick=()=>{
  const t = CHAPITRES.find(x=>x.pret && !(DB.ch[x.n]&&DB.ch[x.n].done)) || CHAPITRES[0];
  startCh(t.n);
};
$("back").onclick=()=>{ show("s-home"); drawHome(); };
$("d-home").onclick=()=>{ show("s-home"); drawHome(); };
$("d-more").onclick=nextSerie;

document.addEventListener("keydown",e=>{
  if(!$("s-work").classList.contains("on")){
    if(e.key==="Escape"&&$("s-done").classList.contains("on")){ show("s-home"); drawHome(); }
    return;
  }
  if(R.mode==="q"){
    const q=R.queue[R.qi];
    if(q.type==="qcm"&&/^[1-9]$/.test(e.key)){
      const b=document.querySelectorAll(".opt")[parseInt(e.key)-1];
      if(b&&!b.classList.contains("dead")) b.click();
    }
    if(e.key==="Enter"&&$("dock").classList.contains("up")) $("go").click();
  }
  if(e.key==="Escape"){ show("s-home"); drawHome(); }
});

drawHome();
</script>
