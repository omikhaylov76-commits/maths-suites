<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Les suites · 1ʳᵉ spé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* parchment — palette Slite */
  --canvas:#fdf9f4;        /* cream paper, jamais blanc froid */
  --card:#ffffff;          /* surfaces élevées */
  --dust:#f9efe4;          /* chips, surfaces secondaires */
  --ink:#2d2f34;           /* titres, texte principal */
  --charcoal:#3f434a;      /* texte secondaire */
  --slate:#5e646e;         /* légendes */
  --dusk:#6a707c;          /* micro-copie */
  --fog:#9da3af;           /* désactivé, placeholder */
  --silver:#ecedef;        /* filets, bordures */
  --mist:#d9dde6;          /* bordures de cartes */
  --ember:#f67748;         /* accent unique */
  --ember-deep:#e05f30;    /* pressé */
  --ember-soft:#fdeee7;    /* fond accent */

  --ok:#479a53;
  --ok-soft:#eff7f0;
  --ok-line:#c4e3c9;
  --miss:#c2643a;
  --miss-soft:#fbf0ea;
  --miss-line:#eecfbc;

  --r-card:32px;
  --r-mid:18px;
  --r-sm:12px;
  --r-pill:999px;

  /* moteur — easeOutCubic, comme Slite */
  --e:cubic-bezier(.215,.61,.355,1);
  --e-soft:cubic-bezier(.4,0,.2,1);
  --t-fast:130ms;
  --t-base:200ms;
  --t-move:220ms;
  --t-fade:180ms;

  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden}
body{
  background:var(--canvas);color:var(--ink);
  font:400 16px/1.5 "Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  letter-spacing:-0.012em;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;letter-spacing:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
input{font:inherit;letter-spacing:inherit;color:inherit}
.v{font-family:"Cambria Math","Georgia",serif;font-style:italic}
.v sub,.v sup{font-style:normal}
sub,sup{font-size:.7em;line-height:0}

/* экраны */
.screens{position:relative;width:100%;min-height:100dvh;overflow:hidden}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;opacity:0;pointer-events:none;
  transform:translateX(18px);
  transition:opacity var(--t-fade) var(--e-soft),transform var(--t-move) var(--e);
  will-change:opacity,transform;
}
.screen.on{opacity:1;pointer-events:auto;transform:translateX(0)}
.screen.left{transform:translateX(-18px)}
.pad{max-width:720px;margin:0 auto;padding:calc(20px + var(--safe-t)) 20px calc(120px + var(--safe-b))}

/* главная */
.hero{padding:8px 0 4px}
.hero h1{font:700 30px/1.15 "Inter",sans-serif;letter-spacing:-0.025em;margin:0 0 6px}
.hero .sub{color:var(--charcoal);font-size:15px;margin:0}
.meter{margin:26px 0 8px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.meter-lbl{font:500 12px/1 "Inter",sans-serif;color:var(--slate);letter-spacing:0.02em}
.meter-val{font:600 13px/1 "Inter",sans-serif;color:var(--charcoal);font-variant-numeric:tabular-nums}
.meter-bar{height:5px;background:var(--dust);border-radius:99px;overflow:hidden}
.meter-fill{height:100%;background:var(--ember);border-radius:99px;width:0;transition:width 620ms var(--e)}
.streak{
  display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:8px 15px;
  background:var(--dust);border-radius:var(--r-pill);
  font:500 13px/1 "Inter",sans-serif;color:var(--charcoal);
}
.streak b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.resume{
  display:block;width:100%;margin:26px 0 30px;padding:19px 22px;
  background:var(--card);color:var(--ink);
  border:1.5px solid var(--ember);border-radius:var(--r-card);
  text-align:left;
  transition:transform var(--t-fast) var(--e),box-shadow var(--t-base) var(--e);
  box-shadow:0 1px 2px rgba(45,47,52,.04),0 4px 14px rgba(246,119,72,.07);
}
.resume:active{transform:scale(.975)}
.resume .r-lbl{
  display:block;font:600 11px/1 "Inter",sans-serif;letter-spacing:0.09em;
  text-transform:uppercase;color:var(--ember);margin-bottom:8px;
}
.resume .r-name{display:block;font:600 19px/1.25 "Inter",sans-serif;letter-spacing:-0.02em}
.resume .r-meta{display:block;font:400 13px/1 "Inter",sans-serif;color:var(--slate);margin-top:7px}
.list-lbl{font:500 12px/1 "Inter",sans-serif;color:var(--slate);letter-spacing:0.08em;text-transform:uppercase;margin:0 0 12px}
.chs{display:flex;flex-direction:column;gap:8px}
.ch{
  display:flex;align-items:center;gap:14px;padding:15px 17px;
  background:var(--card);border:1px solid var(--mist);border-radius:var(--r-mid);
  text-align:left;width:100%;transition:transform var(--t-fast) var(--e),border-color .18s,background .18s;
}
.ch:active{transform:scale(.985)}
.ch.next{border-color:var(--ember);border-width:1.5px;background:var(--card)}
.ch.done{background:var(--dust);border-color:transparent}
.ch.done .ch-name{color:var(--charcoal)}
.ch.lock{opacity:.62}
.ds-tag{
  display:inline-block;margin-left:7px;padding:3px 8px;
  background:var(--ember);color:#fff;border-radius:99px;
  font:600 10px/1 "Inter",sans-serif;letter-spacing:0.04em;vertical-align:1px;
}
.ch-num{
  flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:50%;
  background:var(--dust);font:600 14px/1 "Inter",sans-serif;color:var(--charcoal);
  font-variant-numeric:tabular-nums;transition:background var(--t-base) var(--e),color var(--t-base) var(--e);
}
.ch.next .ch-num{background:var(--ember);color:#fff}
.ch.done .ch-num{background:var(--ok-soft);color:var(--ok)}
.ch-body{flex:1;min-width:0}
.ch-name{font:600 15px/1.3 "Inter",sans-serif;letter-spacing:-0.015em;display:block}
.ch-meta{font:400 12.5px/1 "Inter",sans-serif;color:var(--slate);margin-top:4px;display:block}
.stars{display:flex;gap:2.5px;flex:0 0 auto}
.star{width:13px;height:13px;opacity:.2}
.star.lit{opacity:1}
.foot-link{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:26px;padding:16px;border:1px solid var(--mist);border-radius:var(--r-pill);
  font:600 14.5px/1 "Inter",sans-serif;color:var(--ink);text-decoration:none;
  transition:transform var(--t-fast) var(--e),background var(--t-base) var(--e);min-height:52px;
}
.foot-link:active{transform:scale(.98);background:var(--dust)}

/* шапка */
.top{
  position:sticky;top:0;z-index:20;background:rgba(253,249,244,.92);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--mist);padding-top:var(--safe-t);
}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:11px 20px}
.back{
  flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;
  border-radius:50%;margin-left:-8px;transition:background var(--t-base) var(--e),transform var(--t-fast) var(--e);
}
.back:active{background:var(--dust);transform:scale(.92)}
.top-t{flex:1;min-width:0}
.top-name{font:600 14.5px/1.2 "Inter",sans-serif;letter-spacing:-0.015em;display:block}
.top-step{font:400 12px/1 "Inter",sans-serif;color:var(--slate);margin-top:3px;display:block;font-variant-numeric:tabular-nums}
.top-bar{height:2px;background:var(--dust)}
.top-fill{height:100%;background:var(--ember);width:0;transition:width 340ms var(--e)}

/* карточки */
.card{
  display:block;padding:28px 26px 26px;background:var(--card);
  border:1px solid var(--mist);border-radius:var(--r-card);
  box-shadow:0 1px 2px rgba(45,47,52,.03),0 6px 20px rgba(45,47,52,.04);animation:cardIn 250ms var(--e);
}
to{opacity:1;transform:translateX(0)}
}
.card-k{font:500 11px/1 "Inter",sans-serif;letter-spacing:0.09em;text-transform:uppercase;color:var(--slate);margin-bottom:13px}
.card h3{font:600 20px/1.3 "Inter",sans-serif;letter-spacing:-0.022em;margin:0 0 13px}
.card p{margin:0 0 13px;color:var(--charcoal);font-size:15.5px;line-height:1.6}
.card p:last-child{margin-bottom:0}
.card b{color:var(--ink);font-weight:600}
.show{
  display:block;text-align:center;padding:18px;margin:18px 0;
  background:var(--dust);border-radius:var(--r-mid);
  font-family:"Cambria Math","Georgia",serif;font-size:18px;line-height:1.8;
}
.note{
  margin-top:17px;padding:14px 16px;background:var(--dust);border-radius:var(--r-sm);
  font-size:14px;line-height:1.55;color:var(--charcoal);
}
.note b{color:var(--ink);font-weight:600}

/* «помедленнее» */
.slow-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;margin-top:16px;padding:13px;
  background:var(--dust);border-radius:var(--r-pill);
  font:600 13.5px/1 "Inter",sans-serif;color:var(--charcoal);
  transition:transform var(--t-fast) var(--e),background var(--t-base) var(--e);min-height:46px;
}
.slow-btn:active{transform:scale(.98)}
.slow-btn svg{transition:transform var(--t-move) var(--e)}
.slow-btn.open svg{transform:rotate(180deg)}
.slow{
  max-height:0;overflow:hidden;margin-top:0;
  transition:max-height 440ms var(--e),margin-top 440ms var(--e),opacity 300ms var(--e-soft);
  opacity:0;
}
.slow.open{margin-top:16px;opacity:1}
.slow-in{
  padding:19px 21px;background:var(--dust);border:1px solid var(--mist);
  border-radius:var(--r-card);font-size:15px;line-height:1.62;color:var(--charcoal);
}
.slow-in b{color:var(--ink);font-weight:600}
.slow-in p{margin:0 0 12px}
.slow-in p:last-child{margin-bottom:0}

.viewport{
  position:relative;overflow:hidden;
  transition:height 440ms var(--e);
  touch-action:pan-y;
}
.track{
  display:flex;align-items:flex-start;gap:14px;
  will-change:transform;
  user-select:none;-webkit-user-select:none;
}
.slide{flex:0 0 100%;min-width:100%}
@media(min-width:900px),(pointer:fine){
  .viewport{touch-action:auto}
  .track{user-select:text;-webkit-user-select:text;align-items:stretch}
  .slide{display:flex}
  .slide > .card{flex:1;display:flex;flex-direction:column}
}
.swipe-hint{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:14px;font:500 12px/1 "Inter",sans-serif;color:var(--fog);
  opacity:0;animation:hintIn 400ms var(--e) 600ms forwards;
}
@keyframes hintIn{to{opacity:1}}
@media(min-width:900px),(pointer:fine){.swipe-hint{display:none}}
.dots{display:flex;justify-content:center;gap:6px;margin:18px 0 6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--silver);transition:background var(--t-base) var(--e),width var(--t-base) var(--e)}
.dot.on{background:var(--ember);width:18px;border-radius:99px}
.nav2{display:flex;gap:10px;margin-top:14px}
@media(pointer:coarse) and (max-width:899px){.nav2{display:none}}
.nav2 button{
  flex:1;padding:15px;border-radius:var(--r-pill);
  font:600 15px/1 "Inter",sans-serif;
  transition:transform var(--t-fast) var(--e),background var(--t-base) var(--e);min-height:48px;
}
.nav2 .gh{background:var(--dust);color:var(--ink)}
.nav2 .pri{background:var(--ember);color:#fff;box-shadow:0 2px 8px rgba(246,119,72,.22)}
.nav2 .pri:active{background:var(--ember-deep)}
.nav2 button:active{transform:scale(.97)}
.nav2 button[disabled]{opacity:.32;pointer-events:none}

/* вопрос */
.q{animation:qIn var(--t-move) var(--e)}
@keyframes qIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.q-kind{font:500 11px/1 "Inter",sans-serif;letter-spacing:0.09em;text-transform:uppercase;color:var(--slate);margin-bottom:13px}
.q-kind .hard{color:var(--ember)}
.q-text{font:600 19px/1.4 "Inter",sans-serif;letter-spacing:-0.02em;margin:0 0 6px}
.q-sub{color:var(--charcoal);font-size:15px;margin:10px 0 0;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.opt{
  display:flex;align-items:center;gap:13px;padding:16px 17px;
  background:var(--canvas);border:1px solid var(--mist);border-radius:var(--r-card);
  text-align:left;width:100%;font-size:15.5px;line-height:1.4;
  transition:transform var(--t-fast) var(--e),border-color var(--t-base) var(--e),background var(--t-base) var(--e);min-height:56px;
}
.opt:active:not(.dead){transform:scale(.98)}
.opt .mark{
  flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:50%;
  background:var(--dust);font:600 12.5px/1 "Inter",sans-serif;color:var(--charcoal);
  transition:background var(--t-base) var(--e),color var(--t-base) var(--e);
}
.opt .txt{flex:1}
.opt.good{background:var(--ok-soft);border-color:var(--ok-line)}
.opt.good .mark{background:var(--ok);color:#fff}
.opt.bad{background:var(--miss-soft);border-color:var(--miss-line);animation:nope 200ms var(--e)}
.opt.bad .mark{background:var(--miss);color:#fff}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.opt.dead{opacity:.45;pointer-events:none}
.opt.dead.good{opacity:1}
.num-wrap{margin-top:20px}

/* ── pavé numérique ── */
.num-in{caret-color:var(--ember)}
.num-in.pad{cursor:pointer}
.num-in:empty::before{content:"—";color:var(--fog)}

.pad-sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--canvas);
  border-top:1px solid var(--mist);
  border-radius:22px 22px 0 0;
  padding:10px 10px calc(10px + var(--safe-b));
  box-shadow:0 -2px 24px rgba(45,47,52,.10);
  transform:translateY(102%);
  transition:transform 280ms var(--e);
  will-change:transform;
}
.pad-sheet.up{transform:translateY(0)}
.pad-grab{
  width:38px;height:4px;border-radius:99px;
  background:var(--mist);margin:2px auto 12px;
}
.pad-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;max-width:520px;margin:0 auto;
}
.key{
  height:54px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--mist);
  border-radius:14px;
  font:600 22px/1 "Inter",sans-serif;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
  transition:transform 90ms var(--e),background 120ms var(--e);
  -webkit-user-select:none;user-select:none;
}
.key:active{transform:scale(.94);background:var(--dust)}
.key.fn{background:var(--dust);font-size:19px;color:var(--charcoal)}
.key.fn:active{background:var(--silver)}
.key.ok{
  grid-column:span 2;background:var(--ember);color:#fff;
  font-size:16px;letter-spacing:.01em;
  box-shadow:0 2px 8px rgba(246,119,72,.24);
}
.key.ok:active{background:var(--ember-deep);transform:scale(.97)}
.key.wide{grid-column:span 2}
@media(min-width:900px),(pointer:fine){ .pad-sheet{display:none} }

.num-in{
  width:100%;padding:17px 19px;background:var(--card);
  border:1.5px solid var(--mist);border-radius:var(--r-mid);
  font:600 20px/1 "Inter",sans-serif;font-variant-numeric:tabular-nums;
  text-align:center;transition:border-color var(--t-base) var(--e),background var(--t-base) var(--e);min-height:58px;
}
.num-in:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 3px var(--ember-soft)}
.num-in.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.num-in.bad{background:var(--miss-soft);border-color:var(--miss);color:var(--miss);animation:nope 200ms var(--e)}
.num-hint{text-align:center;font-size:12.5px;color:var(--slate);margin-top:9px}

/* подсказки */
.aid{margin-top:16px}
.aid-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;
  border:1px solid var(--mist);border-radius:var(--r-pill);
  font:600 13.5px/1 "Inter",sans-serif;color:var(--charcoal);
  transition:transform var(--t-fast) var(--e),background var(--t-base) var(--e),border-color var(--t-base) var(--e);min-height:46px;
}
.aid-btn:active{transform:scale(.98);background:var(--dust)}
.aid-btn.sol{border-color:var(--slate);color:var(--ink)}
.aid-box{
  margin-top:10px;padding:17px 19px;background:var(--dust);
  border:1px solid var(--mist);border-radius:var(--r-card);
  font-size:14.8px;line-height:1.62;color:var(--charcoal);
  animation:qIn var(--t-base) var(--e);
}
.aid-box b{color:var(--ink);font-weight:600}
.aid-box .lbl{
  font:600 11px/1 "Inter",sans-serif;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--slate);display:block;margin-bottom:9px;
}
.aid-box p{margin:0 0 10px}
.aid-box p:last-child{margin-bottom:0}
.aid-box.sol{background:var(--dust);border-color:var(--mist)}
.aid-box .step{
  display:flex;gap:11px;margin-bottom:11px;
}
.aid-box .step:last-child{margin-bottom:0}
.aid-box .step .no{
  flex:0 0 21px;height:21px;display:grid;place-items:center;border-radius:50%;
  background:var(--ember);color:#fff;
  font:600 11px/1 "Inter",sans-serif;margin-top:1px;
}

/* объяснение */
.exp{max-height:0;overflow:hidden;transition:max-height 280ms var(--e),margin 280ms var(--e);margin-top:0}
.exp.open{max-height:700px;margin-top:18px}
.exp-in{padding:18px 19px;border-radius:var(--r-card);font-size:14.8px;line-height:1.62}
.exp-in.win{background:var(--ok-soft);border:1px solid var(--ok-line)}
.exp-in.lose{background:var(--miss-soft);border:1px solid var(--miss-line)}
.exp-h{font:600 13px/1 "Inter",sans-serif;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.exp-in.win .exp-h{color:var(--ok)}
.exp-in.lose .exp-h{color:var(--miss)}
.exp p{margin:0 0 10px;color:var(--ink)}
.exp p:last-child{margin-bottom:0}
.exp .rule{margin-top:13px;padding-top:13px;border-top:1px solid rgba(0,0,0,.09);font-size:14px;color:var(--charcoal)}
.exp .rule b{color:var(--ink);font-weight:600}

/* нижняя кнопка */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:14px 20px calc(14px + var(--safe-b));
  background:linear-gradient(to top,var(--canvas) 66%,rgba(253,249,244,0));
  pointer-events:none;opacity:0;transform:translateY(10px);
  transition:opacity var(--t-fade) var(--e-soft),transform var(--t-move) var(--e);
}
.dock.up{opacity:1;transform:translateY(0);pointer-events:auto}
.dock-in{max-width:720px;margin:0 auto}
.go{
  width:100%;padding:18px;background:var(--ember);color:#fff;
  border-radius:var(--r-pill);font:600 16px/1 "Inter",sans-serif;
  transition:transform var(--t-fast) var(--e),background var(--t-fast) var(--e);
  min-height:56px;box-shadow:0 2px 8px rgba(246,119,72,.24);
}
.go:active{transform:scale(.975);background:var(--ember-deep)}

/* итог */
.done-wrap{text-align:center;padding:44px 0 0}
.big-stars{display:flex;justify-content:center;gap:11px;margin-bottom:26px}
.bstar{width:38px;height:38px;opacity:0;transform:scale(.88)}
.bstar.pop{animation:pop 300ms var(--e) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.done-h{font:700 25px/1.2 "Inter",sans-serif;letter-spacing:-0.025em;margin:0 0 9px}
.done-s{color:var(--charcoal);font-size:15.5px;margin:0 0 30px}
.tip{
  text-align:left;padding:17px 19px;background:var(--dust);border-radius:var(--r-card);
  margin-bottom:26px;font-size:14.5px;line-height:1.6;color:var(--charcoal);
}
.tip b{color:var(--ink);font-weight:600;display:block;margin-bottom:6px;font-size:13px}
.done-btns{display:flex;flex-direction:column;gap:10px}
.done-btns button{
  padding:17px;border-radius:var(--r-pill);font:600 15.5px/1 "Inter",sans-serif;
  transition:transform var(--t-fast) var(--e);min-height:54px;
}
.done-btns .pri{background:var(--ember);color:#fff;box-shadow:0 2px 8px rgba(246,119,72,.22)}
.done-btns .gh{background:var(--dust);color:var(--ink)}
.done-btns button:active{transform:scale(.975)}

/* десктоп */

/* ── modules ── */
.mods{display:flex;flex-direction:column;gap:12px}
.mod{
  display:block;width:100%;text-align:left;
  padding:20px 22px;background:var(--card);
  border:1px solid var(--mist);border-radius:var(--r-card);
  transition:transform var(--t-fast) var(--e),border-color var(--t-base) var(--e),box-shadow var(--t-base) var(--e);
}
.mod:active{transform:scale(.985)}
.mod.open{border-color:var(--ember);border-width:1.5px;
  box-shadow:0 1px 2px rgba(45,47,52,.04),0 6px 18px rgba(246,119,72,.08)}
.mod.lock{opacity:.6}
.mod-top{display:flex;align-items:flex-start;gap:14px}
.mod-ic{
  flex:0 0 40px;height:40px;display:grid;place-items:center;
  border-radius:12px;background:var(--dust);
}
.mod.open .mod-ic{background:var(--ember-soft)}
.mod-b{flex:1;min-width:0}
.mod-n{font:600 17px/1.25 "Inter",sans-serif;letter-spacing:-.02em;display:block}
.mod-s{font:400 13px/1 "Inter",sans-serif;color:var(--slate);margin-top:5px;display:block}
.mod-go{flex:0 0 auto;color:var(--fog);margin-top:9px}
.mod.open .mod-go{color:var(--ember)}
.mod-bar{height:4px;background:var(--dust);border-radius:99px;overflow:hidden;margin-top:15px}
.mod-fill{height:100%;background:var(--ember);border-radius:99px;width:0;transition:width 620ms var(--e)}
.mod-cnt{
  display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;
  font:500 12px/1 "Inter",sans-serif;color:var(--slate);
}
.mod-cnt b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.mod-soon{
  display:inline-block;margin-top:13px;padding:5px 11px;
  background:var(--dust);border-radius:99px;
  font:600 11px/1 "Inter",sans-serif;color:var(--slate);letter-spacing:.04em;
}
@media(min-width:900px){
  .mods{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mod:hover{border-color:var(--mist);box-shadow:0 2px 12px rgba(45,47,52,.06)}
  .mod.open:hover{border-color:var(--ember)}
}

@media (min-width:900px){
  .screens{min-height:100vh}
  .pad{max-width:1080px;padding:38px 40px 60px}
  .home-grid{display:grid;grid-template-columns:1fr 380px;gap:52px;align-items:start}
  .home-right{position:sticky;top:38px}
  .hero h1{font-size:38px}
  .resume{margin-top:0}
  .ch:hover{border-color:var(--mist);background:var(--card);box-shadow:0 2px 10px rgba(45,47,52,.05)}
  .ch.next:hover{border-color:var(--ink)}
  .work{max-width:720px;margin:0 auto}
  .card{padding:34px 32px}
  .card h3{font-size:22px}
  .opt:hover:not(.dead){border-color:var(--ember);background:var(--ember-soft)}
  .back:hover{background:var(--dust)}
  .aid-btn:hover{background:var(--dust);border-color:var(--slate)}
  .slow-btn:hover{background:var(--silver)}
  .dock{position:static;display:none;opacity:1;transform:none;pointer-events:auto;
        background:none;padding:22px 0 0;max-width:720px;margin:0 auto}
  .dock.up{display:block}
  .keys{display:flex;justify-content:center;gap:16px;margin-top:18px;font-size:12px;color:var(--slate)}
  .keys kbd{
    display:inline-block;padding:2px 7px;margin-right:5px;background:var(--dust);
    border:1px solid var(--mist);border-radius:5px;font:500 11px/1.5 "Inter",sans-serif;
  }
}
@media (max-width:899px){.keys{display:none}.home-grid{display:block}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<script>
/* ═══════════ ДАННЫЕ ═══════════ */

/* ═══════════════════════════════════════════════════
   LES SUITES — contenu
   Première spé · programme 2026
   Chapitres 2 à 5 = sujets du DS
   ═══════════════════════════════════════════════════ */

const CH_SOMMES = {
  n:6, nom:"Sommes de termes", sous:"Gauss, arithmétique, géométrique", pret:true, ds:false,
  cartes:[
    {
      k:"LA SOMME DE GAUSS", t:"Additionner 1 + 2 + … + n",
      c:`<p>Comment additionner tous les entiers de 1 à 100 sans calculatrice ? Il existe une formule :</p>
        <div class="show">1 + 2 + 3 + … + <span class="v">n</span> = <span style="display:inline-block;text-align:center;vertical-align:middle"><span style="display:block;border-bottom:1.4px solid;padding:0 6px"><span class="v">n</span>(<span class="v">n</span> + 1)</span><span style="display:block;padding:0 6px">2</span></span></div>
        <p>Pour <span class="v">n</span> = 100 : 100 × 101 ÷ 2 = <b>5 050</b>.</p>
        <div class="note"><b>Attention.</b> Cette formule commence à <b>1</b>, pas à 0. Ajouter 0 ne change rien au résultat.</div>`,
      lent:`<p><b>L'astuce de Gauss, enfant.</b></p>
        <p>On raconte que son maître, pour avoir la paix, demanda à la classe d'additionner tous les nombres de 1 à 100. Gauss donna la réponse en quelques secondes.</p>
        <p>Son idée : écrire la somme deux fois, une fois à l'endroit, une fois à l'envers.</p>
        <div class="show" style="font-size:15px;text-align:left;padding:18px 20px">
          1 &nbsp;+&nbsp; 2 &nbsp;+&nbsp; 3 &nbsp;+ … +&nbsp; 100<br>
          100 &nbsp;+&nbsp; 99 &nbsp;+&nbsp; 98 &nbsp;+ … +&nbsp; 1
        </div>
        <p>Colonne par colonne, chaque paire donne <b>101</b> : 1+100, 2+99, 3+98…</p>
        <p>Il y a 100 colonnes, donc le double de la somme vaut 100 × 101 = 10 100. La somme elle-même : la moitié, soit <b>5 050</b>.</p>
        <p>C'est exactement ce que dit la formule : on multiplie, puis on divise par 2 parce qu'on a compté deux fois.</p>`
    },
    {
      k:"SUITE ARITHMÉTIQUE", t:"Premier plus dernier, divisé par deux",
      c:`<p>Pour une suite arithmétique, la somme se calcule avec une formule très simple :</p>
        <div class="show" style="font-size:16px"><span class="v">S</span> = (nombre de termes) × <span style="display:inline-block;text-align:center;vertical-align:middle"><span style="display:block;border-bottom:1.4px solid;padding:0 6px">premier + dernier</span><span style="display:block;padding:0 6px">2</span></span></div>
        <p>Pour <span class="v">u<sub>0</sub> + u<sub>1</sub> + … + u<sub>n</sub></span> :</p>
        <div class="show"><span class="v">S</span> = (<span class="v">n</span> + 1) × <span style="display:inline-block;text-align:center;vertical-align:middle"><span style="display:block;border-bottom:1.4px solid;padding:0 6px"><span class="v">u<sub>0</sub></span> + <span class="v">u<sub>n</sub></span></span><span style="display:block;padding:0 6px">2</span></span></div>
        <div class="note"><b>Le piège.</b> De <span class="v">u<sub>0</sub></span> à <span class="v">u<sub>n</sub></span> il y a <span class="v">(n+1)</span> termes, pas <span class="v">n</span>.</div>`,
      lent:`<p><b>Pourquoi « premier plus dernier divisé par deux » ?</b></p>
        <p>Parce que c'est la <b>moyenne</b> de la suite.</p>
        <p>Prends 2, 5, 8, 11, 14. Le premier vaut 2, le dernier 14. Leur moyenne : (2+14)÷2 = 8.</p>
        <p>Regarde le terme du milieu : c'est justement 8. Ce n'est pas un hasard — dans une suite arithmétique, les termes sont répartis régulièrement, donc la moyenne tombe pile au centre.</p>
        <p><b>Et ensuite ?</b> Si chaque terme « vaut en moyenne » 8 et qu'il y en a 5, la somme fait 5 × 8 = <b>40</b>.</p>
        <p>Vérifions : 2 + 5 + 8 + 11 + 14 = 40. ✓</p>
        <p>La formule dit exactement cela : <b>combien de termes</b> × <b>leur valeur moyenne</b>.</p>`
    },
    {
      k:"SUITE GÉOMÉTRIQUE", t:"Une formule avec une puissance",
      c:`<p>Pour une suite géométrique de raison <span class="v">q</span> ≠ 1 :</p>
        <div class="show">1 + <span class="v">q</span> + <span class="v">q</span>² + … + <span class="v">q</span><sup><span class="v">n</span></sup> = <span style="display:inline-block;text-align:center;vertical-align:middle"><span style="display:block;border-bottom:1.4px solid;padding:0 6px">1 − <span class="v">q</span><sup><span class="v">n+1</span></sup></span><span style="display:block;padding:0 6px">1 − <span class="v">q</span></span></span></div>
        <p>Pour une suite quelconque, on multiplie par le premier terme :</p>
        <div class="show"><span class="v">S</span> = <span class="v">u<sub>0</sub></span> × <span style="display:inline-block;text-align:center;vertical-align:middle"><span style="display:block;border-bottom:1.4px solid;padding:0 6px">1 − <span class="v">q</span><sup><span class="v">n+1</span></sup></span><span style="display:block;padding:0 6px">1 − <span class="v">q</span></span></span></div>
        <div class="note"><b>L'exposant.</b> C'est le <b>nombre de termes</b>, pas le dernier rang. De <span class="v">u<sub>0</sub></span> à <span class="v">u<sub>n</sub></span> : <span class="v">n+1</span> termes, donc <span class="v">q</span><sup><span class="v">n+1</span></sup>.</div>`,
      lent:`<p><b>Une formule à retenir par sa structure, pas par cœur.</b></p>
        <p>Lis-la comme une phrase :</p>
        <div class="show" style="font-size:15px">premier terme × <span style="display:inline-block;text-align:center;vertical-align:middle"><span style="display:block;border-bottom:1.4px solid;padding:0 6px">1 − raison<sup>nombre de termes</sup></span><span style="display:block;padding:0 6px">1 − raison</span></span></div>
        <p>Trois choses à repérer dans l'énoncé : le <b>premier terme</b>, la <b>raison</b>, le <b>nombre de termes</b>. Le reste se remplit tout seul.</p>
        <p><b>Exemple.</b> 3 + 6 + 12 + 24 + 48</p>
        <p>Premier terme : 3. Raison : 2. Nombre de termes : 5.</p>
        <div class="show" style="font-size:15px">3 × <span style="display:inline-block;text-align:center;vertical-align:middle"><span style="display:block;border-bottom:1.4px solid;padding:0 6px">1 − 2<sup>5</sup></span><span style="display:block;padding:0 6px">1 − 2</span></span> = 3 × <span style="display:inline-block;text-align:center;vertical-align:middle"><span style="display:block;border-bottom:1.4px solid;padding:0 6px">−31</span><span style="display:block;padding:0 6px">−1</span></span> = 93</div>
        <p>Vérification : 3+6+12+24+48 = 93. ✓</p>
        <p><b>Le moins au-dessus et en dessous</b> s'annulent — ne t'en inquiète pas, c'est normal quand <span class="v">q</span> > 1.</p>`
    },
    {
      k:"PIÈGE PRINCIPAL", t:"Compter les termes",
      c:`<p>L'erreur numéro un du chapitre. Les formules demandent le <b>nombre de termes</b>, pas le dernier rang.</p>
        <div class="show" style="text-align:left;padding:19px 21px;font-size:15.5px">
          <div style="margin-bottom:10px">de <span class="v">u<sub>0</sub></span> à <span class="v">u<sub>10</sub></span> &nbsp;→&nbsp; <b>11</b> termes</div>
          <div style="margin-bottom:10px">de <span class="v">u<sub>1</sub></span> à <span class="v">u<sub>10</sub></span> &nbsp;→&nbsp; <b>10</b> termes</div>
          <div>de <span class="v">u<sub>p</sub></span> à <span class="v">u<sub>n</sub></span> &nbsp;→&nbsp; <span class="v">(n − p + 1)</span> termes</div>
        </div>
        <div class="note"><b>Réflexe de contrôle.</b> Avant d'appliquer une formule de somme, écris d'abord combien de termes tu additionnes. Une ligne qui évite la moitié des erreurs.</div>`,
      lent:`<p><b>Reprends l'image des poteaux.</b></p>
        <p>Une clôture de 10 mètres avec un poteau chaque mètre : il faut <b>11</b> poteaux, pas 10. Celui du départ compte aussi.</p>
        <p><b>Pourquoi c'est si grave ici ?</b></p>
        <p>Parce que dans une somme, chaque terme oublié change le résultat. Ce n'est pas une petite imprécision : la réponse est fausse.</p>
        <p><b>La méthode sûre.</b> Avant tout calcul, écris une ligne :</p>
        <div class="show" style="font-size:15px">« De <span class="v">u<sub>3</sub></span> à <span class="v">u<sub>12</sub></span> : 12 − 3 + 1 = 10 termes »</div>
        <p>Ensuite seulement, applique la formule. Ces cinq secondes sauvent des points en devoir.</p>`
    }
  ],
  series:[
    [
      { k:"AUTOMATISME", type:"num", q:`Calculer 1 + 2 + 3 + … + 10.`,
        rep:55, ind:"un entier", ok:`10 × 11 ÷ 2 = <b>55</b>`, no:`Applique <span class="v">n</span>(<span class="v">n</span>+1)÷2 avec <span class="v">n</span> = 10.`,
        regle:`Somme de Gauss : <span class="v">n</span>(<span class="v">n</span>+1)÷2`,
        aides:[`La formule est <span class="v">n</span>(<span class="v">n</span>+1)÷2.`,`10 × 11 = 110, puis divise par 2.`],
        sol:[`Formule : <span class="v">n</span>(<span class="v">n</span>+1)÷2 avec <span class="v">n</span> = 10`,`10 × 11 = 110`,`110 ÷ 2 = <b>55</b>`] },
      { k:"AUTOMATISME", type:"num", q:`Combien de termes additionne-t-on dans <span class="v">u<sub>0</sub> + u<sub>1</sub> + … + u<sub>7</sub></span> ?`,
        rep:8, ind:"un entier", ok:`7 − 0 + 1 = <b>8</b> termes`, no:`Les deux bornes sont incluses.`,
        regle:`Toujours compter avant d'appliquer une formule.`,
        aides:[`N'oublie pas <span class="v">u<sub>0</sub></span>.`,`7 − 0 + 1.`],
        sol:[`Premier rang : 0, dernier rang : 7`,`7 − 0 + 1`,`<b>8</b> termes`] },
      { k:"AUTOMATISME", type:"num", q:`Suite arithmétique : <span class="v">u<sub>0</sub></span> = 3, <span class="v">u<sub>4</sub></span> = 15.<br>Calculer <span class="v">u<sub>0</sub> + u<sub>1</sub> + … + u<sub>4</sub></span>.`,
        rep:45, ind:"un entier", ok:`5 × (3+15)÷2 = 5 × 9 = <b>45</b>`, no:`Nombre de termes × moyenne du premier et du dernier.`,
        regle:`<span class="v">S</span> = (nb de termes) × (premier + dernier) ÷ 2`,
        aides:[`Combien de termes de <span class="v">u<sub>0</sub></span> à <span class="v">u<sub>4</sub></span> ?`,`5 termes. Moyenne : (3+15)÷2 = 9.`],
        sol:[`Nombre de termes : 4 − 0 + 1 = 5`,`Moyenne : (3 + 15) ÷ 2 = 9`,`5 × 9 = <b>45</b>`] },

   2 · SENS DE VARIATION          ← DS

{
  n:2, nom:"Sens de variation", sous:"Croissante, décroissante", pret:true, ds:true,
  cartes:[
    {
      k:"L'IDÉE", t:"La suite monte-t-elle ou descend-elle ?",
      c:`<p>On compare chaque terme au <b>suivant</b>. Deux cas simples :</p>
        <div class="show" style="text-align:left;padding:19px 21px">
          <div style="margin-bottom:13px"><b>Croissante</b> : <span class="v">u<sub>n+1</sub></span> ⩾ <span class="v">u<sub>n</sub></span> pour tout <span class="v">n</span></div>
          <div><b>Décroissante</b> : <span class="v">u<sub>n+1</sub></span> ⩽ <span class="v">u<sub>n</sub></span> pour tout <span class="v">n</span></div>
        </div>
        <p>Une suite <b>monotone</b> est une suite croissante ou décroissante.</p>
        <div class="note"><b>Attention au « pour tout ».</b> Il ne suffit pas que ça monte au début. Il faut que ça monte <b>toujours</b>.</div>`,
      lent:`<p><b>Pense à un escalier.</b></p>
        <p>Tu montes une marche, puis une autre, puis une autre. Chaque marche est plus haute que la précédente → l'escalier <b>monte</b>. C'est une suite croissante.</p>
        <p>Si chaque marche est plus basse → l'escalier <b>descend</b>. Suite décroissante.</p>
        <p><b>Et s'il monte puis descend ?</b> Alors ce n'est ni l'un ni l'autre. En maths on dit qu'elle <b>n'est pas monotone</b>.</p>
        <p>C'est pour ça que l'énoncé écrit toujours « pour tout <span class="v">n</span> » : une seule marche dans le mauvais sens et c'est fini.</p>`
    },
    {
      k:"MÉTHODE 1", t:"Le signe de la différence",
      c:`<p>La méthode la plus sûre. On calcule <span class="v">u<sub>n+1</sub> − u<sub>n</sub></span> et on regarde son signe.</p>
        <div class="show" style="text-align:left;padding:19px 21px">
          <div style="margin-bottom:9px"><span class="v">u<sub>n+1</sub> − u<sub>n</sub></span> &gt; 0 &nbsp;→&nbsp; croissante</div>
          <div style="margin-bottom:9px"><span class="v">u<sub>n+1</sub> − u<sub>n</sub></span> &lt; 0 &nbsp;→&nbsp; décroissante</div>
          <div><span class="v">u<sub>n+1</sub> − u<sub>n</sub></span> = 0 &nbsp;→&nbsp; constante</div>
        </div>
        <p>Exemple avec <span class="v">u<sub>n</sub></span> = <span class="v">n</span>² + 2<span class="v">n</span> :</p>
        <div class="show"><span class="v">u<sub>n+1</sub> − u<sub>n</sub></span> = 2<span class="v">n</span> + 3 &gt; 0</div>
        <p>Donc la suite est croissante.</p>`,
      lent:`<p><b>« Combien j'ai gagné depuis hier ? »</b></p>
        <p>Imagine ton argent de poche. Hier tu avais <span class="v">u<sub>n</sub></span>, aujourd'hui <span class="v">u<sub>n+1</sub></span>.</p>
        <p>La différence <span class="v">u<sub>n+1</sub> − u<sub>n</sub></span>, c'est ce qui a changé :</p>
        <p>— Résultat <b>positif</b> → tu as plus qu'hier → ça monte.<br>
           — Résultat <b>négatif</b> → tu as moins → ça descend.</p>
        <p><b>Pourquoi cette méthode est la meilleure ?</b> Parce qu'elle marche toujours, quelle que soit la suite. Les autres méthodes ont des conditions.</p>
        <p>La seule difficulté est le calcul : il faut remplacer <span class="v">n</span> par <span class="v">(n+1)</span> <b>entre parenthèses</b>, développer, puis simplifier.</p>`
    },
    {
      k:"MÉTHODE 2", t:"Le quotient — seulement si tout est positif",
      c:`<p>Si <b>tous les termes sont strictement positifs</b>, on peut comparer <span class="v">u<sub>n+1</sub></span> / <span class="v">u<sub>n</sub></span> à 1.</p>
        <div class="show" style="text-align:left;padding:19px 21px">
          <div style="margin-bottom:9px">quotient &gt; 1 &nbsp;→&nbsp; croissante</div>
          <div>quotient &lt; 1 &nbsp;→&nbsp; décroissante</div>
        </div>
        <div class="note"><b>Condition obligatoire.</b> Il faut écrire dans la copie que tous les termes sont strictement positifs. Sans cette phrase, la méthode est fausse — diviser par un négatif inverse l'inégalité.</div>`,
      lent:`<p><b>Le quotient, c'est « combien de fois plus ».</b></p>
        <p>Si tu avais 10 € et que tu as maintenant 15 €, le quotient vaut 1,5 : tu as 1,5 fois plus. Le quotient dépasse 1 → ça a augmenté.</p>
        <p>Si tu avais 10 € et que tu as 8 €, le quotient vaut 0,8 : moins que 1 → ça a diminué.</p>
        <p><b>Pourquoi la condition sur le signe ?</b></p>
        <p>Parce qu'avec des nombres négatifs le raisonnement se casse. Prends −2 et −4 : le quotient vaut 2, plus grand que 1 — pourtant −4 est plus <b>petit</b> que −2. La suite descend alors que le quotient dit « ça monte ».</p>
        <p>D'où la règle : cette méthode est réservée aux suites à termes positifs. Et il faut le <b>dire</b> dans la copie.</p>`
    },
    {
      k:"PIÈGE", t:"Ni croissante, ni décroissante",
      c:`<p>Certaines suites changent de sens à chaque terme. Exemple : <span class="v">u<sub>n</sub></span> = (−1)<sup><span class="v">n</span></sup></p>
        <div class="show">1,&nbsp; −1,&nbsp; 1,&nbsp; −1,&nbsp; 1,&nbsp; …</div>
        <p>Elle monte, puis descend, puis remonte. Elle <b>n'est pas monotone</b>.</p>
        <div class="note"><b>Formulation attendue.</b> « La suite n'est ni croissante ni décroissante. » On dit aussi qu'elle est <b>alternée</b>.</div>`,
      lent:`<p><b>Une erreur classique en devoir.</b></p>
        <p>On calcule deux ou trois termes, on voit que ça monte, et on écrit « la suite est croissante ». C'est faux — ou du moins, ce n'est pas démontré.</p>
        <p>Regarde : 1, 3, 7, 2, 9, 1… Les trois premiers montent. Est-ce que la suite est croissante ? Non, le quatrième casse tout.</p>
        <p><b>Ce qu'il faut faire.</b> Calculer <span class="v">u<sub>n+1</sub> − u<sub>n</sub></span> <b>en général</b>, avec la lettre <span class="v">n</span>, et montrer que le signe ne dépend pas de <span class="v">n</span>.</p>
        <p>Quelques termes ne prouvent rien. Ils servent seulement à <b>deviner</b> la réponse avant de la démontrer.</p>`
    }
  ],
  series:[

/* ─────────────────────────────────────────────
   3 · SUITES ARITHMÉTIQUES       ← DS

{
  n:3, nom:"Suites arithmétiques", sous:"Raison, terme général", pret:true, ds:true,
  cartes:[
    {
      k:"DÉFINITION", t:"On ajoute toujours le même nombre",
      c:`<p>Une suite est <b>arithmétique</b> s'il existe un réel <span class="v">r</span> tel que, pour tout <span class="v">n</span> :</p>
        <div class="show"><span class="v">u<sub>n+1</sub></span> = <span class="v">u<sub>n</sub></span> + <span class="v">r</span></div>
        <p>Ce nombre <span class="v">r</span> s'appelle la <b>raison</b> de la suite.</p>
        <div class="show">7,&nbsp; 11,&nbsp; 15,&nbsp; 19,&nbsp; 23,&nbsp; … &nbsp;&nbsp;(<span class="v">r</span> = 4)</div>
        <div class="note"><b>Attention au mot.</b> « Raison » ne veut pas dire « cause ». C'est le nombre qu'on ajoute à chaque étape.</div>`,
      lent:`<p><b>La tirelire.</b></p>
        <p>Tu mets 5 € dans ta tirelire chaque semaine. Toujours 5, jamais plus, jamais moins.</p>
        <p>Semaine 0 : 20 € · semaine 1 : 25 € · semaine 2 : 30 € · semaine 3 : 35 €…</p>
        <p>C'est une suite arithmétique de <b>raison 5</b>. Le mot « raison » désigne juste ce qu'on ajoute.</p>
        <p><b>Autre image : l'escalier régulier.</b> Toutes les marches ont la même hauteur. Cette hauteur, c'est la raison.</p>
        <p>Et si tu <b>retires</b> 5 € par semaine ? Alors la raison vaut −5. Une raison peut être négative — la suite descend.</p>`
    },
    {
      k:"RECONNAÎTRE", t:"La différence doit être constante",
      c:`<p>Pour vérifier qu'une suite est arithmétique, on calcule <span class="v">u<sub>n+1</sub> − u<sub>n</sub></span>.</p>
        <p>Si le résultat <b>ne dépend pas de <span class="v">n</span></b>, la suite est arithmétique, et ce résultat est la raison.</p>
        <div class="show"><span class="v">u<sub>n</sub></span> = 3<span class="v">n</span> + 2 &nbsp;→&nbsp; <span class="v">u<sub>n+1</sub> − u<sub>n</sub></span> = 3</div>
        <div class="note"><b>Erreur de devoir.</b> Vérifier sur deux ou trois termes ne suffit pas. Il faut le calcul général, avec la lettre <span class="v">n</span>.</div>`,
      lent:`<p><b>Comment savoir si l'escalier est régulier ?</b></p>
        <p>Tu mesures une marche : 18 cm. Une autre : 18 cm. Une troisième : 18 cm. Bon signe — mais tu n'as mesuré que trois marches sur cent.</p>
        <p>En maths, on ne peut pas toutes les mesurer : il y en a une infinité. D'où le calcul <b>avec la lettre</b> <span class="v">n</span> : il mesure toutes les marches d'un coup.</p>
        <p><b>Comment lire le résultat ?</b></p>
        <p>Si tu trouves 3 → aucun <span class="v">n</span> dedans → toutes les marches font 3 → arithmétique de raison 3.</p>
        <p>Si tu trouves 2<span class="v">n</span> + 1 → le résultat change selon la marche → les marches ne sont pas égales → <b>pas</b> arithmétique.</p>`
    },
    {
      k:"FORMULE", t:"Le terme général",
      c:`<p>Pour aller de <span class="v">u<sub>0</sub></span> à <span class="v">u<sub>n</sub></span>, on ajoute <span class="v">r</span> exactement <span class="v">n</span> fois :</p>
        <div class="show"><span class="v">u<sub>n</sub></span> = <span class="v">u<sub>0</sub></span> + <span class="v">n</span> × <span class="v">r</span></div>
        <p>Forme générale, d'un rang quelconque à un autre :</p>
        <div class="show"><span class="v">u<sub>n</sub></span> = <span class="v">u<sub>p</sub></span> + (<span class="v">n</span> − <span class="v">p</span>) × <span class="v">r</span></div>
        <div class="note"><b>Si la suite commence à <span class="v">u<sub>1</sub></span></b> : <span class="v">u<sub>n</sub></span> = <span class="v">u<sub>1</sub></span> + (<span class="v">n</span> − 1)<span class="v">r</span>. Inutile d'apprendre deux formules — la forme générale les contient.</div>`,
      lent:`<p><b>Retour à la tirelire.</b></p>
        <p>Tu commences avec 20 € et tu ajoutes 5 € par semaine. Combien après 8 semaines ?</p>
        <p>Tu pourrais compter semaine après semaine : 25, 30, 35… Long.</p>
        <p>Ou réfléchir : <b>8 semaines × 5 € = 40 €</b> ajoutés au total. Donc 20 + 40 = <b>60 €</b>.</p>
        <div class="show"><span class="v">u<sub>8</sub></span> = 20 + 8×5 = 60</div>
        <p>C'est exactement la formule <span class="v">u<sub>n</sub></span> = <span class="v">u<sub>0</sub></span> + <span class="v">nr</span>.</p>
        <p><b>Et la forme avec <span class="v">p</span> ?</b> Si tu pars de la semaine 3 pour aller à la semaine 8, il s'écoule 8 − 3 = 5 semaines. D'où le <span class="v">(n − p)</span> : c'est le <b>nombre de pas</b> entre les deux rangs.</p>`
    },
    {
      k:"VARIATION", t:"Le signe de la raison décide",
      c:`<p>Ici c'est simple : <span class="v">u<sub>n+1</sub> − u<sub>n</sub></span> = <span class="v">r</span>. Le sens de variation est donné par le signe de <span class="v">r</span>.</p>
        <div class="show" style="text-align:left;padding:19px 21px">
          <div style="margin-bottom:9px"><span class="v">r</span> &gt; 0 &nbsp;→&nbsp; croissante</div>
          <div style="margin-bottom:9px"><span class="v">r</span> &lt; 0 &nbsp;→&nbsp; décroissante</div>
          <div><span class="v">r</span> = 0 &nbsp;→&nbsp; constante</div>
        </div>
        <div class="note">Une suite arithmétique est <b>toujours monotone</b>. Elle ne peut pas alterner.</div>`,
      lent:`<p><b>Pourquoi c'est si simple ici ?</b></p>
        <p>Parce que la différence entre deux termes consécutifs est <b>toujours la même</b> : c'est la raison.</p>
        <p>Tu ajoutes 5 chaque fois → ça monte à chaque fois → croissante, sans discussion.</p>
        <p>Tu retires 5 chaque fois → ça descend à chaque fois → décroissante.</p>
        <p><b>C'est pour ça qu'une suite arithmétique ne peut jamais « zigzaguer ».</b> Le pas est constant, donc la direction ne change jamais.</p>
        <p>Retiens l'image de l'escalier : toutes les marches identiques. Soit il monte, soit il descend, soit il est plat. Pas d'autre option.</p>`
    }

/* ─────────────────────────────────────────────
   4 · SUITES GÉOMÉTRIQUES        ← DS

{
  n:4, nom:"Suites géométriques", sous:"Raison, pourcentages", pret:true, ds:true,
  cartes:[
    {
      k:"DÉFINITION", t:"On multiplie toujours par le même nombre",
      c:`<p>Une suite est <b>géométrique</b> s'il existe un réel <span class="v">q</span> non nul tel que :</p>
        <div class="show"><span class="v">u<sub>n+1</sub></span> = <span class="v">q</span> × <span class="v">u<sub>n</sub></span></div>
        <p>Ce nombre <span class="v">q</span> s'appelle aussi la <b>raison</b>.</p>
        <div class="show">3,&nbsp; 6,&nbsp; 12,&nbsp; 24,&nbsp; 48,&nbsp; … &nbsp;&nbsp;(<span class="v">q</span> = 2)</div>
        <div class="note"><b>Même mot, autre rôle.</b> Chez les arithmétiques on <b>ajoute</b> la raison. Ici on <b>multiplie</b> par elle.</div>`,
      lent:`<p><b>Les bactéries.</b></p>
        <p>Une bactérie se divise en deux chaque heure. Au départ il y en a 3.</p>
        <p>Heure 0 : 3 · heure 1 : 6 · heure 2 : 12 · heure 3 : 24…</p>
        <p>À chaque étape on <b>multiplie par 2</b>. C'est une suite géométrique de raison 2.</p>
        <p><b>La différence avec l'arithmétique.</b></p>
        <p>Arithmétique : +5, +5, +5 → ça monte <b>régulièrement</b>, comme un escalier.<br>
           Géométrique : ×2, ×2, ×2 → ça monte de plus en plus vite, ça <b>explose</b>.</p>
        <p>20, 25, 30, 35 (arithmétique) contre 20, 40, 80, 160 (géométrique). Même départ, rien à voir après quelques pas.</p>`
    },
    {
      k:"RECONNAÎTRE", t:"Le quotient doit être constant",
      c:`<p>On divise chaque terme par le précédent. Si le résultat est toujours le même, la suite est géométrique.</p>
        <div class="show">6/3 = 2&nbsp;;&nbsp; 12/6 = 2&nbsp;;&nbsp; 24/12 = 2</div>
        <p>Le quotient vaut 2 partout → suite géométrique de raison 2.</p>
        <div class="note"><b>Comparaison.</b> Arithmétique → on regarde la <b>différence</b>. Géométrique → on regarde le <b>quotient</b>.</div>`,
      lent:`<p><b>Comment choisir quoi tester ?</b></p>
        <p>Devant une liste de nombres, pose-toi la question dans cet ordre :</p>
        <p><b>1. J'ajoute toujours la même chose ?</b> Teste les différences.<br>
        7, 11, 15, 19 → écarts 4, 4, 4 → arithmétique.</p>
        <p><b>2. Sinon, je multiplie toujours par la même chose ?</b> Teste les quotients.<br>
        3, 6, 12, 24 → quotients 2, 2, 2 → géométrique.</p>
        <p><b>Indice visuel.</b> Si les nombres grandissent lentement et régulièrement → probablement arithmétique. S'ils s'emballent (3, 6, 12, 24, 48…) → probablement géométrique.</p>`
    },
    {
      k:"FORMULE", t:"Le terme général",
      c:`<p>Pour aller de <span class="v">u<sub>0</sub></span> à <span class="v">u<sub>n</sub></span>, on multiplie par <span class="v">q</span> exactement <span class="v">n</span> fois :</p>
        <div class="show"><span class="v">u<sub>n</sub></span> = <span class="v">u<sub>0</sub></span> × <span class="v">q</span><sup><span class="v">n</span></sup></div>
        <p>Forme générale :</p>
        <div class="show"><span class="v">u<sub>n</sub></span> = <span class="v">u<sub>p</sub></span> × <span class="v">q</span><sup><span class="v">n − p</span></sup></div>
        <div class="note"><b>L'exposant est le nombre de pas.</b> Chez les arithmétiques ce nombre multipliait <span class="v">r</span> ; ici il devient l'exposant de <span class="v">q</span>.</div>`,
      lent:`<p><b>Pourquoi une puissance ?</b></p>
        <p>Reprends les bactéries : 3 au départ, ×2 chaque heure.</p>
        <p>Après 4 heures, tu as multiplié par 2 quatre fois de suite :</p>
        <div class="show">3 × 2 × 2 × 2 × 2 = 3 × 2<sup>4</sup> = 48</div>
        <p>« Multiplier quatre fois par 2 » s'écrit 2<sup>4</sup>. La puissance, c'est juste une écriture courte.</p>
        <p><b>Le parallèle avec l'arithmétique.</b></p>
        <p>Arithmétique : ajouter <span class="v">r</span> quatre fois = + 4<span class="v">r</span><br>
           Géométrique : multiplier par <span class="v">q</span> quatre fois = × <span class="v">q</span><sup>4</sup></p>
        <p>Même logique, l'une avec des additions, l'autre avec des multiplications.</p>`

          <div style="margin-bottom:11px"><b>Majorée</b> : il existe <span class="v">M</span> tel que <span class="v">u<sub>n</sub></span> ⩽ <span class="v">M</span> pour tout <span class="v">n</span></div>
          <div style="margin-bottom:11px"><b>Minorée</b> : il existe <span class="v">m</span> tel que <span class="v">u<sub>n</sub></span> ⩾ <span class="v">m</span> pour tout <span class="v">n</span></div>
          <div><b>Bornée</b> : majorée <b>et</b> minorée</div>
        </div>
        <p><span class="v">M</span> s'appelle un <b>majorant</b>, <span class="v">m</span> un <b>minorant</b>.</p>
        <div class="note"><b>Article indéfini.</b> On dit « <b>un</b> majorant », pas « le » : s'il en existe un, il en existe une infinité d'autres au-dessus.</div>`,
      lent:`<p><b>Le plafond de la pièce.</b></p>
        <p>Tu sautes dans une pièce. Tu ne peux pas dépasser le plafond, à 2,50 m. Le plafond <b>majore</b> ta hauteur.</p>
        <p>Le sol, lui, te <b>minore</b> : tu ne descends jamais en dessous de 0.</p>
        <p>Tu es donc <b>borné</b> entre le sol et le plafond.</p>
        <p><b>Un détail important.</b> Le toit de l'immeuble est aussi un majorant — tu ne le dépasses pas non plus. Et le ciel aussi. Il y a une infinité de majorants.</p>
        <p>C'est pour ça qu'on dit « <b>un</b> majorant » : il suffit d'en trouver un seul pour prouver que la suite est majorée. Pas besoin du plus petit.</p>
        <p><b>Et on ne le touche pas forcément.</b> Si tu sautes à 1,80 m maximum, le plafond à 2,50 m reste un majorant valable, même si tu ne l'atteins jamais.</p>`
    },
    {
      k:"MÉTHODE", t:"Comment montrer qu'une suite est majorée",
      c:`<p>Pour prouver <span class="v">u<sub>n</sub></span> ⩽ <span class="v">M</span>, on étudie le signe de <span class="v">u<sub>n</sub> − M</span>.</p>
        <p>Si on montre que <span class="v">u<sub>n</sub> − M</span> ⩽ 0 pour tout <span class="v">n</span>, c'est gagné.</p>
        <p>Exemple : montrer que <span class="v">u<sub>n</sub></span> = <span class="v">n</span>/(<span class="v">n</span>+1) est majorée par 1.</p>

        <p>Le numérateur est négatif, le dénominateur positif : le quotient est négatif. Donc <span class="v">u<sub>n</sub></span> &lt; 1.</p>`,
      lent:`<p><b>La technique de la soustraction.</b></p>
        <p>Comment prouver que tu es plus petit que ton frère ? Tu mesures la différence : si « toi moins lui » donne un nombre négatif, tu es plus petit.</p>
        <p>En maths, pareil. Pour montrer <span class="v">u<sub>n</sub></span> ⩽ 3, on calcule <span class="v">u<sub>n</sub></span> − 3 et on montre que c'est négatif.</p>
        <p><b>Pourquoi ne pas comparer directement ?</b></p>
        <p>Parce qu'une soustraction se simplifie, alors qu'une inégalité se manipule mal. Après calcul, on tombe souvent sur une fraction dont le signe se lit d'un coup d'œil.</p>
        <p><b>La règle des signes pour une fraction :</b></p>
        <p>négatif ÷ positif = <b>négatif</b><br>positif ÷ positif = <b>positif</b></p>
        <p>Il suffit donc de regarder le signe du haut et celui du bas séparément.</p>`

function moduleStats(m){

  const done = chs.filter(c=>DB.ch[c.n] && DB.ch[c.n].done).length;
  const exos = chs.reduce((s,c)=>s+(c.series||[]).flat().length,0);
  return { total:chs.length, done, exos, chs };
}

}

/* ═══ SWIPE — la carte suit le doigt ═══ */
function isTouchDevice(){
  return window.matchMedia("(pointer:coarse)").matches && window.innerWidth < 900;
}

/* ═══════════ CARROUSEL ═══════════ */

const GAP = 14;
let CAR = null;   /* état du carrousel */

function slideWidth(){
  const vp = $("viewport");
  return (vp ? vp.offsetWidth : window.innerWidth) + GAP;
}

function trackTo(i, animate){
  const tr = $("track");
  if(!tr) return;
  tr.style.transition = animate
    ? "transform 340ms var(--e)"
    : "none";
  tr.style.transform = `translate3d(${-i * slideWidth()}px,0,0)`;
}

let FLOOR = 0;   /* hauteur de la fiche la plus haute — bureau uniquement */

function measureFloor(){
  const tr = $("track");
  if(!tr || isTouchDevice()){ FLOOR = 0; return; }
  let max = 0;
  Array.from(tr.children).forEach(s=>{
    if(s.offsetHeight > max) max = s.offsetHeight;
  });
  FLOOR = max;
}

function fitHeight(animate, ms){
  const vp = $("viewport"), tr = $("track");
  if(!vp || !tr) return;
  const s = tr.children[R.card];
  if(!s) return;
  const h = Math.max(s.offsetHeight, FLOOR);
  vp.style.transition = animate ? `height ${ms||340}ms var(--e)` : "none";
  vp.style.height = h + "px";
}

function goCard(i, fromSwipe){
  const ch = CHAPITRES[R.ch-1];
  i = Math.max(0, Math.min(ch.cartes.length-1, i));
  if(i === R.card && fromSwipe){ trackTo(i, true); return; }
  R.card = i;
  trackTo(i, true);
  fitHeight(true);
  refreshCardUI();
}

/* boutons, points, entête — sans redessiner les cartes */
function refreshCardUI(){
  const ch = CHAPITRES[R.ch-1];
  const last = R.card === ch.cartes.length-1;

  $("w-step").textContent = `Fiche ${R.card+1} / ${ch.cartes.length}`;
  $("w-fill").style.width = ((R.card+1)/(ch.cartes.length+R.queue.length)*100)+"%";

  const dots = document.querySelectorAll(".dot");
  dots.forEach((d,i)=> d.classList.toggle("on", i===R.card));

  const prev = $("cprev"), next = $("cnext");
  if(prev) prev.disabled = R.card === 0;
  if(next) next.textContent = last ? "Aux exercices" : "Suivant";

  /* téléphone : le bouton n'apparaît qu'à la dernière fiche */
  const dock = $("dock");
  if(isTouchDevice()){
    if(last){
      $("go").textContent = "Aux exercices";
      $("go").onclick = ()=>{ R.qi=0; drawQ(); };
      dock.classList.add("up");
    } else {
      dock.classList.remove("up");
    }
  }
}

function bindCarousel(){
  const vp = $("viewport"), tr = $("track");
  if(!vp || !tr) return;
  const ch = CHAPITRES[R.ch-1];
  if(!ch.cartes || ch.cartes.length < 2) return;
  if(!isTouchDevice()) return;

  let x0=0, y0=0, dx=0, base=0;
  let lastX=0, lastT=0, vel=0;
  let active=false, decided=false, horiz=false;

  const onStart = e=>{
    const p = e.touches[0];
    x0=p.clientX; y0=p.clientY; dx=0; vel=0;
    lastX=p.clientX; lastT=performance.now();
    base = -R.card * slideWidth();
    active=true; decided=false; horiz=false;
    tr.style.transition = "none";
  };

  const onMove = e=>{
    if(!active) return;
    const p = e.touches[0];
    dx = p.clientX - x0;
    const dy = p.clientY - y0;

    if(!decided){
      const ax=Math.abs(dx), ay=Math.abs(dy);
      if(ax < 6 && ay < 6) return;
      decided = true;
      horiz = ax > ay;
      if(!horiz){ active=false; return; }
    }
    if(e.cancelable) e.preventDefault();

    const now = performance.now(), dt = now - lastT;
    if(dt > 0){ vel = (p.clientX - lastX)/dt; lastX = p.clientX; lastT = now; }

    /* résistance aux extrémités */
    let move = dx;
    const first = R.card === 0, last = R.card === ch.cartes.length-1;
    if((first && dx > 0) || (last && dx < 0)){
      const r = Math.abs(dx);
      move = Math.sign(dx) * (r / (1 + r/160)) * 0.55;
    }
    tr.style.transform = `translate3d(${base + move}px,0,0)`;
  };

  const onEnd = ()=>{
    if(!active) return;
    active = false;
    if(!horiz) return;

    const w = slideWidth();
    const fast = Math.abs(vel) > 0.4;
    const far  = Math.abs(dx) > w * 0.25;
    let target = R.card;

    if((fast && Math.abs(dx) > 24) || far){
      target = dx < 0 ? R.card + 1 : R.card - 1;
    }
    goCard(target, true);
  };

  vp.addEventListener("touchstart", onStart, {passive:true});
  vp.addEventListener("touchmove",  onMove,  {passive:false});
  vp.addEventListener("touchend",   onEnd,   {passive:true});
  vp.addEventListener("touchcancel",onEnd,   {passive:true});
}

function drawCard(){
  R.mode = "card";
  padHide();
  const ch = CHAPITRES[R.ch-1];
  const touch = isTouchDevice();

  const slides = ch.cartes.map((c,i)=>`
    <div class="slide">
      <div class="card">
        <div class="card-k">${c.k}</div>
        <h3>${c.t}</h3>
        ${c.c}
        ${c.lent ? `
          <button class="slow-btn" data-slow="${i}">
            <span>Je n'ai pas compris</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="slow"><div class="slow-in">${c.lent}</div></div>` : ``}
      </div>
    </div>`).join("");

  $("stage").innerHTML = `
    <div class="viewport" id="viewport">
      <div class="track" id="track">${slides}</div>
    </div>
    ${ch.cartes.length>1 ? `<div class="swipe-hint">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      glisse pour changer de fiche
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>` : ``}
    <div class="dots">${ch.cartes.map((_,i)=>`<span class="dot ${i===R.card?'on':''}" data-go="${i}"></span>`).join("")}</div>
    ${touch ? `` : `<div class="nav2">
      <button class="gh" id="cprev">Précédent</button>
      <button class="pri" id="cnext">Suivant</button>
    </div>`}`;

  /* position initiale sans animation */
  trackTo(R.card, false);
  requestAnimationFrame(()=>{
    measureFloor();
    fitHeight(false);
    requestAnimationFrame(()=> trackTo(R.card, false));
  });

  /* accordéon « je n'ai pas compris » — hauteur exacte, mouvement conjoint */
  document.querySelectorAll("[data-slow]").forEach(btn=>{
    btn.onclick = ()=>{
      const box  = btn.nextElementSibling;
      const inner = box.firstElementChild;
      const vp   = $("viewport");
      const slide = btn.closest(".slide");
      const opening = !box.classList.contains("open");

      btn.querySelector("span").textContent = opening ? "Masquer" : "Je n'ai pas compris";
      btn.classList.toggle("open", opening);

      if(opening){
        DB.aides=(DB.aides||0)+1; save();

        /* hauteur réelle du contenu, sans plafond */
        const h = inner.scrollHeight;
        box.classList.add("open");
        box.style.maxHeight = h + "px";

        /* la carte grandit exactement de la même quantité, en même temps */
        if(vp && slide){
          const target = slide.offsetHeight + h + 16;
          vp.style.height = Math.max(target, FLOOR) + "px";
          /* ajustement fin une fois l'ouverture terminée */
          setTimeout(()=>{
            box.style.maxHeight = "none";
            fitHeight(true, 160);
          }, 470);
        }
      } else {
        /* fixer la hauteur courante avant de replier */
        box.style.maxHeight = inner.scrollHeight + "px";
        void box.offsetHeight;
        box.classList.remove("open");
        box.style.maxHeight = "0px";
        if(vp){
          const target = slide.offsetHeight - inner.scrollHeight - 16;
          vp.style.height = Math.max(target, FLOOR) + "px";
          setTimeout(()=>fitHeight(true, 160), 470);
        }
      }
    };
  });

  /* points cliquables */
  document.querySelectorAll("[data-go]").forEach(d=>{
    d.onclick = ()=> goCard(parseInt(d.dataset.go));
  });

  if(!touch){
    $("cprev").onclick = ()=> goCard(R.card-1);
    $("cnext").onclick = ()=>{
      if(R.card === ch.cartes.length-1){ R.qi=0; drawQ(); }
      else goCard(R.card+1);
    };
  }

  $("dock").classList.remove("up");
  bindCarousel();
  refreshCardUI();

  if(!drawCard._resize){
    drawCard._resize = true;
    window.addEventListener("resize", ()=>{
      if(R.mode === "card"){ trackTo(R.card, false); measureFloor(); fitHeight(false); }
    });
  }
}


/* ═══════════ PAVÉ NUMÉRIQUE ═══════════ */

let PAD = { open:false, val:"" };

function padShow(){
  if(!isTouchDevice()) return;
  PAD.open = true;
  $("pad").classList.add("up");
  $("dock").classList.remove("up");
  /* laisser de la place sous le contenu */
  const h = $("pad").offsetHeight;
  $("s-work").style.paddingBottom = h + "px";
  setTimeout(()=>{
    const inp = $("nin");
    if(inp) inp.scrollIntoView({block:"center", behavior:"smooth"});
  }, 120);
}

function padHide(){
  PAD.open = false;
  $("pad").classList.remove("up");
  $("s-work").style.paddingBottom = "";
}

function padSet(v){
  PAD.val = v;
  const inp = $("nin");
  if(inp) inp.value = v;
}

function padKey(k){
  const inp = $("nin");
  if(!inp || inp.disabled) return;

  if(k === "ok"){ answerNum(); return; }

  let v = PAD.val;
  if(k === "del"){
    v = v.slice(0, -1);
  } else if(k === "-"){
    v = v.startsWith("-") ? v.slice(1) : "-" + v;
  } else if(k === ","){
    if(v.includes(",") || v.includes(".")) return;
    v = (v === "" || v === "-") ? v + "0," : v + ",";
  } else {
    if(v.replace(/[-,]/g,"").length >= 9) return;
    v = v + k;
  }
  padSet(v);

  /* retour visuel : enlever l'état d'erreur dès qu'on tape */
  inp.classList.remove("bad");
}

function bindPad(){
  document.querySelectorAll("[data-k]").forEach(b=>{
    b.onclick = e=>{ e.preventDefault(); padKey(b.dataset.k); };
  });
}

/* ═══════════ ВОПРОС ═══════════ */

function drawQ(){
  R.mode="q"; R.tried=false;
  padHide();
  const ch = CHAPITRES[R.ch-1];
  const q = R.queue[R.qi];
  const base = DB.ch[R.ch] && DB.ch[R.ch].done ? 0 : ch.cartes.length;
  const step = base + R.qi + 1;
  const all  = base + R.queue.length;

  $("w-step").textContent = `Exercice ${R.qi+1} / ${R.queue.length}`;
  $("w-fill").style.width = (step/all*100)+"%";

  let inner="";
  if(q.type==="qcm"){
    inner = `<div class="opts">`+q.opts.map((o,i)=>
      `<button class="opt" data-i="${i}"><span class="mark">${String.fromCharCode(65+i)}</span><span class="txt">${o.t}</span></button>`
    ).join("")+`</div>`;
  } else {
    const touch = isTouchDevice();
    inner = `<div class="num-wrap">
      <input class="num-in${touch?" pad":""}" id="nin" type="text"
             ${touch ? 'readonly inputmode="none"' : 'inputmode="decimal"'}
             autocomplete="off" placeholder="—">
      <div class="num-hint">${q.ind||""}</div>
    </div>`;
  }

  const kindHtml = q.hard ? q.k.replace("⭑",`<span class="hard">⭑</span>`) : q.k;

  $("stage").innerHTML = `
    <div class="q">
      <div class="q-kind">${kindHtml}</div>
      <p class="q-text">${q.q}</p>
      ${q.sub?`<p class="q-sub">${q.sub}</p>`:``}
      ${inner}
      <div class="aid" id="aid"></div>
      <div class="exp" id="exp"><div class="exp-in" id="expin"></div></div>
    </div>`;

  drawAid(0);
  $("dock").classList.remove("up");
  $("go").textContent="Suivant";

  if(q.type==="qcm"){
    document.querySelectorAll(".opt").forEach(b=>{ b.onclick=()=>answerQcm(parseInt(b.dataset.i)); });
    $("keys").innerHTML = q.opts.map((_,i)=>`<span><kbd>${i+1}</kbd></span>`).join("")+`<span><kbd>↵</kbd>suivant</span>`;
  } else {
    const inp=$("nin");
    PAD.val = "";
    if(isTouchDevice()){
      bindPad();
      inp.onclick = padShow;
      setTimeout(padShow, 240);
      $("dock").classList.remove("up");
    } else {
      setTimeout(()=>{ if(window.innerWidth>=900) inp.focus(); },300);
      inp.onkeydown=e=>{ if(e.key==="Enter") answerNum(); };
      $("go").textContent="Vérifier"; $("go").onclick=answerNum;
      $("dock").classList.add("up");
    }
    $("keys").innerHTML=`<span><kbd>↵</kbd>vérifier</span>`;
  }
}

/* ступенчатые подсказки */
function drawAid(level){
  const q = R.queue[R.qi];
  const box = $("aid");
  if(!q.aides || !q.sol){ box.innerHTML=""; return; }

  let html = "";
  for(let i=0;i<level && i<q.aides.length;i++){
    html += `<div class="aid-box"><span class="lbl">Indice ${i+1}</span><p>${q.aides[i]}</p></div>`;
  }
  if(level > q.aides.length){
    html += `<div class="aid-box sol"><span class="lbl">Solution</span>` +
      q.sol.map((s,i)=>`<div class="step"><span class="no">${i+1}</span><div>${s}</div></div>`).join("") +
      `</div>`;
  }
  if(level <= q.aides.length){
    const isLast = level === q.aides.length;
    html += `<button class="aid-btn ${isLast?'sol':''}" id="aid-btn">
      ${level===0 ? "Un indice" : isLast ? "Voir la solution" : "Encore un indice"}
    </button>`;
  }
  box.innerHTML = html;
  const b=$("aid-btn");
  if(b) b.onclick=()=>{
    DB.aides=(DB.aides||0)+1; R.aides++; save();
    drawAid(level+1);
  };
}

function answerQcm(i){
  const q=R.queue[R.qi];
  const btns=document.querySelectorAll(".opt");
  if(q.opts[i].ok){
    btns.forEach((b,j)=>{ b.classList.add("dead"); if(j===i) b.classList.add("good"); });
    if(!R.tried) R.first++;
    R.total++;
    openExp(true,q.opts[i].why,q.regle);
    finishQ();
  } else {
    btns[i].classList.add("bad","dead");
    R.tried=true;
    if(!R.weak.includes(R.qi)) R.weak.push(R.qi);
    openExp(false,q.opts[i].why,null);
    $("dock").classList.remove("up");
  }
}

function answerNum(){
  const q=R.queue[R.qi], inp=$("nin");
  const raw=(inp.value||"").trim().replace(",",".").replace("−","-").replace(/\s/g,"");
  if(raw==="") return;
  const val=parseFloat(raw);
  if(Math.abs(val-q.rep)<1e-9){
    inp.classList.remove("bad"); inp.classList.add("good"); inp.disabled=true;
    if(!R.tried) R.first++;
    R.total++;
    padHide();
    openExp(true,q.ok,q.regle);
    finishQ();
  } else {
    inp.classList.add("bad");
    setTimeout(()=>inp.classList.remove("bad"),400);
    R.tried=true;
    if(!R.weak.includes(R.qi)) R.weak.push(R.qi);
    openExp(false,q.no,null);
    if(isTouchDevice()){
      /* effacer et laisser le pavé ouvert pour réessayer */
      padSet("");
      if(!PAD.open) padShow();
    } else {
      inp.select();
    }
  }
}

function openExp(win,text,regle){
  const box=$("exp"), inner=$("expin");
  inner.className="exp-in "+(win?"win":"lose");
  inner.innerHTML=`
    <div class="exp-h">
      ${win
        ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Correct`
        : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="9"/></svg> Pas tout à fait`}
    </div>
    <p>${text}</p>
    ${regle?`<div class="rule"><b>À retenir.</b> ${regle}</div>`:``}
    ${!win?`<div class="rule" style="color:var(--miss)">Réessaie.</div>`:``}`;
  box.classList.add("open");
}

function finishQ(){
  padHide();
  $("dock").classList.add("up");
  const last = R.qi===R.queue.length-1;
  $("go").textContent = last ? "Terminer" : "Suivant";
  $("go").onclick = ()=>{ if(last) finishCh(); else { R.qi++; drawQ(); } };
}

function finishCh(){
  const rate = R.total ? R.first/R.total : 0;
  const stars = rate===1 ? 3 : rate>=0.5 ? 2 : 1;
  const prev = DB.ch[R.ch] || {stars:0, serie:0};
  DB.ch[R.ch] = { done:true, stars:Math.max(stars,prev.stars||0), serie:(prev.serie||0)+1 };
  bumpStreak(); save();

  $("d-s").textContent = `${R.first} / ${R.total} du premier coup`;
  $("d-h").textContent = stars===3 ? "Parfait" : stars===2 ? "Bien" : "Chapitre terminé";

  const box=$("bstars");
  box.innerHTML=[1,2,3].map(i=>
    `<svg class="bstar" viewBox="0 0 24 24" fill="${i<=stars?'#1c2024':'#d9d9e0'}"><path d="M12 2l2.9 6.3 6.6.7-4.9 4.5 1.4 6.5L12 16.8 6 20l1.4-6.5L2.5 9l6.6-.7z"/></svg>`
  ).join("");
  box.querySelectorAll(".bstar").forEach((s,i)=> setTimeout(()=>s.classList.add("pop"),120+i*170));

  const tip=$("d-tip");
  const ch=CHAPITRES[R.ch-1];
  const nextSerie = ((DB.ch[R.ch].serie)%ch.series.length)+1;
  if(R.weak.length){
    tip.style.display="block";
    tip.innerHTML=`<b>À REVOIR</b>Tu as hésité sur ${R.weak.length} exercice${R.weak.length>1?"s":""}. Relis les fiches, puis refais la série.`;
  } else if(R.aides>2){
    tip.style.display="block";
    tip.innerHTML=`<b>BON RÉFLEXE</b>Tu as utilisé les indices — c'est fait pour ça. Refais la série demain sans les ouvrir.`;
  } else { tip.style.display="none"; }

  $("d-more").textContent = "Série " + nextSerie;
  show("s-done");
}

function nextSerie(){
  startCh(R.ch);
  show("s-work");
}


$("back").onclick=()=>{ padHide(); show("s-home"); drawHome(); };
$("home-back").onclick=()=>{ show("s-mods"); drawMods(); };
$("d-home").onclick=()=>{ show("s-home"); drawHome(); };
$("d-more").onclick=nextSerie;

document.addEventListener("keydown",e=>{
  if($("s-home").classList.contains("on") && e.key==="Escape"){
    show("s-mods"); drawMods(); return;
  }
  if(!$("s-work").classList.contains("on")){
    if(e.key==="Escape"&&$("s-done").classList.contains("on")){ show("s-home"); drawHome(); }
    return;
  }
  if(R.mode==="q"){
    const q=R.queue[R.qi];
    if(q.type==="qcm"&&/^[1-9]$/.test(e.key)){
      const b=document.querySelectorAll(".opt")[parseInt(e.key)-1];
      if(b&&!b.classList.contains("dead")) b.click();
    }
    if(e.key==="Enter"&&$("dock").classList.contains("up")) $("go").click();
  }
  if(e.key==="Escape"){ show("s-home"); drawHome(); }
});

drawMods();
</script>
</body>
</html>
