    ru:"<p>Дано: <span class=\"v\">u<sub>0</sub></span> = 1 и <span class=\"v\">u<sub>n+1</sub></span> = 2<span class=\"v\">u<sub>n</sub></span> + 1.<br>Доказать: <span class=\"v\">u<sub>n</sub></span> = 2<sup><span class=\"v\">n</span>+1</sup> − 1 для всех <span class=\"v\">n</span>.</p><p><b>Инициализация.</b><br>При <span class=\"v\">n</span> = 0: формула даёт 2¹ − 1 = 1. И <span class=\"v\">u<sub>0</sub></span> = 1 по условию. Совпало ✓</p><p><b>Наследственность.</b><br>Пусть для некоторого фиксированного <span class=\"v\">n</span> верно <span class=\"v\">u<sub>n</sub></span> = 2<sup><span class=\"v\">n</span>+1</sup> − 1.<br>Тогда:<br><span class=\"v\">u<sub>n+1</sub></span> = 2<span class=\"v\">u<sub>n</sub></span> + 1<br>= 2(2<sup><span class=\"v\">n</span>+1</sup> − 1) + 1<br>= 2<sup><span class=\"v\">n</span>+2</sup> − 2 + 1<br>= 2<sup><span class=\"v\">n</span>+2</sup> − 1</p><p>А это ровно формула для ранга <span class=\"v\">n</span>+1 ✓</p><p><b>Вывод.</b> По принципу индукции формула верна для всех натуральных <span class=\"v\">n</span>.</p>",
    fr:"<p>On donne : <span class=\"v\">u<sub>0</sub></span> = 1 et <span class=\"v\">u<sub>n+1</sub></span> = 2<span class=\"v\">u<sub>n</sub></span> + 1.<br>Montrer : <span class=\"v\">u<sub>n</sub></span> = 2<sup><span class=\"v\">n</span>+1</sup> − 1 pour tout <span class=\"v\">n</span>.</p><p><b>Initialisation.</b><br>Pour <span class=\"v\">n</span> = 0 : la formule donne 2¹ − 1 = 1. Or <span class=\"v\">u<sub>0</sub></span> = 1. ✓</p><p><b>Hérédité.</b><br>Supposons que pour un entier <span class=\"v\">n</span> fixé, <span class=\"v\">u<sub>n</sub></span> = 2<sup><span class=\"v\">n</span>+1</sup> − 1.<br>Alors :<br><span class=\"v\">u<sub>n+1</sub></span> = 2<span class=\"v\">u<sub>n</sub></span> + 1<br>= 2(2<sup><span class=\"v\">n</span>+1</sup> − 1) + 1<br>= 2<sup><span class=\"v\">n</span>+2</sup> − 2 + 1<br>= 2<sup><span class=\"v\">n</span>+2</sup> − 1</p><p>C'est exactement la formule au rang <span class=\"v\">n</span>+1 ✓</p><p><b>Conclusion.</b> Par le principe de récurrence, la formule est vraie pour tout entier naturel <span class=\"v\">n</span>.</p>"}},

  {k:"ds", h:{
    ru:"<p>Готовый скелет — запомнить дословно:</p><p><i>Montrons par récurrence que pour tout entier naturel n, P(n) est vraie.</i></p><p><i><b>Initialisation.</b> Pour n = 0, … Donc P(0) est vraie.</i></p><p><i><b>Hérédité.</b> Supposons que pour un entier naturel n fixé, P(n) soit vraie. Montrons que P(n+1) est vraie. …</i></p><p><i><b>Conclusion.</b> D'après le principe de récurrence, P(n) est vraie pour tout entier naturel n.</i></p>",
    fr:"<p>Le squelette à connaître par cœur :</p><p><i>Montrons par récurrence que pour tout entier naturel n, P(n) est vraie.</i></p><p><i><b>Initialisation.</b> Pour n = 0, … Donc P(0) est vraie.</i></p><p><i><b>Hérédité.</b> Supposons que pour un entier naturel n fixé, P(n) soit vraie. Montrons que P(n+1) est vraie. …</i></p><p><i><b>Conclusion.</b> D'après le principe de récurrence, P(n) est vraie pour tout entier naturel n.</i></p>"}}
]},

/* ══════════ 13 ══════════ */
{ n:13,
  t:{ru:"Пределы — limites", fr:"Limites"},
  st:{ru:"Terminale · куда уходит последовательность", fr:"Terminale · vers quoi tend la suite"},
  b:[
  {k:"pourquoi", h:{
    ru:"<b>Зачем это нужно.</b> Вопрос «что будет очень далеко, через миллион шагов» — и есть предел. На нём строится половина Terminale.",
    fr:"<b>À quoi ça sert.</b> La question « que se passe-t-il très loin, après un million d'étapes » — c'est la limite. La moitié du programme de Terminale repose dessus."}},

  {k:"image", h:{
    ru:"<p><b>Три судьбы последовательности.</b></p><p><b>Уходит в бесконечность</b> — растёт и растёт, ничто её не держит. Пишут lim = +∞.</p><p><b>Приходит к числу</b> — подбирается всё ближе к какой-то отметке и оседает возле неё. Говорят «сходится», <i>converge</i>.</p><p><b>Болтается</b> — прыгает туда-сюда и никуда не приходит. Например, (−1)<sup><span class=\"v\">n</span></sup>: 1, −1, 1, −1… Предела нет.</p>",
    fr:"<p><b>Trois destins possibles.</b></p><p><b>Partir à l'infini</b> — elle monte sans fin, rien ne la retient. On écrit lim = +∞.</p><p><b>Arriver sur un nombre</b> — elle se rapproche d'une valeur et s'y installe. On dit qu'elle <i>converge</i>.</p><p><b>Osciller</b> — elle saute d'un côté à l'autre sans se fixer. Par exemple (−1)<sup><span class=\"v\">n</span></sup> : 1, −1, 1, −1… Pas de limite.</p>"}},

  {k:"piege", n:{ru:"Расходится ≠ уходит в бесконечность", fr:"Diverger ≠ tendre vers l'infini"}, h:{
    ru:"<p>Последовательность (−1)<sup><span class=\"v\">n</span></sup> расходится — у неё нет предела. Но она <b>не уходит в бесконечность</b>: все её члены зажаты между −1 и 1.</p><p>Расходиться — значит просто «не иметь предела». Причины бывают разные: либо улетела, либо болтается.</p>",
    fr:"<p>La suite (−1)<sup><span class=\"v\">n</span></sup> diverge — elle n'a pas de limite. Mais elle <b>ne tend pas vers l'infini</b> : tous ses termes restent entre −1 et 1.</p><p>Diverger signifie simplement « ne pas avoir de limite ». Les causes diffèrent : soit ça part à l'infini, soit ça oscille.</p>"}},

  {k:"p", h:{
    ru:"<b>Пределы, которые надо знать наизусть.</b>",
    fr:"<b>Les limites à connaître par cœur.</b>"}},

  {k:"tab", h:{
    ru:"<table><tr><th>Последовательность</th><th>Предел</th></tr><tr><td><span class=\"v\">n</span></td><td>+∞</td></tr><tr><td><span class=\"v\">n</span>²</td><td>+∞</td></tr><tr><td>1 ÷ <span class=\"v\">n</span></td><td>0</td></tr><tr><td>1 ÷ <span class=\"v\">n</span>²</td><td>0</td></tr><tr><td>√<span class=\"v\">n</span></td><td>+∞</td></tr></table>",
    fr:"<table><tr><th>Suite</th><th>Limite</th></tr><tr><td><span class=\"v\">n</span></td><td>+∞</td></tr><tr><td><span class=\"v\">n</span>²</td><td>+∞</td></tr><tr><td>1 ÷ <span class=\"v\">n</span></td><td>0</td></tr><tr><td>1 ÷ <span class=\"v\">n</span>²</td><td>0</td></tr><tr><td>√<span class=\"v\">n</span></td><td>+∞</td></tr></table>"}},

  {k:"p", h:{
    ru:"<b>Предел геометрической</b> — главный случай на экзамене. Всё решает величина <span class=\"v\">q</span>.",
    fr:"<b>Limite d'une suite géométrique</b> — le cas principal au bac. Tout dépend de la valeur de <span class=\"v\">q</span>."}},

  {k:"tab", h:{
    ru:"<table><tr><th>Значение <span class=\"v\">q</span></th><th>Предел <span class=\"v\">q</span><sup><span class=\"v\">n</span></sup></th><th>Смысл</th></tr><tr><td><span class=\"v\">q</span> > 1</td><td>+∞</td><td>взрывной рост</td></tr><tr><td><span class=\"v\">q</span> = 1</td><td>1</td><td>стоит на месте</td></tr><tr><td>−1 < <span class=\"v\">q</span> < 1</td><td>0</td><td>затухает</td></tr><tr><td><span class=\"v\">q</span> ⩽ −1</td><td>нет предела</td><td>болтается</td></tr></table>",
    fr:"<table><tr><th>Valeur de <span class=\"v\">q</span></th><th>Limite de <span class=\"v\">q</span><sup><span class=\"v\">n</span></sup></th><th>Sens</th></tr><tr><td><span class=\"v\">q</span> > 1</td><td>+∞</td><td>explosion</td></tr><tr><td><span class=\"v\">q</span> = 1</td><td>1</td><td>immobile</td></tr><tr><td>−1 < <span class=\"v\">q</span> < 1</td><td>0</td><td>extinction</td></tr><tr><td><span class=\"v\">q</span> ⩽ −1</td><td>pas de limite</td><td>oscillation</td></tr></table>"}},

  {k:"image", h:{
    ru:"<p>Почему при 0 &lt; <span class=\"v\">q</span> &lt; 1 предел равен нулю — на примере.</p><p>Половинки листа бумаги: 1 → 0,5 → 0,25 → 0,125 → 0,0625…</p><p>Кусок всё меньше и меньше. До нуля никогда не дойдёт, но приблизится настолько, насколько захочешь. Это и есть предел 0.</p>",
    fr:"<p>Pourquoi la limite vaut 0 quand 0 &lt; <span class=\"v\">q</span> &lt; 1 — sur un exemple.</p><p>On coupe une feuille en deux : 1 → 0,5 → 0,25 → 0,125 → 0,0625…</p><p>Le morceau rapetisse sans fin. Il n'atteindra jamais zéro, mais s'en approchera autant qu'on veut. C'est cela, une limite nulle.</p>"}},

  {k:"ds", h:{
    ru:"<p>Формулировка ответа:</p><p><i>Comme −1 &lt; 0,8 &lt; 1, on a lim<sub>n→+∞</sub> 0,8<sup>n</sup> = 0.<br>Donc la suite (u<sub>n</sub>) converge vers 0.</i></p><p>Обрати внимание на слово <b>comme</b> в начале — оно показывает, что ты сослался на условие теоремы, а не просто назвал ответ.</p>",
    fr:"<p>Rédaction :</p><p><i>Comme −1 &lt; 0,8 &lt; 1, on a lim<sub>n→+∞</sub> 0,8<sup>n</sup> = 0.<br>Donc la suite (u<sub>n</sub>) converge vers 0.</i></p><p>Le mot <b>comme</b> au début montre que tu as vérifié la condition du théorème, et pas seulement donné le résultat.</p>"}}
]},

/* ══════════ 14 ══════════ */
{ n:14,
  t:{ru:"Смешанный тип — arithmético-géométrique", fr:"Suites arithmético-géométriques"},
  st:{ru:"Terminale · умножаем и прибавляем одновременно", fr:"Terminale · on multiplie et on ajoute"},
  b:[
  {k:"pourquoi", h:{
    ru:"<b>Зачем это нужно.</b> Это самый жизненный тип из всех. Вклад, на который каждый год капают проценты <b>и</b> который каждый год пополняют — именно такой. На экзамене встречается постоянно.",
    fr:"<b>À quoi ça sert.</b> C'est le type le plus proche de la vie réelle. Un placement qui rapporte des intérêts <b>et</b> qu'on alimente chaque année — c'est exactement ça. Très fréquent au bac."}},

  {k:"f", h:"<span class=\"v\">u<sub>n+1</sub></span> = <span class=\"v\">a</span> × <span class=\"v\">u<sub>n</sub></span> + <span class=\"v\">b</span>"},

  {k:"image", h:{
    ru:"<p><b>Вклад с пополнением.</b> На счету 2000 €. Каждый год банк добавляет 5 % процентов, а ты сам докладываешь 100 €.</p><p>Год 1: 2000 × 1,05 = 2100, плюс 100 → 2200 €</p><p>Здесь работают оба механизма сразу: умножение (проценты) и сложение (пополнение). Отсюда и название.</p>",
    fr:"<p><b>Un placement alimenté.</b> 2000 € sur un compte. Chaque année la banque ajoute 5 % d'intérêts, et tu verses 100 €.</p><p>Année 1 : 2000 × 1,05 = 2100, plus 100 → 2200 €</p><p>Les deux mécanismes agissent ensemble : multiplication (les intérêts) et addition (le versement). D'où le nom.</p>"}},

  {k:"p", h:{
    ru:"<b>Как с этим работать.</b> Напрямую формулы общего члена нет. Но есть приём: построить вспомогательную последовательность, которая окажется чисто геометрической.",
    fr:"<b>Comment s'y prendre.</b> Il n'y a pas de formule directe. Mais il existe une astuce : construire une suite auxiliaire qui, elle, sera purement géométrique."}},

  {k:"ol", items:[
    {ru:"Найти <b>неподвижную точку</b>: решить <span class=\"v\">x</span> = <span class=\"v\">a</span><span class=\"v\">x</span> + <span class=\"v\">b</span>",
     fr:"Trouver le <b>point fixe</b> : résoudre <span class=\"v\">x</span> = <span class=\"v\">a</span><span class=\"v\">x</span> + <span class=\"v\">b</span>"},
    {ru:"Положить <span class=\"v\">v<sub>n</sub></span> = <span class=\"v\">u<sub>n</sub></span> − <span class=\"v\">x</span> и доказать, что <span class=\"v\">(v<sub>n</sub>)</span> геометрическая с raison <span class=\"v\">a</span>",
     fr:"Poser <span class=\"v\">v<sub>n</sub></span> = <span class=\"v\">u<sub>n</sub></span> − <span class=\"v\">x</span> et montrer que <span class=\"v\">(v<sub>n</sub>)</span> est géométrique de raison <span class=\"v\">a</span>"},
    {ru:"Написать формулу для <span class=\"v\">v<sub>n</sub></span> и вернуться: <span class=\"v\">u<sub>n</sub></span> = <span class=\"v\">v<sub>n</sub></span> + <span class=\"v\">x</span>",
     fr:"Écrire la formule de <span class=\"v\">v<sub>n</sub></span> puis revenir : <span class=\"v\">u<sub>n</sub></span> = <span class=\"v\">v<sub>n</sub></span> + <span class=\"v\">x</span>"}
  ]},

  {k:"image", h:{
    ru:"<p><b>Что такое неподвижная точка.</b> Это значение, на котором последовательность застряла бы навсегда: подставил — получил то же самое.</p><p>Приём в том, чтобы измерять <b>расстояние до этой точки</b>, а не саму величину. Расстояние ведёт себя просто — уменьшается или растёт в <span class=\"v\">a</span> раз каждый шаг. То есть геометрически.</p>",
    fr:"<p><b>Le point fixe</b>, c'est la valeur où la suite resterait bloquée : on la remplace, on retrouve la même.</p><p>L'astuce consiste à mesurer <b>la distance à ce point</b>, pas la valeur elle-même. Cette distance se comporte simplement — elle est multipliée par <span class=\"v\">a</span> à chaque étape. Donc géométriquement.</p>"}},

  {k:"ex", n:{ru:"Разбор по шагам", fr:"Exemple détaillé"}, h:{
    ru:"<p><span class=\"v\">u<sub>0</sub></span> = 2 и <span class=\"v\">u<sub>n+1</sub></span> = 3<span class=\"v\">u<sub>n</sub></span> − 4</p><p><b>Шаг 1. Неподвижная точка.</b><br><span class=\"v\">x</span> = 3<span class=\"v\">x</span> − 4 → −2<span class=\"v\">x</span> = −4 → <span class=\"v\">x</span> = 2</p><p><b>Шаг 2. Вспомогательная.</b><br><span class=\"v\">v<sub>n</sub></span> = <span class=\"v\">u<sub>n</sub></span> − 2<br><span class=\"v\">v<sub>n+1</sub></span> = <span class=\"v\">u<sub>n+1</sub></span> − 2 = 3<span class=\"v\">u<sub>n</sub></span> − 4 − 2 = 3<span class=\"v\">u<sub>n</sub></span> − 6 = 3(<span class=\"v\">u<sub>n</sub></span> − 2) = 3<span class=\"v\">v<sub>n</sub></span></p><p>Значит <span class=\"v\">(v<sub>n</sub>)</span> геометрическая, <span class=\"v\">q</span> = 3, <span class=\"v\">v<sub>0</sub></span> = 2 − 2 = 0.</p><p><b>Шаг 3. Возврат.</b><br><span class=\"v\">v<sub>n</sub></span> = 0 × 3<sup><span class=\"v\">n</span></sup> = 0<br><span class=\"v\">u<sub>n</sub></span> = 0 + 2 = 2</p><p>Последовательность постоянна и равна двум — она стартовала ровно в неподвижной точке.</p>",
    fr:"<p><span class=\"v\">u<sub>0</sub></span> = 2 et <span class=\"v\">u<sub>n+1</sub></span> = 3<span class=\"v\">u<sub>n</sub></span> − 4</p><p><b>Étape 1. Point fixe.</b><br><span class=\"v\">x</span> = 3<span class=\"v\">x</span> − 4 → −2<span class=\"v\">x</span> = −4 → <span class=\"v\">x</span> = 2</p><p><b>Étape 2. Suite auxiliaire.</b><br><span class=\"v\">v<sub>n</sub></span> = <span class=\"v\">u<sub>n</sub></span> − 2<br><span class=\"v\">v<sub>n+1</sub></span> = <span class=\"v\">u<sub>n+1</sub></span> − 2 = 3<span class=\"v\">u<sub>n</sub></span> − 4 − 2 = 3(<span class=\"v\">u<sub>n</sub></span> − 2) = 3<span class=\"v\">v<sub>n</sub></span></p><p>Donc <span class=\"v\">(v<sub>n</sub>)</span> est géométrique, <span class=\"v\">q</span> = 3, <span class=\"v\">v<sub>0</sub></span> = 0.</p><p><b>Étape 3. Retour.</b><br><span class=\"v\">v<sub>n</sub></span> = 0 × 3<sup><span class=\"v\">n</span></sup> = 0<br><span class=\"v\">u<sub>n</sub></span> = 0 + 2 = 2</p><p>La suite est constante égale à 2 — elle démarrait exactement au point fixe.</p>"}},

  {k:"ds", h:{
    ru:"<p>Второй шаг — тот, за который дают больше всего баллов. Пишут развёрнуто:</p><p><i>Pour tout entier naturel n, v<sub>n+1</sub> = u<sub>n+1</sub> − 2 = 3u<sub>n</sub> − 6 = 3(u<sub>n</sub> − 2) = 3v<sub>n</sub>.<br>Donc (v<sub>n</sub>) est géométrique de raison 3.</i></p><p>Ключевой момент — <b>вынесение тройки за скобку</b>. Именно оно превращает выражение в геометрическое соотношение.</p>",
    fr:"<p>La deuxième étape est celle qui rapporte le plus de points. On la rédige entièrement :</p><p><i>Pour tout entier naturel n, v<sub>n+1</sub> = u<sub>n+1</sub> − 2 = 3u<sub>n</sub> − 6 = 3(u<sub>n</sub> − 2) = 3v<sub>n</sub>.<br>Donc (v<sub>n</sub>) est géométrique de raison 3.</i></p><p>Le moment clé est la <b>mise en facteur du 3</b>. C'est elle qui fait apparaître la relation géométrique.</p>"}}
]},

/* ══════════ 15 ══════════ */
{ n:15,
  t:{ru:"Двенадцать ловушек", fr:"Douze pièges classiques"},
  st:{ru:"Где теряют баллы чаще всего", fr:"Où l'on perd des points le plus souvent"},
  b:[
  {k:"pourquoi", h:{
    ru:"<b>Зачем это нужно.</b> Большая часть потерянных баллов — не от незнания темы, а от одних и тех же повторяющихся промахов. Прочитай этот список перед контрольной, он экономит больше, чем повторение теории.",
    fr:"<b>À quoi ça sert.</b> La plupart des points perdus ne viennent pas d'une méconnaissance du cours, mais des mêmes erreurs répétées. Relis cette liste avant un devoir : elle rapporte plus qu'une révision de théorie."}},

  {k:"piege", n:{ru:"1 · Индекс", fr:"1 · L'indice"}, h:{
    ru:"<p><span class=\"v\">u<sub>n+1</sub></span> — это следующий член. <span class=\"v\">u<sub>n</sub></span> + 1 — это текущий член плюс единица. <b>Разные вещи.</b></p><p>Проверка: для <span class=\"v\">u<sub>n</sub></span> = 3<span class=\"v\">n</span> имеем <span class=\"v\">u<sub>2</sub></span>+1 = 7, а <span class=\"v\">u<sub>3</sub></span> = 9.</p>",
    fr:"<p><span class=\"v\">u<sub>n+1</sub></span> est le terme suivant. <span class=\"v\">u<sub>n</sub></span> + 1 est le terme actuel plus un. <b>Ce n'est pas pareil.</b></p><p>Test : avec <span class=\"v\">u<sub>n</sub></span> = 3<span class=\"v\">n</span>, on a <span class=\"v\">u<sub>2</sub></span>+1 = 7 alors que <span class=\"v\">u<sub>3</sub></span> = 9.</p>"}},

  {k:"piege", n:{ru:"2 · Подстановка", fr:"2 · La substitution"}, h:{
    ru:"<p>Для <span class=\"v\">u<sub>n</sub></span> = 4<span class=\"v\">n</span>+1: <span class=\"v\">u<sub>n+1</sub></span> = 4(<span class=\"v\">n</span>+1)+1 = 4<span class=\"v\">n</span>+5, а <b>не</b> 4<span class=\"v\">n</span>+2.</p><p>Множитель действует на всю скобку.</p>",
    fr:"<p>Avec <span class=\"v\">u<sub>n</sub></span> = 4<span class=\"v\">n</span>+1 : <span class=\"v\">u<sub>n+1</sub></span> = 4(<span class=\"v\">n</span>+1)+1 = 4<span class=\"v\">n</span>+5, et <b>non</b> 4<span class=\"v\">n</span>+2.</p><p>Le facteur agit sur toute la parenthèse.</p>"}},

  {k:"piege", n:{ru:"3 · Счёт членов", fr:"3 · Le comptage"}, h:{
    ru:"<p>От <span class=\"v\">u<sub>0</sub></span> до <span class=\"v\">u<sub>10</sub></span> — одиннадцать членов, не десять. Считай столбы, а не пролёты.</p>",
    fr:"<p>De <span class=\"v\">u<sub>0</sub></span> à <span class=\"v\">u<sub>10</sub></span>, il y a onze termes, pas dix. Compte les piquets, pas les intervalles.</p>"}},

  {k:"piege", n:{ru:"4 · Три примера", fr:"4 · Trois exemples"}, h:{
    ru:"<p>Посчитать первые члены — это <i>conjecturer</i>, а не <i>démontrer</i>. Доказательство требует общей формулы для любого <span class=\"v\">n</span>.</p>",
    fr:"<p>Calculer les premiers termes, c'est <i>conjecturer</i>, pas <i>démontrer</i>. Une preuve exige un calcul général valable pour tout <span class=\"v\">n</span>.</p>"}},

  {k:"piege", n:{ru:"5 · Частное без условия", fr:"5 · Le quotient sans condition"}, h:{
    ru:"<p>Метод частного применим только при строго положительных членах. Не написал эту фразу — теряешь балл, даже если ответ верный.</p>",
    fr:"<p>La méthode du quotient exige des termes strictement positifs. Sans cette phrase, le point saute même si la conclusion est juste.</p>"}},

  {k:"piege", n:{ru:"6 · Проценты туда-обратно", fr:"6 · Les pourcentages qui se compensent"}, h:{
    ru:"<p>−30 % и потом +30 % не возвращают к началу: 0,7 × 1,3 = 0,91. Не хватает 9 %.</p>",
    fr:"<p>−30 % puis +30 % ne ramènent pas au départ : 0,7 × 1,3 = 0,91. Il manque 9 %.</p>"}},

  {k:"piege", n:{ru:"7 · Показатель в сумме", fr:"7 · L'exposant de la somme"}, h:{
    ru:"<p>В формуле суммы стоит <span class=\"v\">q</span><sup><span class=\"v\">n</span>+1</sup> — это число слагаемых, а не последний ранг. Проверяй на маленьком примере.</p>",
    fr:"<p>Dans la formule de somme, l'exposant est <span class=\"v\">n</span>+1 — c'est le nombre de termes, pas le dernier rang. Vérifie sur un petit cas.</p>"}},

  {k:"piege", n:{ru:"8 · Формула Гаусса", fr:"8 · La formule de Gauss"}, h:{
    ru:"<p><span class=\"v\">n</span>(<span class=\"v\">n</span>+1) ÷ 2, а не <span class=\"v\">n</span>² ÷ 2. Проверка на 1+2+3: 3×4÷2 = 6 ✓</p>",
    fr:"<p><span class=\"v\">n</span>(<span class=\"v\">n</span>+1) ÷ 2, et non <span class=\"v\">n</span>² ÷ 2. Test sur 1+2+3 : 3×4÷2 = 6 ✓</p>"}},

  {k:"piege", n:{ru:"9 · Pour tout в индукции", fr:"9 · « Pour tout » en récurrence"}, h:{
    ru:"<p>На шаге наследственности предполагают для <b>одного фиксированного</b> <span class=\"v\">n</span>. Написать «pour tout n» — значит предположить то, что доказываешь.</p>",
    fr:"<p>Dans l'hérédité, on suppose pour <b>un entier fixé</b>. Écrire « pour tout n » revient à supposer ce qu'on veut démontrer.</p>"}},

  {k:"piege", n:{ru:"10 · Расходимость", fr:"10 · La divergence"}, h:{
    ru:"<p>(−1)<sup><span class=\"v\">n</span></sup> расходится, но остаётся между −1 и 1. Расходиться — значит не иметь предела, а не улетать в бесконечность.</p>",
    fr:"<p>(−1)<sup><span class=\"v\">n</span></sup> diverge tout en restant entre −1 et 1. Diverger, c'est ne pas avoir de limite, pas forcément partir à l'infini.</p>"}},

  {k:"piege", n:{ru:"11 · Потолок как предел", fr:"11 · Le majorant pris pour limite"}, h:{
    ru:"<p>Возрастающая и мажорированная десяткой сходится — но не обязательно к десяти. Теорема даёт существование предела, не его значение.</p>",
    fr:"<p>Croissante et majorée par 10 : elle converge — mais pas forcément vers 10. Le théorème donne l'existence, pas la valeur.</p>"}},

  {k:"piege", n:{ru:"12 · Начальный ранг", fr:"12 · Le rang de départ"}, h:{
    ru:"<p>Если последовательность начинается с <span class=\"v\">u<sub>1</sub></span>, формула общего члена содержит (<span class=\"v\">n</span>−1), а не <span class=\"v\">n</span>. Перечитывай условие.</p>",
    fr:"<p>Si la suite commence à <span class=\"v\">u<sub>1</sub></span>, la formule contient (<span class=\"v\">n</span>−1) et non <span class=\"v\">n</span>. Relis l'énoncé.</p>"}}
]},

/* ══════════ 16 ══════════ */
{ n:16,
  t:{ru:"Четыре задачи с полным решением", fr:"Quatre problèmes rédigés"},
  st:{ru:"Как выглядит работа целиком", fr:"À quoi ressemble une copie complète"},
  b:[
  {k:"pourquoi", h:{
    ru:"<b>Зачем это нужно.</b> Отдельные приёмы знать мало — на контрольной нужно собрать их в одно связное решение. Вот четыре типичных задания в том виде, в каком их ждут проверяющие.",
    fr:"<b>À quoi ça sert.</b> Connaître les méthodes isolément ne suffit pas — en devoir il faut les enchaîner. Voici quatre sujets types, rédigés comme on les attend."}},

  {k:"ex", n:{ru:"Задача 1 · Абонемент", fr:"Problème 1 · L'abonnement"}, h:{
    ru:"<p><b>Условие.</b> Абонемент стоит 240 € и дорожает на 12 € в год.<br>а) Определить природу последовательности.<br>б) Выразить <span class=\"v\">u<sub>n</sub></span>.<br>в) Через сколько лет превысит 400 €?</p><p><b>Решение.</b></p><p>а) Каждый год прибавляется фиксированная сумма → последовательность арифметическая, <span class=\"v\">r</span> = 12, <span class=\"v\">u<sub>0</sub></span> = 240.</p><p>б) <span class=\"v\">u<sub>n</sub></span> = 240 + 12<span class=\"v\">n</span></p><p>в) 240 + 12<span class=\"v\">n</span> > 400<br>12<span class=\"v\">n</span> > 160<br><span class=\"v\">n</span> > 13,33<br>Первое целое: <span class=\"v\">n</span> = <b>14 лет</b></p>",
    fr:"<p><b>Énoncé.</b> Un abonnement coûte 240 € et augmente de 12 € par an.<br>a) Déterminer la nature de la suite.<br>b) Exprimer <span class=\"v\">u<sub>n</sub></span>.<br>c) Au bout de combien d'années dépasse-t-il 400 € ?</p><p><b>Solution.</b></p><p>a) Chaque année on ajoute une somme fixe → suite arithmétique, <span class=\"v\">r</span> = 12, <span class=\"v\">u<sub>0</sub></span> = 240.</p><p>b) <span class=\"v\">u<sub>n</sub></span> = 240 + 12<span class=\"v\">n</span></p><p>c) 240 + 12<span class=\"v\">n</span> > 400<br>12<span class=\"v\">n</span> > 160<br><span class=\"v\">n</span> > 13,33<br>Premier entier : <span class=\"v\">n</span> = <b>14 ans</b></p>"}},

  {k:"ex", n:{ru:"Задача 2 · Население", fr:"Problème 2 · La population"}, h:{
    ru:"<p><b>Условие.</b> Город: 80 000 жителей, убыль 2 % в год.<br>а) Природа последовательности.<br>б) Население через 10 лет.<br>в) Предел.</p><p><b>Решение.</b></p><p>а) Убыль в процентах → умножение на 0,98 → геометрическая, <span class=\"v\">q</span> = 0,98.</p><p>б) <span class=\"v\">u<sub>10</sub></span> = 80000 × 0,98¹⁰ ≈ 80000 × 0,8171 ≈ <b>65 368 жителей</b></p><p>в) Так как −1 &lt; 0,98 &lt; 1, предел 0,98<sup><span class=\"v\">n</span></sup> равен нулю.<br>Значит <span class=\"v\">u<sub>n</sub></span> → 0.</p><p><i>Замечание для ответа:</i> математически предел нулевой, но модель описывает реальность лишь на обозримом сроке.</p>",
    fr:"<p><b>Énoncé.</b> Une ville de 80 000 habitants perd 2 % par an.<br>a) Nature de la suite.<br>b) Population dans 10 ans.<br>c) Limite.</p><p><b>Solution.</b></p><p>a) Baisse en pourcentage → multiplication par 0,98 → géométrique, <span class=\"v\">q</span> = 0,98.</p><p>b) <span class=\"v\">u<sub>10</sub></span> = 80000 × 0,98¹⁰ ≈ <b>65 368 habitants</b></p><p>c) Comme −1 &lt; 0,98 &lt; 1, lim 0,98<sup><span class=\"v\">n</span></sup> = 0.<br>Donc <span class=\"v\">u<sub>n</sub></span> tend vers 0.</p><p><i>Remarque :</i> la limite est nulle mathématiquement, mais le modèle n'est réaliste que sur une durée limitée.</p>"}},

  {k:"ex", n:{ru:"Задача 3 · Накопленная сумма", fr:"Problème 3 · Le cumul"}, h:{
    ru:"<p><b>Условие.</b> В первый месяц откладывают 50 €, каждый следующий на 10 € больше.<br>а) Сколько отложат в 12-й месяц?<br>б) Сколько всего за год?</p><p><b>Решение.</b></p><p>а) Арифметическая, <span class=\"v\">u<sub>1</sub></span> = 50, <span class=\"v\">r</span> = 10.<br>Начинаем с ранга 1, значит:<br><span class=\"v\">u<sub>12</sub></span> = 50 + (12−1)×10 = 50 + 110 = <b>160 €</b></p><p>б) Сумма: 12 членов, первый 50, последний 160.<br>S = 12 × (50 + 160) ÷ 2 = 12 × 105 = <b>1 260 €</b></p>",
    fr:"<p><b>Énoncé.</b> Le premier mois on épargne 50 €, puis 10 € de plus chaque mois.<br>a) Combien le 12<sup>e</sup> mois ?<br>b) Combien au total sur l'année ?</p><p><b>Solution.</b></p><p>a) Suite arithmétique, <span class=\"v\">u<sub>1</sub></span> = 50, <span class=\"v\">r</span> = 10.<br>Le rang part de 1, donc :<br><span class=\"v\">u<sub>12</sub></span> = 50 + (12−1)×10 = <b>160 €</b></p><p>b) Somme : 12 termes, premier 50, dernier 160.<br>S = 12 × (50 + 160) ÷ 2 = <b>1 260 €</b></p>"}},

  {k:"ex", n:{ru:"Задача 4 · Вклад с пополнением", fr:"Problème 4 · Le placement alimenté"}, h:{
    ru:"<p><b>Условие.</b> 5000 € под 3 % годовых, плюс 200 € ежегодно.<br>а) Записать рекуррентное соотношение.<br>б) Вычислить <span class=\"v\">u<sub>1</sub></span> и <span class=\"v\">u<sub>2</sub></span>.<br>в) Показать, что <span class=\"v\">v<sub>n</sub></span> = <span class=\"v\">u<sub>n</sub></span> + 6666,67 геометрическая.</p><p><b>Решение.</b></p><p>а) <span class=\"v\">u<sub>n+1</sub></span> = 1,03 <span class=\"v\">u<sub>n</sub></span> + 200, <span class=\"v\">u<sub>0</sub></span> = 5000</p><p>б) <span class=\"v\">u<sub>1</sub></span> = 5000×1,03 + 200 = 5350<br><span class=\"v\">u<sub>2</sub></span> = 5350×1,03 + 200 = 5710,50 €</p><p>в) Неподвижная точка: <span class=\"v\">x</span> = 1,03<span class=\"v\">x</span> + 200 → −0,03<span class=\"v\">x</span> = 200 → <span class=\"v\">x</span> ≈ −6666,67</p><p><span class=\"v\">v<sub>n+1</sub></span> = <span class=\"v\">u<sub>n+1</sub></span> + 6666,67 = 1,03<span class=\"v\">u<sub>n</sub></span> + 200 + 6666,67<br>= 1,03(<span class=\"v\">u<sub>n</sub></span> + 6666,67) = 1,03 <span class=\"v\">v<sub>n</sub></span></p><p>Значит <span class=\"v\">(v<sub>n</sub>)</span> геометрическая с raison 1,03.</p>",

/* ═══════════ ОТРИСОВКА ═══════════ */

const $ = id => document.getElementById(id);
const LKEY = "suites.cours.lang";

let L = "ru";
try{ L = localStorage.getItem(LKEY) || "ru"; }catch(e){}

const T = {
  ru:{ sub:"Première · Terminale", toc:"Содержание",
       titre:"Последовательности<br>с самого начала",
       sous:"Всё, что нужно знать по теме, разобрано на пальцах — с примерами из жизни и готовыми формулировками для контрольной.",
       up:"К содержанию", foot:"Перейти к упражнениям", neuf:"НОВОЕ" },
  fr:{ sub:"Première · Terminale", toc:"Sommaire",
       titre:"Les suites,<br>depuis le début",
       sous:"Tout le programme expliqué simplement — avec des images concrètes et les formulations à écrire en devoir.",
       up:"Sommaire", foot:"Aux exercices", neuf:"NOUVEAU" }
};

function txt(o){ return (o && typeof o === "object") ? (o[L] || o.ru || "") : (o || ""); }

function bloc(b){
  const t = txt(b.h !== undefined ? b.h : b);
  switch(b.k){
    case "pourquoi": return `<div class="pourquoi">${t}</div>`;
    case "image":    return `<div class="image"><span class="lbl">${L==="ru"?"Представь себе":"Image mentale"}</span>${t}</div>`;
    case "f":        return `<div class="f${b.s?" small":""}">${t}</div>`;
    case "ex":       return `<div class="ex"><span class="lbl">${txt(b.n) || (L==="ru"?"Пример":"Exemple")}</span>${t}</div>`;
    case "piege":    return `<div class="piege"><span class="lbl">${txt(b.n) || (L==="ru"?"Ловушка":"Piège")}</span>${t}</div>`;
    case "ds":       return `<div class="ds"><span class="lbl">${L==="ru"?"Как писать на контрольной":"À écrire en devoir"}</span>${t}</div>`;
    case "tab":      return `<div class="scroll">${t}</div>`;
    case "code":     return `<div class="code">${t}</div>`;
    case "ul":       return `<ul>${(b.items||[]).map(i=>`<li>${txt(i)}</li>`).join("")}</ul>`;
    case "ol":       return `<ol>${(b.items||[]).map(i=>`<li>${txt(i)}</li>`).join("")}</ol>`;
    default:         return `<p>${t}</p>`;
  }
}

function dessine(){
  document.documentElement.lang = L;
  $("b-ru").classList.toggle("on", L==="ru");
  $("b-fr").classList.toggle("on", L==="fr");
  $("bar-sub").textContent = T[L].sub;
  $("toc-t").textContent   = T[L].toc;
  $("h-titre").innerHTML   = T[L].titre;
  $("h-sous").textContent  = T[L].sous;
  $("f-txt").textContent   = T[L].foot;

  $("toc-l").innerHTML = COURS.map(s=>
    `<li><a href="#s${s.n}">${txt(s.t)}${s.neuf?`<span class="neuf">${T[L].neuf}</span>`:""}</a></li>`
  ).join("");

  $("corps").innerHTML = COURS.map(s=>`
    <section class="sec" id="s${s.n}">
      <span class="sec-n">${L==="ru"?"РАЗДЕЛ":"PARTIE"} ${s.n}</span>
      <h2>${txt(s.t)}</h2>
      ${s.st ? `<p class="sec-s">${txt(s.st)}</p>` : ""}
      ${(s.b||[]).map(bloc).join("")}
      <a class="up" href="#toc">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
        ${T[L].up}
      </a>
    </section>`).join("");
}

function setLang(l){
  L = l;
  try{ localStorage.setItem(LKEY, l); }catch(e){}
  const y = window.scrollY;
  dessine();
  window.scrollTo(0, y);
}

$("b-ru").onclick = ()=> setLang("ru");
$("b-fr").onclick = ()=> setLang("fr");

dessine();
</script>
</body>
</html>
